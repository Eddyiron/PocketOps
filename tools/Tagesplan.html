<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagesplan · PocketOps</title>
  <!-- PO-ICON:ANFANG (Urfassung: _design/po-icon.svg · nachziehen mit _design/sync.mjs) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E %3Cdefs%3E %3ClinearGradient id='po' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E %3Cstop stop-color='%239E292B'/%3E %3Cstop offset='1' stop-color='%2339756F'/%3E %3C/linearGradient%3E %3C/defs%3E %3Crect width='32' height='32' rx='7.5' fill='url(%23po)'/%3E %3Cpath d='M11.4 11.6V9.8a2.2 2.2 0 0 1 2.2-2.2h4.8a2.2 2.2 0 0 1 2.2 2.2v1.8' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E %3Crect x='5' y='11.2' width='22' height='13.8' rx='2.6' fill='%23fff'/%3E %3Crect x='5' y='17.2' width='22' height='1.7' fill='url(%23po)'/%3E %3C/svg%3E">
  <!-- PO-ICON:ENDE -->
    <style>
        /* PO-TOKENS:ANFANG (Urfassung: _design/po-tokens.css · nachziehen mit _design/sync.mjs) */
        /* ======================================================================
           POCKETOPS · GEMEINSAME GESTALTUNG
           Nachschlagefassung. Die Werkzeuge laden diese Datei nicht — jedes trägt
           den Block selbst, damit es als einzelne Datei läuft. Wird hier etwas
           geändert, muss es in alle Werkzeuge nachgezogen werden.
           ====================================================================== */
        /* Breite und Höhe schließen Innenabstand und Rahmen ein. Ohne das rechnet
           der Browser sie obendrauf, und eine Angabe wie width:100% ragt über ihren
           Platz hinaus. */
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* Markenfarben */
            --po-accent:      #9E292B;
            --po-accent-dark: #852224;
            --po-teal:        #39756F;
            --po-teal-dark:   #2F635E;
            --po-slate:       #697896;
            --po-frost:       #81BED7;
            --po-frost-soft:  #D9F3FF;
            --po-teal-soft:   #E8F5F1;
            --po-slate-soft:  #E0E8F8;

            /* Flächen */
            --po-bg:          #F1F5F9;
            --po-surface:     #FFFFFF;
            --po-surface-2:   #F8FAFC;
            --po-surface-3:   #E2E8F0;
            --po-stage:       #CBD5E1;

            /* Kopfzeile */
            --po-chrome:      #0F172A;
            --po-chrome-2:    #1E293B;
            --po-chrome-line: #334155;
            --po-on-chrome:   #F8FAFC;
            --po-on-chrome-2: #94A3B8;

            /* Text */
            --po-ink:         #1E293B;
            --po-ink-2:       #475569;
            --po-ink-3:       #94A3B8;

            /* Linien */
            --po-line:        #E2E8F0;
            --po-line-2:      #CBD5E1;

            /* Zustände */
            --po-ok:          #39756F;
            --po-warn:        #D89B2B;
            --po-bad:         #9E292B;

            /* Maße */
            --po-r-sm:   4px;
            --po-r:      6px;
            --po-r-lg:  10px;
            --po-r-pill: 999px;
            --po-head-h: 64px;
            --po-shadow:    0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .10);
            --po-shadow-lg: 0 10px 24px -8px rgba(15, 23, 42, .25);
            --po-font: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            --po-mono: 'Cascadia Mono', Consolas, 'Courier New', monospace;
        }

        /* ---------- Seitengerüst ---------- */
        .po-body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--po-bg);
            color: var(--po-ink);
            font-family: var(--po-font);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        .po-main { flex: 1; overflow: auto; padding: 20px; }
        .po-wrap { max-width: 1280px; margin: 0 auto; }
        .po-wrap--wide { max-width: 1600px; margin: 0 auto; }
        .po-split { display: grid; gap: 16px; align-items: start; }
        .po-split--1-2 { grid-template-columns: minmax(280px, 1fr) 2fr; }
        .po-split--2-1 { grid-template-columns: 2fr minmax(280px, 1fr); }
        .po-split--1-1 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 1000px) {
            .po-split--1-2, .po-split--2-1, .po-split--1-1 { grid-template-columns: 1fr; }
        }
        .po-stack > * + * { margin-top: 12px; }
        .po-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* ---------- Kopfzeile und Marke ---------- */
        .po-head {
            height: var(--po-head-h);
            background: var(--po-chrome);
            color: var(--po-on-chrome);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 20px;
            flex-shrink: 0;
            box-shadow: var(--po-shadow);
            position: relative;
            z-index: 20;
        }
        .po-head-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .po-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            border-radius: var(--po-r);
            padding: 4px 6px;
            margin-left: -6px;
            transition: background-color .15s;
        }
        a.po-brand:hover { background: var(--po-chrome-2); }
        .po-mark {
            width: 34px;
            height: 34px;
            border-radius: var(--po-r-lg);
            background: linear-gradient(135deg, var(--po-accent), var(--po-teal));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }
        .po-mark svg { width: 19px; height: 19px; display: block; }
        .po-brand-text { display: flex; flex-direction: column; line-height: 1.1; }
        .po-line-name {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--po-on-chrome-2);
        }
        .po-tool-name { font-size: 17px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
        .po-chip {
            font-size: 10px;
            font-weight: 600;
            color: var(--po-on-chrome-2);
            background: var(--po-chrome-2);
            border: 1px solid var(--po-chrome-line);
            border-radius: var(--po-r-pill);
            padding: 3px 9px;
            white-space: nowrap;
        }
        .po-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .po-head-sep { width: 1px; height: 24px; background: var(--po-chrome-line); flex-shrink: 0; }

        /* ---------- Sprache und Anleitung in der Kopfzeile ----------
           Beides setzt po-base.js selbst in die Kopfzeile, links vor die
           Aktionen des Werkzeugs: es gehört zur Reihe, nicht zum Werkzeug. */
        .po-meta { display: flex; align-items: center; gap: 8px; }
        .po-sprach {
            display: inline-flex;
            border: 1px solid var(--po-chrome-line);
            border-radius: var(--po-r-pill);
            overflow: hidden;
            background: var(--po-chrome-2);
        }
        .po-sprach button {
            font: inherit;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            padding: 5px 10px;
            border: none;
            background: transparent;
            color: var(--po-on-chrome-2);
            cursor: pointer;
            transition: background-color .15s, color .15s;
        }
        .po-sprach button:hover { color: #fff; }
        .po-sprach button[aria-pressed="true"] { background: var(--po-accent); color: #fff; }
        .po-sprach button:focus-visible { outline: 2px solid var(--po-frost); outline-offset: -2px; }
        .po-frage {
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: var(--po-r-pill);
            border: 1px solid var(--po-chrome-line);
            background: var(--po-chrome-2);
            color: #E2E8F0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color .15s, color .15s;
        }
        .po-frage:hover { background: #2B3A4F; color: #fff; }
        .po-frage:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }

        /* Der Trinkgeldknopf steht neben dem Fragezeichen und ist genauso gebaut. Nur
           das Herz trägt Farbe — auffallen soll er, drängeln nicht. */
        .po-trinkgeld {
            font: inherit;
            font-size: 13px;
            line-height: 1;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: var(--po-r-pill);
            border: 1px solid var(--po-chrome-line);
            background: var(--po-chrome-2);
            color: #E79A9B;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color .15s, color .15s;
        }
        .po-trinkgeld:hover { background: #2B3A4F; color: #fff; }
        .po-trinkgeld:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }

        /* Ein Verweis, der wie ein Knopf aussieht, bringt die Unterstreichung mit. */
        a.po-btn { text-decoration: none; }

        /* ---------- Das Hilfefenster ---------- */
        .po-hilfe { max-height: 68vh; overflow: auto; }
        .po-hilfe p { line-height: 1.55; }
        .po-hilfe a { color: var(--po-teal); font-weight: 600; }
        .po-hilfe-titel {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--po-ink-3);
            margin: 0 0 6px;
        }
        .po-hilfe-liste { margin: 0; padding-left: 20px; }
        .po-hilfe-liste li { margin-bottom: 5px; line-height: 1.5; }
        .po-hilfe-teil { border-top: 1px solid var(--po-line); margin-top: 14px; padding-top: 12px; }

        /* ---------- Schaltflächen ---------- */
        .po-btn {
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: var(--po-r);
            border: 1px solid var(--po-line-2);
            background: var(--po-surface);
            color: var(--po-ink-2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background-color .15s, border-color .15s, color .15s;
        }
        .po-btn:hover { background: var(--po-surface-2); border-color: var(--po-slate); color: var(--po-ink); }
        .po-btn:active { transform: translateY(1px); }
        .po-btn:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }
        .po-btn[disabled] { opacity: .5; cursor: not-allowed; }

        .po-head .po-btn { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #E2E8F0; }
        .po-head .po-btn:hover { background: #2B3A4F; border-color: #475569; color: #fff; }

        .po-btn--primary { background: var(--po-accent); border-color: var(--po-accent); color: #fff; }
        .po-btn--primary:hover { background: var(--po-accent-dark); border-color: var(--po-accent-dark); color: #fff; }
        .po-head .po-btn--primary { background: var(--po-accent); border-color: var(--po-accent); color: #fff; }
        .po-head .po-btn--primary:hover { background: var(--po-accent-dark); border-color: var(--po-accent-dark); color: #fff; }

        .po-btn--go { background: var(--po-teal); border-color: var(--po-teal); color: #fff; }
        .po-btn--go:hover { background: var(--po-teal-dark); border-color: var(--po-teal-dark); color: #fff; }

        .po-btn--danger { color: var(--po-bad); border-color: #FECACA; background: #FEF2F2; }
        .po-btn--danger:hover { background: #FEE2E2; border-color: #FCA5A5; color: #7F1D1D; }
        .po-head .po-btn--danger { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #FCA5A5; }
        .po-head .po-btn--danger:hover { background: #4C1D1D; border-color: #991B1B; color: #FEE2E2; }

        .po-btn--ghost { background: transparent; border-color: transparent; color: var(--po-ink-3); padding: 5px 7px; }
        .po-btn--ghost:hover { background: var(--po-surface-3); color: var(--po-ink); border-color: transparent; }

        .po-btn--sm { font-size: 11px; padding: 4px 8px; }
        .po-btn--block { width: 100%; justify-content: center; }

        /* kleines rundes Löschen-Kreuz in Listen und Tabellen */
        .po-x {
            font: inherit;
            font-size: 10px;
            line-height: 1;
            width: 18px;
            height: 18px;
            border-radius: var(--po-r-pill);
            border: 1px solid transparent;
            background: transparent;
            color: var(--po-ink-3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color .15s, color .15s;
        }
        .po-x:hover { background: #FEE2E2; color: var(--po-bad); }

        /* ---------- Panels und Abschnitte ---------- */
        .po-panel {
            background: var(--po-surface);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow);
        }
        .po-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            background: var(--po-surface-2);
            border-bottom: 1px solid var(--po-line);
            border-radius: var(--po-r-lg) var(--po-r-lg) 0 0;
        }
        .po-panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--po-ink-2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .po-panel-body { padding: 14px; }
        .po-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--po-ink-3);
            margin: 0 0 8px;
        }
        .po-hint {
            font-size: 11px;
            color: var(--po-ink-2);
            background: var(--po-surface-2);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r);
            padding: 10px 12px;
            line-height: 1.5;
        }

        /* ---------- Eingabefelder ---------- */
        .po-label { font-size: 11px; font-weight: 600; color: var(--po-ink-2); display: block; margin-bottom: 4px; }
        .po-input, .po-select, .po-textarea {
            font: inherit;
            font-size: 12px;
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--po-line-2);
            border-radius: var(--po-r);
            background: var(--po-surface);
            color: var(--po-ink);
            box-sizing: border-box;
        }
        /* Ein Farbfeld füllt der Browser selbst aus. Ohne eigene Höhe fiele es
           gegenüber den anderen Feldern zusammen, und der Innenabstand ließe den
           Farbfleck zu klein wirken. */
        .po-input[type="color"] { height: 32px; padding: 3px; cursor: pointer; }
        .po-input:focus, .po-select:focus, .po-textarea:focus {
            outline: none;
            border-color: var(--po-frost);
            box-shadow: 0 0 0 3px rgba(129, 190, 215, .25);
        }
        .po-textarea { min-height: 72px; resize: vertical; }
        .po-search { font-size: 13px; padding: 10px 14px; border-radius: var(--po-r-lg); }
        .po-num { width: 58px; text-align: center; padding: 5px 4px; }
        .po-field { display: flex; gap: 6px; align-items: center; }
        .po-field .po-input { flex: 1; min-width: 0; }

        .po-range { width: 100%; accent-color: var(--po-teal); }
        .po-range-value { font-weight: 700; color: var(--po-teal); font-variant-numeric: tabular-nums; }

        .po-check { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; font-weight: 600; color: var(--po-ink-2); cursor: pointer; }
        .po-check input { width: 15px; height: 15px; margin-top: 1px; accent-color: var(--po-teal); flex-shrink: 0; }

        /* ---------- Karten ---------- */
        .po-card {
            background: var(--po-surface);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow);
            padding: 14px;
        }
        .po-card--pick { cursor: pointer; transition: border-color .15s, background-color .15s; }
        .po-card--pick:hover { border-color: var(--po-frost); background: var(--po-surface-2); }

        /* ---------- Tabellen ---------- */
        .po-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .po-table th, .po-table td { padding: 8px 10px; border: 1px solid var(--po-line); text-align: left; }
        .po-table th {
            background: var(--po-surface-2);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--po-ink-2);
            white-space: nowrap;
        }
        .po-table tbody tr:nth-child(even) { background: var(--po-surface-2); }
        .po-table--center th, .po-table--center td { text-align: center; }
        .po-table--center th:first-child, .po-table--center td:first-child { text-align: left; }

        /* ---------- Zustände ---------- */
        .po-badge {
            font-size: 10px;
            font-weight: 700;
            border-radius: var(--po-r-pill);
            padding: 2px 8px;
            border: 1px solid transparent;
            display: inline-block;
        }
        .po-badge--ok   { color: var(--po-ok);  background: var(--po-teal-soft); border-color: #BFE3DA; }
        .po-badge--warn { color: #92610F;       background: #FEF6E7;             border-color: #F5D9A0; }
        .po-badge--bad  { color: var(--po-bad); background: #FEF2F2;             border-color: #FECACA; }
        .po-badge--neutral { color: var(--po-ink-2); background: var(--po-surface-3); border-color: var(--po-line-2); }

        .po-empty { text-align: center; color: var(--po-ink-3); font-size: 12px; padding: 28px 16px; line-height: 1.6; }

        /* ---------- Hinweisfenster unten rechts ---------- */
        .po-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 200;
            background: var(--po-chrome);
            color: var(--po-on-chrome);
            font-size: 12px;
            font-weight: 600;
            padding: 11px 16px;
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow-lg);
            max-width: 340px;
            line-height: 1.45;
        }

        /* ---------- Dialog ---------- */
        .po-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .po-dialog {
            background: var(--po-surface);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow-lg);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .po-dialog-head { padding: 16px 18px 0; font-size: 15px; font-weight: 700; color: var(--po-ink); }
        .po-dialog-body { padding: 10px 18px 16px; font-size: 13px; color: var(--po-ink-2); line-height: 1.55; }
        .po-dialog-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 18px;
            background: var(--po-surface-2);
            border-top: 1px solid var(--po-line);
        }

        /* ---------- Bildlaufleisten ---------- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--po-line-2); border-radius: var(--po-r-pill); }
        ::-webkit-scrollbar-thumb:hover { background: var(--po-slate); }

        /* ---------- Druck ---------- */
        @media print {
            .po-head, .po-toast, .po-backdrop, .po-no-print { display: none !important; }
            .po-body { height: auto; overflow: visible; }
            .po-main { overflow: visible; padding: 0; }
            .po-panel { box-shadow: none; border-color: #ccc; }
        }
        /* PO-TOKENS:ENDE */

        /* ---------- nur für dieses Werkzeug ---------- */
        .tp-flaeche { flex: 1; display: grid; grid-template-columns: 286px 1fr; overflow: hidden; }

        /* --- Uhr im Kopf --- */
        .tp-uhr {
            display: none; align-items: center; gap: 10px; padding: 5px 7px 5px 12px;
            background: var(--po-accent); border-radius: var(--po-r-pill); max-width: 360px;
        }
        .tp-uhr.an { display: flex; }
        .tp-uhr-titel { font-size: 12px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tp-uhr-zeit { font-family: var(--po-mono); font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; flex-shrink: 0; }
        .tp-uhr button {
            font: inherit; font-size: 11px; font-weight: 700; padding: 4px 10px; flex-shrink: 0;
            border: none; border-radius: var(--po-r-pill); background: rgba(255,255,255,.22); color: #fff; cursor: pointer;
        }
        .tp-uhr button:hover { background: rgba(255,255,255,.34); }

        .tp-ansicht { display: flex; gap: 2px; background: var(--po-chrome-2); border: 1px solid var(--po-chrome-line); border-radius: var(--po-r); padding: 2px; }
        .tp-ansicht button {
            font: inherit; font-size: 11px; font-weight: 600; padding: 5px 11px; border: none;
            background: transparent; color: var(--po-on-chrome-2); border-radius: var(--po-r-sm); cursor: pointer;
        }
        .tp-ansicht button.an { background: var(--po-chrome); color: #fff; }

        /* --- Vorrat --- */

    <script>
        /* PO-BASE:ANFANG (Urfassung: _design/po-base.js · nachziehen mit _design/sync.mjs) */
        /* ======================================================================
           POCKETOPS · GEMEINSAME BAUSTEINE
           Nachschlagefassung. Die Werkzeuge laden diese Datei nicht — jedes trägt
           den Block selbst, damit es als einzelne Datei läuft.

           poToast(text)                  kurzer Hinweis unten rechts
           poConfirm(frage, opt)          Rückfrage, liefert ein Versprechen
           poAsk(titel, felder)           kleine Eingabemaske statt prompt()
                                          Feld: { name, label, wert, typ, pflicht }
                                          typ 'date', 'number', 'color' kommen vom
                                          Browser; typ 'auswahl' braucht zusätzlich
                                          optionen: [{ wert, text }] und wird zur Liste
           poEsc(text)                    Text für HTML entschärfen
           poDownload(name, text, typ)    Datei zum Herunterladen anbieten
           poReadFile(input, fn)          gewählte Datei als Text lesen
           ====================================================================== */

        function poEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        let _poToastTimer = null;
        function poToast(text, dauer = 2600) {
            let t = document.getElementById('po-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'po-toast';
                t.className = 'po-toast';
                document.body.appendChild(t);
            }
            t.textContent = text;
            t.style.display = 'block';
            clearTimeout(_poToastTimer);
            _poToastTimer = setTimeout(() => { t.style.display = 'none'; }, dauer);
        }

        function _poModal(innerHtml, aufbau) {
            const back = document.createElement('div');
            back.className = 'po-backdrop';
            back.innerHTML = `<div class="po-dialog" role="dialog" aria-modal="true">${innerHtml}</div>`;
            document.body.appendChild(back);
            const schliessen = () => { document.removeEventListener('keydown', aufTaste); back.remove(); };
            const aufTaste = e => { if (e.key === 'Escape') { e.preventDefault(); back.__abbruch && back.__abbruch(); } };
            document.addEventListener('keydown', aufTaste);
            back.addEventListener('mousedown', e => { if (e.target === back) back.__abbruch && back.__abbruch(); });
            aufbau(back, schliessen);
            return back;
        }

        function poConfirm(frage, { titel = 'Bitte bestätigen', ja = 'Ja, weiter', nein = 'Abbrechen', gefahr = false } = {}) {
            return new Promise(res => {
                _poModal(`
                    <div class="po-dialog-head">${poEsc(titel)}</div>
                    <div class="po-dialog-body">${poEsc(frage)}</div>
                    <div class="po-dialog-foot">
                        <button class="po-btn" data-nein>${poEsc(nein)}</button>
                        <button class="po-btn ${gefahr ? 'po-btn--primary' : 'po-btn--go'}" data-ja>${poEsc(ja)}</button>
                    </div>`, (back, schliessen) => {
                    const fertig = wert => { schliessen(); res(wert); };
                    back.__abbruch = () => fertig(false);
                    back.querySelector('[data-nein]').onclick = () => fertig(false);
                    back.querySelector('[data-ja]').onclick = () => fertig(true);
                    setTimeout(() => back.querySelector('[data-ja]').focus(), 30);
                });
            });
        }

        /* felder: [{ name, label, wert, typ: 'text'|'number', min, max, pflicht }]
           Ergebnis: Objekt mit den Werten, oder null bei Abbruch. */
        function poAsk(titel, felder, { ok = 'Hinzufügen' } = {}) {
            return new Promise(res => {
                /* typ: 'auswahl' erwartet zusätzlich optionen: [{ wert, text }] und wird
                   zur Liste. Alles andere geht als type an ein <input> — 'date', 'number'
                   und 'color' kommen so vom Browser, ohne eigenes Zutun. */
                const html = felder.map((f, i) => {
                    const feld = f.typ === 'auswahl'
                        ? `<select class="po-select" id="po-f-${i}">`
                          + (f.optionen || []).map(o =>
                                `<option value="${poEsc(o.wert)}"${String(o.wert) === String(f.wert) ? ' selected' : ''}>${poEsc(o.text)}</option>`
                            ).join('')
                          + `</select>`
                        : `<input class="po-input" id="po-f-${i}" type="${f.typ || 'text'}"
                               value="${poEsc(f.wert == null ? '' : f.wert)}"
                               ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''}
                               ${f.platzhalter ? `placeholder="${poEsc(f.platzhalter)}"` : ''}>`;
                    return `
                    <div style="margin-bottom:10px">
                        <label class="po-label" for="po-f-${i}">${poEsc(f.label)}</label>
                        ${feld}
                    </div>`;
                }).join('');
                _poModal(`
                    <div class="po-dialog-head">${poEsc(titel)}</div>
                    <div class="po-dialog-body"><form id="po-ask-form">${html}</form></div>
                    <div class="po-dialog-foot">
                        <button class="po-btn" data-nein>Abbrechen</button>
                        <button class="po-btn po-btn--go" data-ja>${poEsc(ok)}</button>
                    </div>`, (back, schliessen) => {
                    const fertig = wert => { schliessen(); res(wert); };
                    back.__abbruch = () => fertig(null);
                    back.querySelector('[data-nein]').onclick = () => fertig(null);
                    const senden = () => {
                        const out = {};
                        let fehlt = null;
                        felder.forEach((f, i) => {
                            const el = back.querySelector('#po-f-' + i);
                            let v = el.value.trim();
                            if (f.typ === 'number') v = v === '' ? null : Number(v);
                            if (f.pflicht !== false && (v === '' || v === null)) fehlt = fehlt || el;
                            out[f.name] = v;
                        });
                        if (fehlt) { fehlt.focus(); fehlt.style.borderColor = 'var(--po-bad)'; return; }
                        fertig(out);
                    };
                    back.querySelector('[data-ja]').onclick = senden;
                    back.querySelector('#po-ask-form').onsubmit = e => { e.preventDefault(); senden(); };
                    setTimeout(() => back.querySelector('#po-f-0') && back.querySelector('#po-f-0').focus(), 30);
                });

           Quelltext, sondern aus einem Wörterbuch: deutscher Satz → englischer

        const PO_WB_BASIS = {

        const PO_HILFE_TEXTE = {

                schritte: 'So geht es',
                tipps: 'Gut zu wissen',
                oertlich: 'Deine Arbeit bleibt auf diesem Rechner. Sie wird nirgendwohin geschickt.',

        const _poNormal = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
        const _poEscRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        let _poExakt = null, _poMuster = null;

        function _poWbBauen() {
            if (_poExakt) return;
            _poExakt = new Map();
            _poMuster = [];
            const quellen = [PO_WB_BASIS, (typeof PO_WB !== 'undefined' ? PO_WB : null)];
            for (const q of quellen) {
                if (!q) continue;
                for (const de of Object.keys(q)) {
                    const en = q[de];
                    if (!en) continue;
                    if (de.indexOf('{}') >= 0) {
                        const teile = _poNormal(de).split('{}');
                        _poMuster.push({ re: new RegExp('^' + teile.map(_poEscRe).join('([\\s\\S]*?)') + '$'), en });
                    } else {
                        _poExakt.set(_poNormal(de), en);
                    }
                }
            }
        }

        /* Was das Wörterbuch nicht kennt, wird hier gesammelt. Beim Pflegen einer
           Übersetzung zeigt poLuecken() im Browser, was noch fehlt. */
        const _poLuecken = new Set();
        function poLuecken() { return Array.from(_poLuecken).sort((a, b) => a.localeCompare(b, 'de')); }

        /* Liefert die Übersetzung oder null, wenn das Wörterbuch nichts kennt. */
        function _poNachschlagen(text) {
            _poWbBauen();
            const n = _poNormal(text);
            if (!n) return null;
            const treffer = _poExakt.get(n);
            if (treffer !== undefined) return treffer;
            for (const m of _poMuster) {
                const t = n.match(m.re);
                if (!t) continue;
                let i = 0;
                return m.en.replace(/\{\}/g, () => { i++; return t[i] === undefined ? '' : t[i]; });
            }
            if (_poLuecken.size < 2000) _poLuecken.add(n);
            return null;
        }

        /* Für Text, der nicht im Seitengerüst steht, sondern gezeichnet wird —
           auf einer Leinwand etwa. Gibt auf Deutsch den Text unverändert zurück. */
        function poT(text) {
            if (_poSpr !== 'en') return text;
            const u = _poNachschlagen(text);
            return u === null ? text : u;
        }

        /* Die englische Fassung, unabhängig von der eingestellten Sprache. Gebraucht
           dort, wo beide Sprachen zugleich gelten müssen — etwa in einem Suchfeld,
           das auch nach dem Umschalten noch finden soll. */
        function poEn(text) {
            const u = _poNachschlagen(text);
            return u === null ? text : u;
        }

        /* ---------- Die Seite umschreiben ---------- */

        const _PO_ATTR = ['placeholder', 'title', 'aria-label', 'alt'];
        const _PO_TABU = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1, PRE: 1, CODE: 1, CANVAS: 1 };

        function _poDarf(el) {
            for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
                if (_PO_TABU[e.tagName]) return false;
                if (e.isContentEditable) return false;
                if (e.hasAttribute('data-po-roh')) return false;
                if (e.hasAttribute('data-po-nur')) return false;   // steht schon in seiner Sprache
            }
            return true;
        }

        /* Längere Texte — eine ganze Seite Erklärung etwa — zerfielen im Wörterbuch
           an jedem <b> in Stücke. Dafür gibt es den zweiten Weg: zwei Blöcke, einer
           je Sprache, ausgezeichnet mit data-po-nur="de" bzw. "en". Es wird immer
           nur einer gezeigt.
           Bewusst über style.display statt über hidden: eine Klasse mit display:flex
           gewänne sonst gegen hidden, und der Block stünde trotzdem da. */
        function _poSprachbloecke() {
            document.querySelectorAll('[data-po-nur]').forEach(el => {
                el.style.display = (el.getAttribute('data-po-nur') === _poSpr) ? '' : 'none';
            });
        }

        function _poTextKnoten(k) {
            if (!k || !k.nodeValue || !k.nodeValue.trim()) return;
            if (k.nodeValue === k.__poEn) return;                 // steht schon auf Englisch
            if (!_poDarf(k.parentElement)) return;
            const neu = _poNachschlagen(k.nodeValue);
            if (neu === null) return;
            k.__poDe = k.nodeValue;
            k.nodeValue = k.nodeValue.match(/^\s*/)[0] + neu + k.nodeValue.match(/\s*$/)[0];
            k.__poEn = k.nodeValue;
        }

        function _poMerkmal(el, name) {
            if (!el || el.nodeType !== 1 || !el.hasAttribute(name)) return;
            if (!_poDarf(el)) return;
            const wert = el.getAttribute(name);
            el.__poAttrEn = el.__poAttrEn || {};
            el.__poAttrDe = el.__poAttrDe || {};
            if (wert === el.__poAttrEn[name]) return;
            const neu = _poNachschlagen(wert);
            if (neu === null) return;
            el.__poAttrDe[name] = wert;
            el.setAttribute(name, neu);
            el.__poAttrEn[name] = neu;
        }

        function _poAnwenden(wurzel) {
            if (_poSpr !== 'en' || !wurzel) return;
            if (wurzel.nodeType === 3) { _poTextKnoten(wurzel); return; }
            if (wurzel.nodeType !== 1) return;
            const lauf = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT);
            let k;
            while ((k = lauf.nextNode())) _poTextKnoten(k);
            const mit = [wurzel].concat(Array.from(wurzel.querySelectorAll('*')));
            for (const el of mit) for (const a of _PO_ATTR) if (el.hasAttribute && el.hasAttribute(a)) _poMerkmal(el, a);
        }

        function _poZurueck() {
            const lauf = document.createTreeWalker(document.documentElement, NodeFilter.SHOW_TEXT);
            let k;
            while ((k = lauf.nextNode())) {
                if (k.__poDe !== undefined && k.nodeValue === k.__poEn) { k.nodeValue = k.__poDe; k.__poEn = undefined; }
            }
            for (const el of document.querySelectorAll('*')) {
                if (!el.__poAttrDe) continue;
                for (const a of Object.keys(el.__poAttrDe)) {
                    if (el.getAttribute(a) === el.__poAttrEn[a]) el.setAttribute(a, el.__poAttrDe[a]);
                }

        let _poStill = false;
        let _poBeob = null;

        function _poBeobachten() {
            _poBeob = new MutationObserver(aenderungen => {
                if (_poStill || _poSpr !== 'en') return;
                _poStill = true;

                    for (const a of aenderungen) {
                        if (a.type === 'childList') a.addedNodes.forEach(n => {
                            _poAnwenden(n);
                            if (n.nodeType === 1 && n.querySelector && (n.hasAttribute('data-po-nur') || n.querySelector('[data-po-nur]'))) _poSprachbloecke();
                        });
                        else if (a.type === 'characterData') _poTextKnoten(a.target);
                        else if (a.type === 'attributes') _poMerkmal(a.target, a.attributeName);
                    }
                } finally {
                    _poBeob.takeRecords();          // eigene Änderungen nicht noch einmal ansehen
                    _poStill = false;
                }
            });
            _poBeob.observe(document.documentElement, {
                childList: true, subtree: true, characterData: true,
                attributes: true, attributeFilter: _PO_ATTR

        function poSpracheSetzen(spr) {
            const neu = spr === 'en' ? 'en' : 'de';

            try { localStorage.setItem('po_sprache', neu); } catch (e) { /* dann eben nur für dieses Fenster */ }

            /* Beide Fenster werden geschlossen statt übersetzt: ihr Inhalt steht als
               data-po-roh und geht am Wörterbuch vorbei. Beim nächsten Öffnen baut er
               sich in der neuen Sprache neu auf. Ohne das bliebe nach einem Wechsel

            if (hilfe) hilfe.remove();
            const trinkgeld = document.getElementById('po-trinkgeld-fenster');
            if (trinkgeld) trinkgeld.remove();
            _poStill = true;
            try {
                if (neu === 'en') _poAnwenden(document.documentElement);
                else _poZurueck();
            } finally {
                if (_poBeob) _poBeob.takeRecords();
                _poStill = false;
            }

            _poKopfMalen();

              + '<div class="po-dialog-foot"><button class="po-btn po-btn--go" data-zu>' + t.schluss + '</button></div>',

        function _poStart() {

            _poBeobachten();
            document.addEventListener('keydown', e => {
                if (e.key === 'F1') { e.preventDefault(); poHilfe(); }
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _poStart);
        else _poStart();
        /* PO-BASE:ENDE */

        /* ======================================================================
           TAGESPLAN
           Vorrat links, Zeitraster rechts. Aufgaben werden hinübergezogen und
           belegen dort so viel Platz, wie sie dauern sollen.

           Termine aus dem Firmenkalender kommen als ICS-Datei herein und liegen
           grau und unveränderlich im Hintergrund. Es wird nichts angebunden und
           nichts gesendet — der Nutzer legt die Datei selbst herüber.
           ====================================================================== */

        const SPEICHER = 'po_tagesplan';
        const PX_STUNDE = 48;
        const PX_MIN = PX_STUNDE / 60;

        const STATUS = {
            offen:    { name: 'Offen',     farbe: '#697896' },
            laeuft:   { name: 'In Arbeit', farbe: '#81BED7' },
            wartet:   { name: 'Wartet',    farbe: '#D89B2B' },
            dringend: { name: 'Dringend',  farbe: '#9E292B' },
            fertig:   { name: 'Erledigt',  farbe: '#39756F' }
        };
        const WOCHENTAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

        const el = id => document.getElementById(id);
        let zaehler = 0;
        const neueId = p => p + Date.now().toString(36) + (++zaehler).toString(36);

        let daten = {
            version: 1,
            aufgaben: [],
            bloecke: [],
            zeiten: [],
            termine: [],
            einst: { von: 7, bis: 19, raster: 15 }
        };
        let laufend = null;
        let ansicht = 'woche';
        let ankerTag = null;
        let uhrTakt = null;

        /* ---------- Datum und Zeit ---------- */

        const zweiStellig = n => String(n).padStart(2, '0');
        const dTag = d => d.getFullYear() + '-' + zweiStellig(d.getMonth() + 1) + '-' + zweiStellig(d.getDate());
        const ausTag = s => { const [j, m, t] = String(s).split('-').map(Number); return new Date(j, m - 1, t); };
        const heute = () => dTag(new Date());
        const plusTage = (s, n) => { const d = ausTag(s); d.setDate(d.getDate() + n); return dTag(d); };
        const wochenTag = s => (ausTag(s).getDay() + 6) % 7;          // 0 = Montag
        const wochenStart = s => plusTage(s, -wochenTag(s));
        const minText = m => zweiStellig(Math.floor(m / 60)) + ':' + zweiStellig(Math.round(m) % 60);
        const dauerText = m => {
            m = Math.round(m);
            if (m < 60) return m + ' min';
            const h = Math.floor(m / 60), r = m % 60;
            return r ? h + ' h ' + r + ' min' : h + ' h';
        };
        const stdText = sek => {
            const h = Math.floor(sek / 3600), m = Math.floor(sek % 3600 / 60), s = Math.floor(sek % 60);
            return zweiStellig(h) + ':' + zweiStellig(m) + ':' + zweiStellig(s);
        };
        const datumLang = s => ausTag(s).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

        /* ---------- Speichern ---------- */

        function sichern() {
            try { localStorage.setItem(SPEICHER, JSON.stringify({ daten, laufend })); }
            catch (e) { poToast('Der Stand ließ sich nicht sichern — der Browser-Speicher ist voll.', 5000); }
        }

        function pruefen(d) {
            const z = (v, min, max, vor) => { const n = parseInt(v, 10); return isFinite(n) ? Math.min(max, Math.max(min, n)) : vor; };
            const st = s => STATUS[s] ? s : 'offen';
            const tag = s => /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : heute();
            return {
                version: 1,
                aufgaben: (d.aufgaben || []).map(a => ({
                    id: String(a.id || neueId('a')), titel: String(a.titel || 'Ohne Titel'),
                    text: String(a.text || ''), status: st(a.status), dauer: z(a.dauer, 5, 1440, 60),
                    angelegt: Number(a.angelegt) || Date.now()
                })),
                bloecke: (d.bloecke || []).map(b => ({
                    id: String(b.id || neueId('b')), aufgabeId: b.aufgabeId ? String(b.aufgabeId) : null,
                    titel: String(b.titel || 'Ohne Titel'), text: String(b.text || ''), status: st(b.status),
                    datum: tag(b.datum), start: z(b.start, 0, 1439, 540), dauer: z(b.dauer, 5, 1440, 60),
                    fertig: !!b.fertig,
                    wdh: b.wdh && b.wdh.art ? {
                        art: ['taeglich', 'woechentlich', 'wochentage'].includes(b.wdh.art) ? b.wdh.art : 'woechentlich',
                        tage: Array.isArray(b.wdh.tage) ? b.wdh.tage.filter(t => t >= 0 && t <= 6) : [],
                        bis: /^\d{4}-\d{2}-\d{2}$/.test(b.wdh.bis || '') ? b.wdh.bis : ''
                    } : null,
                    ausnahmen: Array.isArray(b.ausnahmen) ? b.ausnahmen.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)) : []
                })),
                zeiten: (d.zeiten || []).map(e => ({
                    id: String(e.id || neueId('z')), titel: String(e.titel || 'Ohne Titel'),
                    aufgabeId: e.aufgabeId ? String(e.aufgabeId) : null,
                    datum: tag(e.datum), start: z(e.start, 0, 1439, 0), dauer: Math.max(0, Number(e.dauer) || 0)
                })),
                termine: (d.termine || []).map(t => ({
                    id: String(t.id || neueId('t')), titel: String(t.titel || 'Termin'),
                    datum: tag(t.datum), start: z(t.start, 0, 1439, 0), dauer: z(t.dauer, 5, 1440, 60),
                    ganztags: !!t.ganztags
                })),
                einst: {
                    von: z((d.einst || {}).von, 0, 22, 7),
                    bis: z((d.einst || {}).bis, 1, 24, 19),
                    raster: [5, 10, 15, 30].includes(Number((d.einst || {}).raster)) ? Number(d.einst.raster) : 15
                }
            };
        }

        /* ---------- Wiederholungen auflösen ---------- */

        // Ein Block mit Wiederholung ist eine Regel. Für die sichtbaren Tage
        // werden daraus einzelne Vorkommen erzeugt; der Block selbst bleibt die Regel.
        function bloeckeAn(tag) {
            const out = [];
            daten.bloecke.forEach(b => {
                if (!b.wdh) {
                    if (b.datum === tag) out.push(Object.assign({}, b, { echt: true }));
                    return;
                }
                if (tag < b.datum) return;
                if (b.wdh.bis && tag > b.wdh.bis) return;
                if ((b.ausnahmen || []).includes(tag)) return;
                let passt = false;
                if (b.wdh.art === 'taeglich') passt = true;
                else if (b.wdh.art === 'woechentlich') passt = wochenTag(tag) === wochenTag(b.datum);
                else if (b.wdh.art === 'wochentage') passt = (b.wdh.tage || []).includes(wochenTag(tag));
                if (passt) out.push(Object.assign({}, b, { echt: tag === b.datum, tagDavon: tag }));
            });
            return out.sort((x, y) => x.start - y.start);
        }

        /* ---------- Überlappung nebeneinander legen ---------- */

        function spuren(liste) {
            const sortiert = liste.slice().sort((a, b) => a.start - b.start || b.dauer - a.dauer);
            const gelegt = [];
            sortiert.forEach(b => {
                const kreuzt = gelegt.filter(g => b.start < g.start + g.dauer && g.start < b.start + b.dauer);
                let spur = 0;
                while (kreuzt.some(g => g.spur === spur)) spur++;
                b.spur = spur;
                gelegt.push(b);
            });
            // Jede Gruppe sich überschneidender Blöcke teilt sich die Breite
            gelegt.forEach(b => {
                const gruppe = gelegt.filter(g => b.start < g.start + g.dauer && g.start < b.start + b.dauer);
                b.spuren = Math.max(...gruppe.map(g => g.spur)) + 1;
            });
            return gelegt;
        }

        /* ---------- Zeichnen ---------- */

        const sichtbareTage = () => ansicht === 'tag' ? [ankerTag]
            : Array.from({ length: 7 }, (_, i) => plusTage(wochenStart(ankerTag), i));

        function render() {
            el('ansicht').querySelectorAll('button').forEach(b => b.classList.toggle('an', b.dataset.ansicht === ansicht));
            const zeigtZeiten = ansicht === 'zeiten';
            el('tagleiste').style.display = zeigtZeiten ? 'none' : '';
            el('rollen').style.display = zeigtZeiten ? 'none' : '';
            el('zeiten').style.display = zeigtZeiten ? '' : 'none';
            if (zeigtZeiten) renderZeiten(); else renderRaster();
            renderVorrat();
            sichern();
        }

        function renderVorrat() {
            const liste = el('vorrat');
            const verplant = new Set(daten.bloecke.map(b => b.aufgabeId).filter(Boolean));
            const offen = daten.aufgaben.filter(a => !verplant.has(a.id));
            el('vorrat-zahl').textContent = offen.length;
            liste.innerHTML = offen.length ? offen.map(a => karte(a)).join('')
                : '<div class="po-empty" style="padding:18px 8px">Nichts im Vorrat.<br>Oben eintippen und Enter.</div>';
            vorratVerdrahten();
        }

        function karte(a) {
            const s = STATUS[a.status];
            return `<article class="tp-karte ${a.status === 'fertig' ? 'fertig' : ''}" draggable="true" data-aufgabe="${a.id}"
                     style="border-left-color:${s.farbe}">
                <div class="tp-karte-werkzeuge">
                    <button class="po-x" title="Bearbeiten" onclick="event.stopPropagation(); aufgabeDialog('${a.id}')">✎</button>
                    <button class="po-x" title="Löschen" onclick="event.stopPropagation(); aufgabeLoeschen('${a.id}')">✕</button>
                </div>
                <div class="tp-karte-titel">${poEsc(a.titel)}</div>
                ${a.text ? `<div class="tp-karte-text">${poEsc(a.text)}</div>` : ''}
                <div class="tp-karte-fuss">
                    <span class="tp-etikett" style="background:${s.farbe}">${s.name}</span>
                    <span class="tp-dauer">${dauerText(a.dauer)}</span>
                    <button class="tp-start" onclick="event.stopPropagation(); uhrStarten('${a.id}')" title="Titel übernehmen und Zeit messen">▶ Zeit</button>
                </div>
            </article>`;
        }

        function renderRaster() {
            const tage = sichtbareTage();
            const { von, bis } = daten.einst;
            const hoehe = (bis - von) * PX_STUNDE;
            const spalten = '58px repeat(' + tage.length + ', 1fr)';

            el('tagleiste').style.gridTemplateColumns = spalten;
            el('tagleiste').innerHTML = '<div></div>' + tage.map(t => {
                const summe = bloeckeAn(t).reduce((n, b) => n + b.dauer, 0);
                const d = ausTag(t);
                return `<div class="tp-tagkopf ${t === heute() ? 'heute' : ''}">
                    <div class="tp-tagname">${WOCHENTAGE[wochenTag(t)]}</div>
                    <div class="tp-tagzahl">${d.getDate()}.${zweiStellig(d.getMonth() + 1)}.</div>
                    <div class="tp-tagsumme">${summe ? dauerText(summe) + ' verplant' : '—'}</div>
                </div>`;
            }).join('');

            let stundenHtml = '';
            for (let h = von; h <= bis; h++) {
                stundenHtml += `<div class="tp-stunde" style="top:${(h - von) * PX_STUNDE}px">${zweiStellig(h)}:00</div>`;
            }

            const raster = el('raster');
            raster.style.gridTemplateColumns = spalten;
            raster.style.height = hoehe + 'px';
            raster.innerHTML = `<div class="tp-stunden" style="height:${hoehe}px">${stundenHtml}</div>`
                + tage.map(t => spalte(t, von, bis, hoehe)).join('');

            rasterVerdrahten();
            const jetzt = raster.querySelector('.tp-jetzt');
            if (jetzt && !raster.dataset.gerollt) {
                el('rollen').scrollTop = Math.max(0, jetzt.offsetTop - 120);
                raster.dataset.gerollt = '1';
            }
        }

        function spalte(tag, von, bis, hoehe) {
            let html = '';
            for (let h = von; h <= bis; h++) {
                html += `<div class="tp-linie" style="top:${(h - von) * PX_STUNDE}px"></div>`;
                if (h < bis) html += `<div class="tp-linie halb" style="top:${(h - von + 0.5) * PX_STUNDE}px"></div>`;
            }

            // Termine und Blöcke teilen sich die Spalte. Sonst deckt ein Block
            // den Termin, mit dem er sich überschneidet, vollständig zu — und
            // genau den will man ja sehen.
            const termineTag = daten.termine.filter(t => t.datum === tag).map(t => Object.assign({}, t, {
                typ: 'termin',
                start: t.ganztags ? von * 60 : t.start,
                dauer: t.ganztags ? 30 : t.dauer
            }));
            const bloeckeTag = bloeckeAn(tag).map(b => Object.assign({}, b, { typ: 'block' }));

            spuren(termineTag.concat(bloeckeTag)).forEach(e => {
                const oben = (e.start - von * 60) * PX_MIN;
                const hoch = Math.max(17, e.dauer * PX_MIN);
                const breite = 100 / e.spuren;
                const lage = `top:${oben}px; height:${hoch - 2}px; left:calc(${e.spur * breite}% + 2px); width:calc(${breite}% - 4px)`;

                if (e.typ === 'termin') {
                    html += `<div class="tp-termin" style="${lage}" title="${poEsc(e.titel)}">
                        <b>${poEsc(e.titel)}</b>${hoch > 30 && !e.ganztags ? minText(e.start) + '–' + minText(e.start + e.dauer) : ''}
                    </div>`;
                    return;
                }

                // Wer einen Block in eine Besprechung legt, soll das sehen
                const stoert = termineTag.filter(t => !t.ganztags
                    && e.start < t.start + t.dauer && t.start < e.start + e.dauer);
                const st = STATUS[e.status];
                html += `<div class="tp-block ${e.fertig ? 'fertig' : ''} ${hoch < 34 ? 'klein' : ''} ${stoert.length ? 'kollision' : ''}"
                     data-block="${e.id}" data-tag="${tag}"
                     style="${lage}; border-left-color:${st.farbe}"
                     title="${poEsc(e.titel)} · ${minText(e.start)}–${minText(e.start + e.dauer)}">
                    ${stoert.length
                        ? '<span class="tp-warn" title="Überschneidet sich mit: ' + poEsc(stoert.map(t => t.titel).join(', ')) + '">⚠</span>'
                        : (e.wdh ? '<span class="tp-wdh" title="Wiederholt sich">↻</span>' : '')}
                    <div class="tp-block-titel">${poEsc(e.titel)}</div>
                    <div class="tp-block-zeit">${minText(e.start)}–${minText(e.start + e.dauer)}</div>
                    <div class="tp-block-griff"></div>
                </div>`;
            });

            if (tag === heute()) {
                const jetzt = new Date().getHours() * 60 + new Date().getMinutes();
                if (jetzt >= von * 60 && jetzt <= bis * 60) {
                    html += `<div class="tp-jetzt" style="top:${(jetzt - von * 60) * PX_MIN}px"></div>`;
                }
            }

            const we = wochenTag(tag) >= 5;
            return `<div class="tp-spalte ${we ? 'wochenende' : ''}" data-tag="${tag}" style="height:${hoehe}px">${html}</div>`;
        }

        function renderZeiten() {
            const nachTag = {};
            daten.zeiten.forEach(e => { (nachTag[e.datum] = nachTag[e.datum] || []).push(e); });
            const tage = Object.keys(nachTag).sort().reverse();
            const gesamt = daten.zeiten.reduce((n, e) => n + e.dauer, 0);

            el('zeiten').innerHTML = tage.length ? `
                <div class="tp-zeiten-tag" style="margin-bottom:20px">
                    <div class="po-row">
                        <span class="po-badge po-badge--ok">Gesamt ${stdText(gesamt)}</span>
                        <span class="po-badge po-badge--neutral">${daten.zeiten.length} Einträge</span>
                        <span style="flex:1"></span>
                        <button class="po-btn po-btn--sm" onclick="zeitenCsv()">Als CSV speichern</button>
                        <button class="po-btn po-btn--sm po-btn--danger" onclick="zeitenLeeren()">Alle löschen</button>
                    </div>
                </div>` + tage.map(t => {
                const eintraege = nachTag[t].slice().sort((a, b) => b.start - a.start);
                const summe = eintraege.reduce((n, e) => n + e.dauer, 0);
                return `<div class="tp-zeiten-tag">
                    <div class="tp-zeiten-kopf">
                        <span class="tp-zeiten-datum">${datumLang(t)}</span>
                        <span class="tp-zeiten-summe">${stdText(summe)}</span>
                    </div>
                    ${eintraege.map(e => `<div class="tp-zeile">
                        <input class="tp-zeile-titel" value="${poEsc(e.titel)}" onchange="zeitTitel('${e.id}', this.value)">
                        <span class="tp-zeile-zeit">${minText(e.start)}–${minText(e.start + e.dauer / 60)}</span>
                        <span class="tp-zeile-dauer">${stdText(e.dauer)}</span>
                        <button class="po-x" title="Entfernen" onclick="zeitLoeschen('${e.id}')">✕</button>
                    </div>`).join('')}
                </div>`;
            }).join('')
                : '<div class="po-empty">Noch nichts gemessen.<br>Im Vorrat oder auf einem Block auf „▶ Zeit" tippen.</div>';
        }

        /* ---------- Ziehen: Vorrat ins Raster ---------- */

        let gezogeneAufgabe = null;

        function vorratVerdrahten() {
            el('vorrat').querySelectorAll('.tp-karte').forEach(k => {
                k.addEventListener('dragstart', e => {
                    gezogeneAufgabe = k.dataset.aufgabe;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', gezogeneAufgabe);
                    setTimeout(() => k.classList.add('zieht'), 0);
                });
                k.addEventListener('dragend', () => {
                    gezogeneAufgabe = null;
                    k.classList.remove('zieht');
                    document.querySelectorAll('.tp-spalte').forEach(s => s.classList.remove('ueber'));
                });
            });
        }

        const aufsRaster = m => Math.round(m / daten.einst.raster) * daten.einst.raster;

        function rasterVerdrahten() {
            document.querySelectorAll('.tp-spalte').forEach(sp => {
                sp.addEventListener('dragover', e => {
                    if (!gezogeneAufgabe) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    sp.classList.add('ueber');
                });
                sp.addEventListener('dragleave', e => { if (!sp.contains(e.relatedTarget)) sp.classList.remove('ueber'); });
                sp.addEventListener('drop', e => {
                    e.preventDefault();
                    sp.classList.remove('ueber');
                    const id = gezogeneAufgabe || e.dataTransfer.getData('text/plain');
                    if (!id) return;
                    const a = daten.aufgaben.find(x => x.id === id);
                    if (!a) return;
                    const y = e.clientY - sp.getBoundingClientRect().top;
                    const start = Math.max(0, Math.min(1439 - a.dauer, aufsRaster(daten.einst.von * 60 + y / PX_MIN)));
                    daten.bloecke.push({
                        id: neueId('b'), aufgabeId: a.id, titel: a.titel, text: a.text, status: a.status,
                        datum: sp.dataset.tag, start, dauer: a.dauer, fertig: false, wdh: null, ausnahmen: []
                    });
                    render();
                });
                sp.addEventListener('dblclick', e => {
                    if (e.target.closest('.tp-block')) return;
                    const y = e.clientY - sp.getBoundingClientRect().top;
                    blockDialog(null, sp.dataset.tag, aufsRaster(daten.einst.von * 60 + y / PX_MIN));
                });
            });
            bloeckeVerdrahten();
        }

        /* ---------- Blöcke verschieben und in der Höhe ziehen ---------- */

        function bloeckeVerdrahten() {
            document.querySelectorAll('.tp-block').forEach(elB => {
                elB.addEventListener('dblclick', e => {
                    e.stopPropagation();
                    blockDialog(elB.dataset.block, elB.dataset.tag);
                });
                elB.addEventListener('pointerdown', e => {
                    if (e.button !== 0) return;
                    const griff = e.target.closest('.tp-block-griff');
                    e.preventDefault();
                    const b = daten.bloecke.find(x => x.id === elB.dataset.block);
                    if (!b) return;
                    const tagDavon = elB.dataset.tag;
                    const startY = e.clientY, startX = e.clientX;
                    const startWert = b.start, startDauer = b.dauer;
                    let bewegt = false;
                    elB.setPointerCapture(e.pointerId);

                    const spaltenUnter = x => {
                        const sp = document.elementsFromPoint(x, startY + 1).find(n => n.classList && n.classList.contains('tp-spalte'));
                        return sp ? sp.dataset.tag : null;
                    };

                    const bewegen = ev => {
                        const dy = ev.clientY - startY;
                        if (!bewegt && Math.abs(dy) < 3 && Math.abs(ev.clientX - startX) < 3) return;
                        bewegt = true;
                        elB.classList.add('zieht');
                        if (griff) {
                            b.dauer = Math.max(daten.einst.raster, Math.min(1440 - b.start, aufsRaster(startDauer + dy / PX_MIN)));
                        } else {
                            b.start = Math.max(0, Math.min(1440 - b.dauer, aufsRaster(startWert + dy / PX_MIN)));
                            const ziel = spaltenUnter(ev.clientX);
                            if (ziel && ziel !== (b.wdh ? b.datum : b.datum)) {
                                if (b.wdh) { /* Regeln bleiben an ihrem Wochentag */ }
                                else b.datum = ziel;
                            }
                        }
                        renderRaster();
                    };
                    const beenden = () => {
                        elB.removeEventListener('pointermove', bewegen);
                        elB.removeEventListener('pointerup', beenden);
                        elB.removeEventListener('pointercancel', beenden);
                        if (bewegt) { render(); } else { elB.classList.remove('zieht'); }
                    };
                    elB.addEventListener('pointermove', bewegen);
                    elB.addEventListener('pointerup', beenden);
                    elB.addEventListener('pointercancel', beenden);
                });
            });
        }

        /* ---------- Aufgaben ---------- */

        function schnellAnlegen() {
            const f = el('schnell');
            const titel = f.value.trim();
            if (!titel) return;
            daten.aufgaben.push({ id: neueId('a'), titel, text: '', status: 'offen', dauer: 60, angelegt: Date.now() });
            f.value = '';
            render();
        }

        function aufgabeDialog(id) {
            const a = id ? daten.aufgaben.find(x => x.id === id) : null;
            let status = a ? a.status : 'offen';
            const back = document.createElement('div');
            back.className = 'po-backdrop';
            back.id = 'tp-dialog';
            back.innerHTML = `
                <div class="po-dialog tp-dialog-breit">
                    <div class="po-dialog-head">${a ? 'Aufgabe bearbeiten' : 'Neue Aufgabe'}</div>
                    <div class="po-dialog-body">
                        <div class="tp-feld">
                            <label class="po-label" for="tp-titel">Titel</label>
                            <input class="po-input" id="tp-titel" value="${poEsc(a ? a.titel : '')}" placeholder="Worum geht es?">
                        </div>
                        <div class="tp-feld">
                            <label class="po-label" for="tp-text">Beschreibung</label>
                            <textarea class="po-textarea" id="tp-text" placeholder="Kontext, nächste Schritte">${poEsc(a ? a.text : '')}</textarea>
                        </div>

        async function blockLoeschen(id, tag) {

        /* ---------- Uhr und Zeiterfassung ---------- */

        function uhrStarten(aufgabeId) {
            const a = daten.aufgaben.find(x => x.id === aufgabeId);
            if (a) uhrStartenMitTitel(a.titel, a.id);
        }

        function uhrStartenMitTitel(titel, aufgabeId) {
            if (laufend) uhrStoppen(true);
            laufend = { titel, aufgabeId: aufgabeId || null, seit: Date.now() };
            uhrZeichnen();
            sichern();
            poToast('Zeitmessung läuft: ' + titel);
        }

        function uhrStoppen(stumm) {
            if (!laufend) return;
            const sek = Math.round((Date.now() - laufend.seit) / 1000);
            const d = new Date(laufend.seit);
            if (sek >= 5) {
                daten.zeiten.push({
                    id: neueId('z'), titel: laufend.titel, aufgabeId: laufend.aufgabeId,
                    datum: dTag(d), start: d.getHours() * 60 + d.getMinutes(), dauer: sek
                });
                if (!stumm) poToast('Gemessen: ' + stdText(sek) + ' für „' + laufend.titel + '"', 4000);
            } else if (!stumm) {
                poToast('Unter fünf Sekunden — nicht eingetragen.');
            }
            laufend = null;
            uhrZeichnen();
            render();
        }

        function uhrZeichnen() {
            const box = el('uhr');
            box.classList.toggle('an', !!laufend);
            clearInterval(uhrTakt);
            if (!laufend) return;
            el('uhr-titel').textContent = laufend.titel;
            const takt = () => { el('uhr-zeit').textContent = stdText((Date.now() - laufend.seit) / 1000); };
            takt();
            uhrTakt = setInterval(takt, 1000);

        function zeitTitel(id, wert) {
