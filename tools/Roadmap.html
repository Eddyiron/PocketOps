        function _poKopfBauen() {
            const leiste = document.querySelector('.po-head-actions');
            if (!leiste || document.querySelector('.po-meta')) return;
            const box = document.createElement('div');
            box.className = 'po-meta';
            box.innerHTML =
                '<div class="po-sprach" role="group" aria-label="Sprache / Language">'
              + '<button type="button" data-spr="de">DE</button>'
              + '<button type="button" data-spr="en">EN</button></div>'
              + '<button type="button" class="po-trinkgeld" title="Trinkgeld" aria-label="Trinkgeld">&#9829;</button>'
              + '<button type="button" class="po-frage" title="Anleitung" aria-label="Anleitung">?</button>'
              + '<div class="po-head-sep"></div>';
            leiste.insertBefore(box, leiste.firstChild);
            box.querySelectorAll('[data-spr]').forEach(b => { b.onclick = () => poSpracheSetzen(b.dataset.spr); });
            box.querySelector('.po-frage').onclick = poHilfe;
            box.querySelector('.po-trinkgeld').onclick = poTrinkgeld;
            _poKopfMalen();
        }

        /* ---------- Die Anleitung ---------- */

        /* Die Werkzeuge liegen im Ordner tools/, die Übersicht eine Ebene darüber.
           Woran sich das erkennen lässt: nur ein Werkzeug trägt das Markenzeichen als
           Rückverweis; auf der Übersicht selbst steht es als blosser Text. */
        const _poSicherungPfad = () => document.querySelector('a.po-brand') ? 'Sicherung.html' : 'tools/Sicherung.html';

        /* Die Rechner, von denen diese Seite etwas nachlädt — ohne Doppelte. */
        function _poFremdquellen() {
            return [...document.querySelectorAll('script[src], link[rel="stylesheet"][href]')]
                .map(e => e.getAttribute('src') || e.getAttribute('href'))
                .filter(u => /^https?:\/\//i.test(u || ''))
                .map(u => { try { return new URL(u).hostname; } catch (e) { return null; } })
                .filter((h, i, a) => h && a.indexOf(h) === i);
        }

        function poHilfe() {
            if (document.getElementById('po-hilfe-fenster')) return;
            const t = PO_HILFE_TEXTE[_poSpr];
            const h = (typeof PO_HILFE !== 'undefined' && PO_HILFE && PO_HILFE[_poSpr]) ? PO_HILFE[_poSpr] : null;
            const name = (document.querySelector('.po-tool-name') || {}).textContent || 'PocketOps';

            const teile = [];
            if (h && h.kurz) teile.push('<p style="margin:0 0 12px">' + h.kurz + '</p>');
            if (h && h.schritte && h.schritte.length) {
                teile.push('<div class="po-hilfe-titel">' + t.schritte + '</div>'
                         + '<ol class="po-hilfe-liste">' + h.schritte.map(s => '<li>' + s + '</li>').join('') + '</ol>');
            }
            if (h && h.tipps && h.tipps.length) {
                teile.push('<div class="po-hilfe-teil"><div class="po-hilfe-titel">' + t.tipps + '</div>'
                         + '<ul class="po-hilfe-liste">' + h.tipps.map(s => '<li>' + s + '</li>').join('') + '</ul></div>');
            }
            teile.push('<div class="po-hilfe-teil">'
                     + '<div class="po-hilfe-titel">' + t.sicherung + '</div>'
                     + '<p style="margin:0 0 8px">' + t.sofort.replace('{}', '<b>' + poEsc(poBrowser()) + '</b>') + '</p>'
                     + '<p style="margin:0 0 8px">' + t.andererBrowser + '</p>'
                     + '<p style="margin:0 0 8px">' + t.sicherungText + '</p>'
                     + '<p style="margin:0 0 8px">' + t.sicherungWarum + '</p>'
                     + '<p style="margin:0"><a href="' + _poSicherungPfad() + '">' + t.mehr + '</a></p></div>');
            /* Ein paar Werkzeuge holen sich eine Programmbibliothek aus dem Netz. Der
               Hinweis liest das aus der Seite selbst aus, statt es pauschal zu
               behaupten — so bleibt er richtig, auch wenn später eine Quelle dazukommt
               oder wegfällt. */
            const fremd = _poFremdquellen();
            teile.push('<div class="po-hilfe-teil" style="color:var(--po-ink-3);font-size:11px">'
                     + (fremd.length ? t.oertlichMitNetz.replace('{}', fremd.join(', ')) : t.oertlich)
                     + '</div>');

            const back = _poModal(
                '<div class="po-dialog-head">' + poEsc(name) + ' — ' + t.titel + '</div>'
              + '<div class="po-dialog-body po-hilfe" data-po-roh>' + teile.join('') + '</div>'
              + '<div class="po-dialog-foot"><button class="po-btn po-btn--go" data-zu>' + t.schluss + '</button></div>',
                (b, schliessen) => {
                    b.__abbruch = schliessen;
                    b.querySelector('[data-zu]').onclick = schliessen;
                    setTimeout(() => b.querySelector('[data-zu]').focus(), 30);
                });
            back.id = 'po-hilfe-fenster';
            back.querySelector('.po-dialog').style.maxWidth = '560px';
        }

        function _poStart() {
            document.documentElement.lang = _poSpr;
            _poKopfBauen();
            _poSprachbloecke();
            if (_poSpr === 'en') {
                _poStill = true;
                try { _poAnwenden(document.documentElement); } finally { _poStill = false; }
            }
            _poBeobachten();
            document.addEventListener('keydown', e => {
                if (e.key === 'F1') { e.preventDefault(); poHilfe(); }
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _poStart);
        else _poStart();
        /* PO-BASE:ENDE */

        /* ======================================================================
           POCKETOPS · ROADMAP

           Vorhaben auf einer Zeitachse, nach Bahnen getrennt. Kanban zeigt den
           Zustand einer Aufgabe, der Tagesplan einen einzigen Tag — hier geht es
           um die Frage, was von wann bis wann läuft.

           Daten stehen als 'JJJJ-MM-TT' und werden nur zum Rechnen in ein Datum
           verwandelt. Alles Sichtbare ist davon abgeleitet: aus dem Zeitraum
           aller Vorhaben ergibt sich die Spanne, aus der Zoomstufe die Breite
           eines Tages, daraus jede Lage auf dem Schirm.
           ====================================================================== */

        const SPEICHER = 'po_roadmap';
        const SEITE_AUS = 'po_roadmap_seite_aus';
        const FARBEN = ['#39756F', '#9E292B', '#2A7E9E', '#6D4AA8', '#D89B2B', '#697896'];

        /* Breite eines Tages in Bildpunkten, je Zoomstufe, dazu die Beschriftung
           der beiden Kopfzeilen. */
        const STUFEN = {
            woche:   { px: 20,  oben: 'monat', unten: 'woche' },
            monat:   { px: 4.6, oben: 'jahr',  unten: 'monat' },
            quartal: { px: 1.6, oben: 'jahr',  unten: 'quartal' }
        };
        const NAMENSBREITE = 168;
        const ZEILENHOEHE = 32;      // eine Unterspur innerhalb einer Bahn
        const MINDESTTAGE = { woche: 70, monat: 300, quartal: 760 };

        const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
                        'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
        const MONATE_KURZ = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun',
                             'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

        const el = id => document.getElementById(id);
        let zaehler = 0;
        const neueId = p => p + Date.now().toString(36) + (++zaehler).toString(36);

        let roadmaps = [];
        let aktiv = null;
        let stufe = 'monat';
        let zurueckStapel = [], vorStapel = [];

        const rm = () => roadmaps.find(r => r.id === aktiv) || null;
        const px = () => STUFEN[stufe].px;

        /* ---------- Rechnen mit Daten ----------
           Alles in Ortszeit. Die Differenz zweier Daten wird gerundet, sonst
           schlägt die Zeitumstellung durch: zwei Tage sind dann 47 oder 49
           Stunden und eine ungerundete Division ergibt 1,96 statt 2. */

        const TAG = 86400000;

        function alsDatum(s) {
            const t = String(s).split('-').map(Number);
            return new Date(t[0], (t[1] || 1) - 1, t[2] || 1);
        }
        function alsText(d) {
            return d.getFullYear() + '-' +
                   String(d.getMonth() + 1).padStart(2, '0') + '-' +
                   String(d.getDate()).padStart(2, '0');
        }
        function plusTage(s, n) {
            const d = alsDatum(s);
            d.setDate(d.getDate() + n);
            return alsText(d);
        }
        const tageZwischen = (a, b) => Math.round((alsDatum(b) - alsDatum(a)) / TAG);
        const heute = () => alsText(new Date());

        /* Kalenderwoche nach ISO 8601: die Woche, in der der erste Donnerstag
           des Jahres liegt, ist Woche 1. */
        function kalenderwoche(d) {
            const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
            const ersterDo = new Date(t.getFullYear(), 0, 4);
            return 1 + Math.round(((t - ersterDo) / TAG - 3 + ((ersterDo.getDay() + 6) % 7)) / 7);
        }

        /* Die Kurzhinweise an Balken und Rauten entstehen erst beim Zeichnen und
           enthalten eingetippte Namen — das Wörterbuch kann sie nicht erfassen.
           Deshalb richten sich Datum und Bindewort direkt nach der eingestellten
           Sprache, die _poStart in <html lang> schreibt. */
        const aufEnglisch = () => document.documentElement.lang === 'en';

        function datumLesbar(s) {
            return alsDatum(s).toLocaleDateString(aufEnglisch() ? 'en-GB' : 'de-DE',
                                                  { day: 'numeric', month: 'short', year: 'numeric' });
        }

        /* ---------- Speichern ---------- */

        function sichern() {
            if (rm()) rm().geaendert = Date.now();
            poSichern(SPEICHER, { roadmaps, aktiv, stufe });
        }

        function neueLeereRoadmap(name) {
            const b1 = neueId('b'), b2 = neueId('b');
            return {
                id: neueId('r'),
                name: name || 'Neue Roadmap',
                bahnen: [{ id: b1, name: 'Produkt' }, { id: b2, name: 'Team' }],
                vorhaben: [],
                meilensteine: [],
                geaendert: Date.now()
            };
        }

        /* Prüft eine eingelesene Liste durch, damit eine fremde oder beschädigte
           Datei das Werkzeug nicht lahmlegt. Was nicht stimmt, wird ersetzt,
           nicht verworfen — lieber ein krummes Vorhaben als eine leere Seite. */
        function pruefen(liste) {
            const datum = (v, vor) => (/^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : vor);
            const farbe = v => (/^#[0-9a-fA-F]{6}$/.test(v || '') ? v : FARBEN[0]);

            return (Array.isArray(liste) ? liste : []).map(r => {
                const bahnen = (Array.isArray(r.bahnen) ? r.bahnen : []).map(b => ({
                    id: String(b.id || neueId('b')),
                    name: String(b.name || 'Bahn')
                }));
                if (!bahnen.length) bahnen.push({ id: neueId('b'), name: 'Bahn' });
                const istBahn = id => bahnen.some(b => b.id === id) ? id : bahnen[0].id;

                return {
                    id: String(r.id || neueId('r')),
                    name: String(r.name || 'Roadmap'),
                    geaendert: Number(r.geaendert) || Date.now(),
                    bahnen,
                    vorhaben: (Array.isArray(r.vorhaben) ? r.vorhaben : []).map(v => {
                        const von = datum(v.von, heute());
                        let bis = datum(v.bis, plusTage(von, 14));
                        if (tageZwischen(von, bis) < 0) bis = von;   // verdrehte Spanne geradeziehen
                        return {
                            id: String(v.id || neueId('v')),
                            bahn: istBahn(String(v.bahn || '')),
                            titel: String(v.titel || 'Vorhaben'),
                            notiz: String(v.notiz || ''),
                            farbe: farbe(v.farbe),
                            von, bis
                        };
                    }),
                    meilensteine: (Array.isArray(r.meilensteine) ? r.meilensteine : []).map(m => ({
                        id: String(m.id || neueId('m')),
                        bahn: istBahn(String(m.bahn || '')),
                        titel: String(m.titel || 'Meilenstein'),
                        farbe: farbe(m.farbe),
                        am: datum(m.am, heute())
                    }))
                };
            });
        }

        /* ---------- Schritte zurücknehmen ----------
           Gemerkt wird nur der Inhalt einer Roadmap, nicht die Liste. Ein Schritt
           zurück soll ein verschobenes Vorhaben zurückholen, nicht eine gelöschte
           Roadmap. */

        function merken() {
            if (!rm()) return;
            const r = rm();
            zurueckStapel.push(JSON.stringify({ bahnen: r.bahnen, vorhaben: r.vorhaben, meilensteine: r.meilensteine }));
            if (zurueckStapel.length > 60) zurueckStapel.shift();
            vorStapel = [];
            knoepfeAktualisieren();
        }

        function standSetzen(roh) {
            const r = rm();
            r.bahnen = roh.bahnen;
            r.vorhaben = roh.vorhaben;
            r.meilensteine = roh.meilensteine;
        }

        function zurueck() {
            if (!zurueckStapel.length || !rm()) return;
            const r = rm();
            vorStapel.push(JSON.stringify({ bahnen: r.bahnen, vorhaben: r.vorhaben, meilensteine: r.meilensteine }));
            standSetzen(JSON.parse(zurueckStapel.pop()));
            sichern(); malen(); knoepfeAktualisieren();
        }

        function vor() {
            if (!vorStapel.length || !rm()) return;
            const r = rm();
            zurueckStapel.push(JSON.stringify({ bahnen: r.bahnen, vorhaben: r.vorhaben, meilensteine: r.meilensteine }));
            standSetzen(JSON.parse(vorStapel.pop()));
            sichern(); malen(); knoepfeAktualisieren();
        }

        function knoepfeAktualisieren() {
            el('k-zurueck').disabled = !zurueckStapel.length;
            el('k-vor').disabled = !vorStapel.length;
            document.querySelectorAll('[data-stufe]').forEach(k => k.classList.toggle('an', k.dataset.stufe === stufe));
        }

        /* ---------- Die sichtbare Spanne ----------
           Sie ergibt sich aus den Daten, nicht aus einer Einstellung: ein Monat
           Luft vor dem frühesten und nach dem spätesten Eintrag, heute immer
           dabei, und eine Mindestbreite, damit auch eine leere Roadmap eine
           Achse hat, auf die man etwas legen kann. */

        function spanne() {
            const r = rm();
            const alle = [heute()];
            if (r) {
                r.vorhaben.forEach(v => { alle.push(v.von); alle.push(v.bis); });
                r.meilensteine.forEach(m => alle.push(m.am));
            }
            alle.sort();
            const a = alsDatum(alle[0]), z = alsDatum(alle[alle.length - 1]);

            let von = new Date(a.getFullYear(), a.getMonth() - 1, 1);
            let bis = new Date(z.getFullYear(), z.getMonth() + 2, 0);
            const mindest = MINDESTTAGE[stufe];
            if (Math.round((bis - von) / TAG) < mindest) {
                const ende = new Date(von.getTime() + mindest * TAG);
                bis = new Date(ende.getFullYear(), ende.getMonth() + 1, 0);
            }
            return { von: alsText(von), bis: alsText(bis) };
        }

        const xVon = (sp, datum) => tageZwischen(sp.von, datum) * px();

        /* Liefert die Spalten der unteren Kopfzeile: Woche, Monat oder Quartal.
           Gleich mit Lage und Breite, damit Kopfzeile, Raster und das ausgegebene
           Bild dieselben Zahlen benutzen und nicht auseinanderlaufen. */
        function spalten(sp) {
            const art = STUFEN[stufe].unten;
            const ende = alsDatum(sp.bis);
            const aus = [];
            let d = alsDatum(sp.von);

            if (art === 'woche') {
                d.setDate(d.getDate() - ((d.getDay() + 6) % 7));     // auf Montag zurück
            } else {
                d = new Date(d.getFullYear(), art === 'quartal' ? Math.floor(d.getMonth() / 3) * 3 : d.getMonth(), 1);
            }

            while (d <= ende) {
                const naechst = new Date(d);
                if (art === 'woche') naechst.setDate(naechst.getDate() + 7);
                else naechst.setMonth(naechst.getMonth() + (art === 'quartal' ? 3 : 1));

                const x = xVon(sp, alsText(d));
                aus.push({
                    x,
                    breite: (tageZwischen(alsText(d), alsText(naechst))) * px(),
                    titel: art === 'woche'   ? 'KW ' + kalenderwoche(d)
                         : art === 'quartal' ? 'Q' + (Math.floor(d.getMonth() / 3) + 1)
                         : MONATE_KURZ[d.getMonth()],
                    stark: art === 'woche' ? d.getDate() <= 7 : d.getMonth() === 0
                });
                d = naechst;
            }
            return aus;
        }

        /* Die obere Kopfzeile fasst gröber zusammen: Monate über den Wochen,
           Jahre über den Monaten und Quartalen. */
        function gruppen(sp) {
            const art = STUFEN[stufe].oben;
            const ende = alsDatum(sp.bis);
            const aus = [];
            let d = alsDatum(sp.von);
            d = art === 'jahr' ? new Date(d.getFullYear(), 0, 1) : new Date(d.getFullYear(), d.getMonth(), 1);

            while (d <= ende) {
                const naechst = new Date(d);
                if (art === 'jahr') naechst.setFullYear(naechst.getFullYear() + 1);
                else naechst.setMonth(naechst.getMonth() + 1);
                aus.push({
                    x: xVon(sp, alsText(d)),
                    breite: tageZwischen(alsText(d), alsText(naechst)) * px(),
                    titel: art === 'jahr' ? String(d.getFullYear()) : MONATE[d.getMonth()] + ' ' + d.getFullYear()
                });
                d = naechst;
            }
            return aus;
        }

        /* ---------- Unterspuren innerhalb einer Bahn ----------
           Zwei Vorhaben, die sich zeitlich überschneiden, dürfen nicht
           übereinanderliegen. Sie wandern deshalb untereinander: jedes kommt in
           die erste Unterspur, in der rechts noch Platz ist. Ein Meilenstein
           zählt mit der Breite seiner Beschriftung mit, sonst überdeckt die
           Schrift den Nachbarn. */

        function verteilen(marken) {
            const enden = [];
            marken.sort((a, b) => a._x - b._x || a._b - b._b);
            marken.forEach(m => {
                let i = 0;
                while (i < enden.length && enden[i] > m._x) i++;
                if (i === enden.length) enden.push(0);
                m._spur = i;
                enden[i] = m._x + m._b + 8;
            });
            return Math.max(1, enden.length);
        }

        function markenDerBahn(sp, bahnId) {
            const r = rm();
            const marken = [];
            r.vorhaben.filter(v => v.bahn === bahnId).forEach(v => {
                const x = xVon(sp, v.von);
                marken.push({ art: 'v', daten: v, _x: x,
                              _b: Math.max(px(), (tageZwischen(v.von, v.bis) + 1) * px()) });
            });
            r.meilensteine.filter(m => m.bahn === bahnId).forEach(m => {
                const x = xVon(sp, m.am);
                marken.push({ art: 'm', daten: m, _x: x, _b: 16 + m.titel.length * 6.2 });
            });
            verteilen(marken);
            return marken;
        }

        /* ---------- Zeichnen ---------- */

        function malen() {
            const r = rm();
            if (!r) return;
            const sp = spanne();
            const breite = Math.max(400, tageZwischen(sp.von, sp.bis) * px());
            const gesamt = NAMENSBREITE + breite;

            const alleSpalten = spalten(sp);
            const alleGruppen = gruppen(sp);

            let h = '';

            /* Raster hinter allem */
            h += '<div class="rm-raster" style="left:' + NAMENSBREITE + 'px;width:' + breite + 'px">';
            alleSpalten.forEach(s => {
                h += '<div class="rm-linie' + (s.stark ? ' stark' : '') + '" style="left:' + s.x + 'px"></div>';
            });
            h += '</div>';

            /* Kopfzeilen */
            h += '<div class="rm-zeile rm-kopf">'
               +   '<div class="rm-bahnname"><span class="rm-eckname">Bahn</span></div>'
               +   '<div class="rm-kopfspur" style="width:' + breite + 'px">';
            alleGruppen.forEach(g => {
                h += '<div class="rm-jahr" style="left:' + g.x + 'px;width:' + g.breite + 'px">' + poEsc(g.titel) + '</div>';
            });
            alleSpalten.forEach(s => {
                h += '<div class="rm-spalte' + (s.stark ? ' stark' : '') + '" style="left:' + s.x + 'px;width:' + s.breite + 'px">'
                   + (s.breite > 26 ? poEsc(s.titel) : '') + '</div>';
            });
            h += '</div></div>';

            /* Je Bahn eine Zeile */
            r.bahnen.forEach(bahn => {
                const marken = markenDerBahn(sp, bahn.id);
                const spuren = Math.max(1, marken.reduce((m, x) => Math.max(m, x._spur + 1), 0));
                const hoehe = spuren * ZEILENHOEHE + 10;

                h += '<div class="rm-zeile" data-bahn="' + bahn.id + '" style="min-height:' + hoehe + 'px">'
                   +   '<div class="rm-bahnname">'
                   +     '<input class="rm-bahnfeld" value="' + poEsc(bahn.name) + '" '
                   +            'onchange="bahnBenennen(\'' + bahn.id + '\', this.value)">'
                   +     '<span class="rm-bahnwerkzeuge">'
                   +       '<button class="rm-winzig" title="Nach oben" onclick="bahnSchieben(\'' + bahn.id + '\', -1)">&#9650;</button>'
                   +       '<button class="rm-winzig" title="Nach unten" onclick="bahnSchieben(\'' + bahn.id + '\', 1)">&#9660;</button>'
                   +       '<button class="po-x" title="Bahn löschen" onclick="bahnLoeschen(\'' + bahn.id + '\')">&#10005;</button>'
                   +     '</span>'
                   +   '</div>'
                   +   '<div class="rm-spur" data-bahn="' + bahn.id + '" style="width:' + breite + 'px">';

                marken.forEach(m => {
                    const oben = 5 + m._spur * ZEILENHOEHE;
                    if (m.art === 'v') {
                        const v = m.daten;
                        h += '<div class="rm-balken" data-id="' + v.id + '" '
                           +      'style="left:' + m._x + 'px;top:' + oben + 'px;width:' + m._b + 'px;background:' + v.farbe + '" '
                           +      'title="' + poEsc(v.titel + ' · ' + datumLesbar(v.von) + (aufEnglisch() ? ' to ' : ' bis ') + datumLesbar(v.bis) + (v.notiz ? '\n' + v.notiz : '')) + '">'
                           +   '<span class="rm-griff rm-griff-l"></span>'
                           +   '<span class="rm-balkentext">' + poEsc(v.titel) + '</span>'
                           +   '<button class="po-x" title="Löschen" onclick="event.stopPropagation(); vorhabenLoeschen(\'' + v.id + '\')">&#10005;</button>'
                           +   '<span class="rm-griff rm-griff-r"></span>'
                           + '</div>';
                    } else {
                        const s = m.daten;
                        h += '<div class="rm-stein" data-stein="' + s.id + '" '
                           +      'style="left:' + m._x + 'px;top:' + oben + 'px" '
                           +      'title="' + poEsc(s.titel + ' · ' + datumLesbar(s.am)) + '">'
                           +   '<span class="rm-raute" style="background:' + s.farbe + '"></span>'
                           +   '<span class="rm-steintext">' + poEsc(s.titel) + '</span>'
                           +   '<button class="po-x" title="Löschen" onclick="event.stopPropagation(); meilensteinLoeschen(\'' + s.id + '\')">&#10005;</button>'
                           + '</div>';
                    }
                });

                h += '</div></div>';
            });

            /* Heute-Linie */
            const xh = NAMENSBREITE + xVon(sp, heute());
            h += '<div class="rm-heute" data-text="Heute" style="left:' + xh + 'px"></div>';

            if (!r.vorhaben.length && !r.meilensteine.length) {
                h += '<div class="rm-hinweis">Noch nichts geplant.<br>'
                   + '<b>Doppelklick</b> auf eine Bahn legt ein Vorhaben an.</div>';
            }

            const innen = el('innen');
            innen.style.width = gesamt + 'px';
            innen.innerHTML = h;
            kopfNachziehen();
        }

        function listeMalen() {
            el('roadmaps').innerHTML = roadmaps.map(r => `
                <li class="rm-eintrag ${r.id === aktiv ? 'aktiv' : ''}" onclick="roadmapOeffnen('${r.id}')">
                    <input class="rm-eintragname" value="${poEsc(r.name)}" onclick="event.stopPropagation()"
                           onchange="roadmapBenennen('${r.id}', this.value)">
                    <span class="rm-werkzeuge">
                        <button class="po-x" title="Löschen" onclick="event.stopPropagation(); roadmapLoeschen('${r.id}')">&#10005;</button>
                    </span>
                </li>`).join('');
        }

        /* ---------- Rollen ---------- */

        /* Die Beschriftung der oberen Kopfzeile steht am Anfang ihres Abschnitts.
           Rollt man in die Mitte eines Jahres, wäre sie weg — also wandert sie
           mit an den linken Rand und bleibt stehen, bis ihr Abschnitt endet.
           Das geht nicht mit position:sticky, weil die Beschriftung für die
           Breite ihres Abschnitts absolut gesetzt ist. */
        function kopfNachziehen() {
            const s0 = el('roll').scrollLeft;
            el('innen').querySelectorAll('.rm-jahr').forEach(j => {
                const l = parseFloat(j.style.left), b = parseFloat(j.style.width);
                const versatz = Math.max(0, Math.min(s0 - l, b - 64));
                j.style.paddingLeft = (7 + versatz) + 'px';
            });
        }

        function rollen(richtung) {
            const k = el('roll');
            k.scrollBy({ left: richtung * (k.clientWidth - NAMENSBREITE - 40), behavior: 'smooth' });
        }

        function zuHeute() {
            const k = el('roll');
            const x = NAMENSBREITE + xVon(spanne(), heute());
            k.scrollTo({ left: Math.max(0, x - (k.clientWidth - NAMENSBREITE) / 3 - NAMENSBREITE), behavior: 'smooth' });
        }

        function stufeSetzen(neu) {
            if (!STUFEN[neu] || neu === stufe) return;
            /* Der Punkt in der Mitte des Schirms soll die Zoomstufe überleben,
               sonst landet man nach dem Umschalten irgendwo im Jahr. */
            const k = el('roll');
            const sp = spanne();
            const mitteX = k.scrollLeft + (k.clientWidth - NAMENSBREITE) / 2 - NAMENSBREITE;
            const mitteTag = plusTage(sp.von, Math.round(mitteX / px()));

            stufe = neu;
            sichern(); malen(); knoepfeAktualisieren();

            const nx = NAMENSBREITE + xVon(spanne(), mitteTag);
            k.scrollLeft = Math.max(0, nx - (k.clientWidth - NAMENSBREITE) / 2 - NAMENSBREITE);
        }

        /* ---------- Vorhaben ---------- */

        function neuesVorhaben(bahnId, vonDatum) {
            const r = rm();
            const dauer = { woche: 7, monat: 21, quartal: 60 }[stufe];
            const v = {
                id: neueId('v'),
                bahn: bahnId || r.bahnen[0].id,
                titel: 'Neues Vorhaben',
                notiz: '',
                farbe: FARBEN[r.vorhaben.length % FARBEN.length],
                von: vonDatum || heute(),
                bis: plusTage(vonDatum || heute(), dauer)
            };
            merken();
            r.vorhaben.push(v);
            sichern(); malen();
            vorhabenBearbeiten(v.id);
        }

        function neuesVorhabenMittig() {
            const r = rm();
            if (!r) return;
            const k = el('roll');
            const sp = spanne();
            const mitteX = k.scrollLeft + (k.clientWidth - NAMENSBREITE) / 2 - NAMENSBREITE;
            neuesVorhaben(r.bahnen[0].id, plusTage(sp.von, Math.max(0, Math.round(mitteX / px()))));
        }

        /* Die Bahnen als Liste für die Dialoge. Wer nicht ziehen mag, ordnet ein
           Vorhaben oder einen Meilenstein hier zu. */
        const bahnOptionen = () => rm().bahnen.map(b => ({ wert: b.id, text: b.name }));

        async function vorhabenBearbeiten(id) {
            const v = rm().vorhaben.find(x => x.id === id);
            if (!v) return;
            const a = await poAsk('Vorhaben', [
                { name: 'titel', label: 'Titel', wert: v.titel },
                { name: 'bahn',  label: 'Bahn',  wert: v.bahn, typ: 'auswahl', optionen: bahnOptionen() },
                { name: 'von',   label: 'Von',   wert: v.von,  typ: 'date' },
                { name: 'bis',   label: 'Bis',   wert: v.bis,  typ: 'date' },
                { name: 'farbe', label: 'Farbe', wert: v.farbe, typ: 'color' },
                { name: 'notiz', label: 'Notiz (eine Zeile)', wert: v.notiz, pflicht: false }
            ], { ok: 'Übernehmen' });
            if (!a) return;
            merken();
            v.titel = a.titel;
            v.bahn = a.bahn;
            v.von = a.von;
            v.bis = tageZwischen(a.von, a.bis) < 0 ? a.von : a.bis;
            v.farbe = a.farbe;
            v.notiz = a.notiz || '';
            sichern(); malen();
        }

        async function vorhabenLoeschen(id) {
            const v = rm().vorhaben.find(x => x.id === id);
            if (!v) return;
            const ja = await poConfirm(`„${v.titel}“ wird gelöscht.`,
                                       { titel: 'Vorhaben löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            merken();
            rm().vorhaben = rm().vorhaben.filter(x => x.id !== id);
            sichern(); malen();
        }

        /* ---------- Meilensteine ---------- */

        async function neuerMeilenstein() {
            const r = rm();
            if (!r) return;
            const a = await poAsk('Meilenstein', [
                { name: 'titel', label: 'Titel', wert: 'Meilenstein' },
                { name: 'bahn',  label: 'Bahn',  wert: r.bahnen[0].id, typ: 'auswahl', optionen: bahnOptionen() },
                { name: 'am',    label: 'Am',    wert: heute(), typ: 'date' },
                { name: 'farbe', label: 'Farbe', wert: '#9E292B', typ: 'color' }
            ]);
            if (!a) return;
            merken();
            r.meilensteine.push({
                id: neueId('m'), bahn: a.bahn,
                titel: a.titel, am: a.am, farbe: a.farbe
            });
            sichern(); malen();
        }

        async function meilensteinBearbeiten(id) {
            const m = rm().meilensteine.find(x => x.id === id);
            if (!m) return;
            const a = await poAsk('Meilenstein', [
                { name: 'titel', label: 'Titel', wert: m.titel },
                { name: 'bahn',  label: 'Bahn',  wert: m.bahn, typ: 'auswahl', optionen: bahnOptionen() },
                { name: 'am',    label: 'Am',    wert: m.am, typ: 'date' },
                { name: 'farbe', label: 'Farbe', wert: m.farbe, typ: 'color' }
            ], { ok: 'Übernehmen' });
            if (!a) return;
            merken();
            m.titel = a.titel; m.bahn = a.bahn; m.am = a.am; m.farbe = a.farbe;
            sichern(); malen();
        }

        async function meilensteinLoeschen(id) {
            const m = rm().meilensteine.find(x => x.id === id);
            if (!m) return;
            const ja = await poConfirm(`„${m.titel}“ wird gelöscht.`,
                                       { titel: 'Meilenstein löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            merken();
            rm().meilensteine = rm().meilensteine.filter(x => x.id !== id);
            sichern(); malen();
        }

        /* ---------- Bahnen ---------- */

        async function neueBahn() {
            const r = rm();
            if (!r) return;
            const a = await poAsk('Neue Bahn', [{ name: 'name', label: 'Name', wert: 'Neue Bahn' }]);
            if (!a) return;
            merken();
            r.bahnen.push({ id: neueId('b'), name: a.name });
            sichern(); malen();
        }

        function bahnBenennen(id, wert) {
            const b = rm().bahnen.find(x => x.id === id);
            if (!b) return;
            merken();
            b.name = String(wert || '').trim() || b.name;
            sichern(); malen();
        }

        function bahnSchieben(id, richtung) {
            const r = rm();
            const i = r.bahnen.findIndex(b => b.id === id);
            const j = i + richtung;
            if (i < 0 || j < 0 || j >= r.bahnen.length) return;
            merken();
            const t = r.bahnen[i]; r.bahnen[i] = r.bahnen[j]; r.bahnen[j] = t;
            sichern(); malen();
        }

        async function bahnLoeschen(id) {
            const r = rm();
            if (r.bahnen.length < 2) { poToast('Die letzte Bahn lässt sich nicht löschen.'); return; }
            const b = r.bahnen.find(x => x.id === id);
            const anzahl = r.vorhaben.filter(v => v.bahn === id).length
                         + r.meilensteine.filter(m => m.bahn === id).length;
            const ja = await poConfirm(anzahl
                    ? `Die Bahn „${b.name}“ wird gelöscht, mit ${anzahl} Einträgen darin.`
                    : `Die Bahn „${b.name}“ wird gelöscht.`,
                { titel: 'Bahn löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            merken();
            r.bahnen = r.bahnen.filter(x => x.id !== id);
            r.vorhaben = r.vorhaben.filter(v => v.bahn !== id);
            r.meilensteine = r.meilensteine.filter(m => m.bahn !== id);
            sichern(); malen();
        }

        /* ---------- Ziehen ----------
           Während des Ziehens wird nur der eine Balken bewegt, nicht die ganze
           Fläche neu gezeichnet. Erst beim Loslassen wandert das Ergebnis in die
           Daten — ein Zug ist dadurch ein einziger Schritt zum Zurücknehmen. */

        let zug = null;

        el('innen').addEventListener('pointerdown', e => {
            const bal = e.target.closest('.rm-balken');
            if (!bal || e.target.closest('.po-x')) return;
            const v = rm().vorhaben.find(x => x.id === bal.dataset.id);
            if (!v) return;

            zug = {
                el: bal, v,
                art: e.target.classList.contains('rm-griff-l') ? 'links'
                   : e.target.classList.contains('rm-griff-r') ? 'rechts' : 'ganz',
                x0: e.clientX,
                l0: parseFloat(bal.style.left),
                b0: parseFloat(bal.style.width),
                von: v.von, bis: v.bis
            };
            bal.setPointerCapture(e.pointerId);
            bal.classList.add('zieht');
            /* Hier kein preventDefault: das unterdrückt im Browser die ganze
               Kette der Mausereignisse, also auch click und dblclick — der
               Doppelklick auf den Balken käme dann nie an. Gegen das Markieren
               von Text beim Ziehen hilft stattdessen der Griff unten. */
        });

        document.addEventListener('selectstart', e => { if (zug) e.preventDefault(); });

        document.addEventListener('pointermove', e => {
            if (!zug) return;
            const tage = Math.round((e.clientX - zug.x0) / px());
            const dauer = tageZwischen(zug.von, zug.bis);

            if (zug.art === 'ganz') {
                zug.el.style.left = (zug.l0 + tage * px()) + 'px';
                zug.neuVon = plusTage(zug.von, tage);
                zug.neuBis = plusTage(zug.bis, tage);
            } else if (zug.art === 'links') {
                const t = Math.min(tage, dauer);
                zug.el.style.left = (zug.l0 + t * px()) + 'px';
                zug.el.style.width = Math.max(px(), zug.b0 - t * px()) + 'px';
                zug.neuVon = plusTage(zug.von, t);
                zug.neuBis = zug.bis;
            } else {
                const t = Math.max(tage, -dauer);
                zug.el.style.width = Math.max(px(), zug.b0 + t * px()) + 'px';
                zug.neuVon = zug.von;
                zug.neuBis = plusTage(zug.bis, t);
            }
        });

        document.addEventListener('pointerup', e => {
            if (!zug) return;
            const z = zug;
            zug = null;
            z.el.classList.remove('zieht');

            /* Senkrecht gezogen wechselt das Vorhaben die Bahn. */
            let neueBahnId = z.v.bahn;
            if (z.art === 'ganz') {
                z.el.style.pointerEvents = 'none';
                const unten = document.elementFromPoint(e.clientX, e.clientY);
                z.el.style.pointerEvents = '';
                const zeile = unten && unten.closest('.rm-zeile[data-bahn]');
                if (zeile) neueBahnId = zeile.dataset.bahn;
            }

            const geaendert = (z.neuVon && (z.neuVon !== z.v.von || z.neuBis !== z.v.bis))
                           || neueBahnId !== z.v.bahn;
            if (geaendert) {
                merken();
                if (z.neuVon) { z.v.von = z.neuVon; z.v.bis = z.neuBis; }
                z.v.bahn = neueBahnId;
                sichern();
                malen();
            } else {
                /* Nichts verschoben — dann nur den Balken zurücklegen und die
                   Fläche stehen lassen. Würde hier neu gezeichnet, wäre der
                   Balken beim zweiten Klick ein anderes Element, und der
                   Doppelklick fiele auf die Bahn statt auf das Vorhaben. */
                z.el.style.left = z.l0 + 'px';
                z.el.style.width = z.b0 + 'px';
            }
        });

        el('innen').addEventListener('dblclick', e => {
            const bal = e.target.closest('.rm-balken');
            if (bal) { vorhabenBearbeiten(bal.dataset.id); return; }
            const stein = e.target.closest('.rm-stein');
            if (stein) { meilensteinBearbeiten(stein.dataset.stein); return; }

            const spur = e.target.closest('.rm-spur');
            if (!spur) return;
            const x = e.clientX - spur.getBoundingClientRect().left;
            neuesVorhaben(spur.dataset.bahn, plusTage(spanne().von, Math.max(0, Math.round(x / px()))));
        });

        /* ---------- Roadmaps ---------- */

        function neueRoadmap() {
            const r = neueLeereRoadmap();
            roadmaps.unshift(r);
            aktiv = r.id;
            zurueckStapel = []; vorStapel = [];
            sichern(); listeMalen(); malen(); knoepfeAktualisieren();
            setTimeout(zuHeute, 30);
        }

        function roadmapOeffnen(id) {
            if (id === aktiv) return;
            if (!roadmaps.some(r => r.id === id)) return;
            aktiv = id;
            zurueckStapel = []; vorStapel = [];
            sichern(); listeMalen(); malen(); knoepfeAktualisieren();
            setTimeout(zuHeute, 30);
        }

        function roadmapBenennen(id, wert) {
            const r = roadmaps.find(x => x.id === id);
            if (!r) return;
            r.name = String(wert || '').trim() || r.name;
            sichern(); listeMalen();
        }

        async function roadmapLoeschen(id) {
            const r = roadmaps.find(x => x.id === id);
            if (!r) return;
            const ja = await poConfirm(`„${r.name}“ wird gelöscht, mit ${r.vorhaben.length} Vorhaben. Das lässt sich nicht rückgängig machen.`,
                                       { titel: 'Roadmap löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            roadmaps = roadmaps.filter(x => x.id !== id);
            if (!roadmaps.length) roadmaps = [neueLeereRoadmap('Roadmap')];
            if (aktiv === id) aktiv = roadmaps[0].id;
            zurueckStapel = []; vorStapel = [];
            sichern(); listeMalen(); malen(); knoepfeAktualisieren();
        }

        async function roadmapLeeren() {
            const r = rm();
            if (!r) return;
            const anzahl = r.vorhaben.length + r.meilensteine.length;
            if (!anzahl) { poToast('Die Roadmap ist schon leer.'); return; }
            const ja = await poConfirm(`Alle ${anzahl} Einträge dieser Roadmap werden entfernt. Die Bahnen bleiben.`,
                                       { titel: 'Roadmap leeren', ja: 'Ja, leeren', gefahr: true });
            if (!ja) return;
            merken();
            r.vorhaben = []; r.meilensteine = [];
            sichern(); malen();
        }

        /* ---------- Seitenleiste ---------- */

        function leisteUmschalten(aus) {
            const f = el('rm-flaeche');
            const zu = (aus === undefined) ? !f.classList.contains('zu') : !!aus;
            f.classList.toggle('zu', zu);
            poSichern(SEITE_AUS, zu);
        }

        /* ---------- Datei ---------- */

        function sichernDatei() {
            poDownload('roadmaps.json', JSON.stringify({
                format: 'pocketops-roadmap', version: 1,
                gesichertAm: new Date().toISOString(), roadmaps
            }, null, 2));
            poToast(`Gesichert: ${roadmaps.length} Roadmaps`);
        }

        function oeffnenDatei(input) {
            poReadFile(input, async text => {
                const p = JSON.parse(text);
                if (!p || !Array.isArray(p.roadmaps)) { poToast('Die Datei enthält keine Roadmaps.', 4000); return; }
                const ja = await poConfirm(`${p.roadmaps.length} Roadmaps werden geöffnet. Der jetzige Stand wird dabei ersetzt.`,
                                           { titel: 'Roadmaps öffnen', ja: 'Ja, ersetzen', gefahr: true });
                if (!ja) return;
                roadmaps = pruefen(p.roadmaps);
                if (!roadmaps.length) roadmaps = [neueLeereRoadmap('Roadmap')];
                aktiv = roadmaps[0].id;
                zurueckStapel = []; vorStapel = [];
                sichern(); listeMalen(); malen(); knoepfeAktualisieren();
                poToast(`Geöffnet: ${roadmaps.length} Roadmaps`);
                setTimeout(zuHeute, 30);
            });
        }

        /* ---------- Als Bild ----------
           Die Roadmap wird für das Bild ein zweites Mal gemalt, diesmal auf eine
           Leinwand. Das ist mehr Arbeit als ein fertiger Umwandler, kostet aber
           kein fremdes Skript aus dem Netz: das Werkzeug bleibt eine Datei, die
           auch ohne Verbindung tut, was sie soll. */

        function bildExport() {
            const r = rm();
            if (!r || (!r.vorhaben.length && !r.meilensteine.length)) {
                poToast('Auf dieser Roadmap ist nichts zu sehen.'); return;
            }
            const sp = spanne();
            const breite = tageZwischen(sp.von, sp.bis) * px();
            const alleSpalten = spalten(sp), alleGruppen = gruppen(sp);

            /* Höhe der Bahnen vorab ausrechnen, damit die Leinwand passt. */
            const zeilen = r.bahnen.map(b => {
                const marken = markenDerBahn(sp, b.id);
                const spuren = Math.max(1, marken.reduce((m, x) => Math.max(m, x._spur + 1), 0));
                return { bahn: b, marken, hoehe: spuren * ZEILENHOEHE + 10 };
            });

            const KOPF = 46, RAND = 14;
            const gesamtB = NAMENSBREITE + breite + RAND * 2;
            const gesamtH = KOPF + zeilen.reduce((s, z) => s + z.hoehe, 0) + RAND * 2 + 24;
            const massstab = Math.min(2.5, Math.max(1, 2000 / gesamtB));

            const c = document.createElement('canvas');
            c.width = Math.round(gesamtB * massstab);
            c.height = Math.round(gesamtH * massstab);
            const g = c.getContext('2d');
            g.scale(massstab, massstab);
            g.fillStyle = '#FFFFFF';
            g.fillRect(0, 0, gesamtB, gesamtH);
            g.textBaseline = 'middle';

            const X0 = RAND, Y0 = RAND;
            const spurX = X0 + NAMENSBREITE;

            /* Titel */
            g.fillStyle = '#1E293B';
            g.font = '700 14px system-ui, sans-serif';
            g.fillText(r.name, X0, Y0 + 8);

            const oben = Y0 + 24;

            /* Senkrechte Linien über die ganze Höhe */
            const unten = oben + KOPF + zeilen.reduce((s, z) => s + z.hoehe, 0);
            alleSpalten.forEach(s => {
                g.strokeStyle = s.stark ? '#CBD5E1' : '#E7ECF3';
                g.lineWidth = 1;
                g.beginPath();
                g.moveTo(Math.round(spurX + s.x) + .5, oben);
                g.lineTo(Math.round(spurX + s.x) + .5, unten);
                g.stroke();
            });

            /* Kopfzeilen */
            g.fillStyle = '#697896';
            g.font = '700 10px system-ui, sans-serif';
            alleGruppen.forEach(gr => {
                if (gr.breite < 24) return;
                g.fillText(gr.titel.toUpperCase(), spurX + gr.x + 6, oben + 11);
            });
            g.font = '10px system-ui, sans-serif';
            alleSpalten.forEach(s => {
                if (s.breite < 26) return;
                g.fillText(s.titel, spurX + s.x + 5, oben + 34);
            });
            g.strokeStyle = '#CBD5E1';
            g.beginPath();
            g.moveTo(X0, Math.round(oben + KOPF) + .5);
            g.lineTo(X0 + NAMENSBREITE + breite, Math.round(oben + KOPF) + .5);
            g.stroke();

            /* Bahnen */
            let y = oben + KOPF;
            zeilen.forEach(z => {
                g.fillStyle = '#475569';
                g.font = '700 10px system-ui, sans-serif';
                g.fillText(z.bahn.name.toUpperCase(), X0 + 4, y + 16);

                z.marken.forEach(m => {
                    const my = y + 5 + m._spur * ZEILENHOEHE;
                    if (m.art === 'v') {
                        const v = m.daten;
                        g.fillStyle = v.farbe;
                        rundesRechteck(g, spurX + m._x, my, Math.max(3, m._b), 26, 5);
                        g.fill();
                        g.save();
                        rundesRechteck(g, spurX + m._x, my, Math.max(3, m._b), 26, 5);
                        g.clip();
                        g.fillStyle = '#FFFFFF';
                        g.font = '600 12px system-ui, sans-serif';
                        g.fillText(v.titel, spurX + m._x + 7, my + 13);
                        g.restore();
                    } else {
                        const s = m.daten;
                        g.save();
                        g.translate(spurX + m._x, my + 13);
                        g.rotate(Math.PI / 4);
                        g.fillStyle = s.farbe;
                        g.fillRect(-5.5, -5.5, 11, 11);
                        g.restore();
                        g.fillStyle = '#475569';
                        g.font = '700 11px system-ui, sans-serif';
                        g.fillText(s.titel, spurX + m._x + 11, my + 13);
                    }
                });

                y += z.hoehe;
                g.strokeStyle = '#E7ECF3';
                g.beginPath();
                g.moveTo(X0, Math.round(y) + .5);
                g.lineTo(X0 + NAMENSBREITE + breite, Math.round(y) + .5);
                g.stroke();
            });

            /* Heute */
            const xh = spurX + xVon(sp, heute());
            if (xh >= spurX && xh <= spurX + breite) {
                g.strokeStyle = '#9E292B';
                g.lineWidth = 2;
                g.setLineDash([5, 4]);
                g.beginPath();
                g.moveTo(xh, oben);
                g.lineTo(xh, unten);
                g.stroke();
                g.setLineDash([]);
                g.fillStyle = '#9E292B';
                g.font = '700 9px system-ui, sans-serif';
                g.fillText('HEUTE', xh + 4, oben + KOPF + 6);
            }

            c.toBlob(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = r.name.replace(/[\\/:*?"<>|]/g, '-').slice(0, 60) + '.png';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                poToast('Bild gespeichert · ' + c.width + ' × ' + c.height + ' Punkte', 4000);
            }, 'image/png');
        }

        function rundesRechteck(g, x, y, b, h, r) {
            const rr = Math.min(r, b / 2, h / 2);
            g.beginPath();
            g.moveTo(x + rr, y);
            g.arcTo(x + b, y,     x + b, y + h, rr);
            g.arcTo(x + b, y + h, x,     y + h, rr);
            g.arcTo(x,     y + h, x,     y,     rr);
            g.arcTo(x,     y,     x + b, y,     rr);
            g.closePath();
        }

        /* ---------- Tasten ---------- */

        document.addEventListener('keydown', e => {
            if (e.target.matches('input, textarea')) return;
            const strg = e.ctrlKey || e.metaKey;
            if (strg && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); zurueck(); }
            else if (strg && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); vor(); }
        });

        el('roll').addEventListener('scroll', kopfNachziehen, { passive: true });
        poBeimVerlassen(sichern);

        /* ---------- Start ---------- */

        (function start() {
            let g = null;
            g = poLaden(SPEICHER);

            if (g && Array.isArray(g.roadmaps)) {
                roadmaps = pruefen(g.roadmaps);
                aktiv = g.aktiv;
                if (STUFEN[g.stufe]) stufe = g.stufe;
            }
            if (!roadmaps.length) roadmaps = [neueLeereRoadmap('Roadmap')];
            if (!roadmaps.some(r => r.id === aktiv)) aktiv = roadmaps[0].id;

            /* Früher lag hier '1' als nackte Zeichenkette; beides muss zählen. */
            if (_poJa(poLaden(SEITE_AUS))) leisteUmschalten(true);

            listeMalen(); malen(); knoepfeAktualisieren();
            setTimeout(zuHeute, 30);
        })();
    </script>
