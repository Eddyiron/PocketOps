        /* PO-BASE:ENDE */

        /* ======================================================================
           WHITEBOARD
           Ein Zeichenbrett: Stift, Formen, Pfeile, Text, Haftzettel. Die Lage
           zählt, Verbindungen sind nicht nötig — darin unterscheidet es sich
           von der Mindmap, die Knoten verknüpft.

           Alles wird selbst auf eine Leinwand gezeichnet. Dadurch ist das
           ausgegebene Bild genau das, was auf dem Schirm steht; es liegt kein
           fremder Umwandler dazwischen, der etwas verschiebt.
           ====================================================================== */

        const SPEICHER = 'po_whiteboard';
        const FARBEN = ['#1E293B', '#9E292B', '#39756F', '#2A7E9E', '#D89B2B', '#6D4AA8'];
        const STAERKEN = [2, 4, 8];
        const ZETTEL_B = 160, ZETTEL_H = 120;
        const GRIFF = 4;      // halbe Kantenlänge eines Griffs, in Bildpunkten
        const MINDEST = 16;   // kleinste Breite und Höhe eines Teils

        const el = id => document.getElementById(id);
        let zaehler = 0;
        const neueId = p => p + Date.now().toString(36) + (++zaehler).toString(36);

        let bretter = [];
        let aktiv = null;
        let werkzeug = 'auswahl';
        let farbe = FARBEN[0];
        let staerke = STAERKEN[1];
        let ansicht = { x: 0, y: 0, z: 1 };
        let auswahl = [];                 // Kennungen der gewählten Teile
        let zurueckStapel = [], vorStapel = [];

        const brett = () => bretter.find(b => b.id === aktiv) || null;
        const teile = () => (brett() ? brett().teile : []);

        const ctx = el('leinwand').getContext('2d');

        /* ---------- Speichern ---------- */

        let sicherTimer = null;
        const sichernSpaeter = () => { clearTimeout(sicherTimer); sicherTimer = setTimeout(sichern, 500); };
        /* Ein Zeichenbrett schreibt nicht bei jedem Strich, sondern gebündelt.
           Ohne diesen Haken ging der letzte Strich verloren, wenn der Nutzer
           innerhalb der halben Sekunde das Fenster schloss. */
        poBeimVerlassen(sichern);
        function sichern() {
            clearTimeout(sicherTimer);
            poSichern(SPEICHER, { bretter, aktiv });
        }

        const neuesLeeresBrett = () => ({ id: neueId('b'), name: 'Neues Brett', teile: [], geaendert: Date.now() });

        function pruefen(liste) {
            const z = (v, vor) => (typeof v === 'number' && isFinite(v)) ? v : vor;
            const f = v => /^#[0-9a-fA-F]{6}$/.test(v || '') ? v : FARBEN[0];
            const arten = ['strich', 'rechteck', 'ellipse', 'pfeil', 'zettel', 'text'];
            return (Array.isArray(liste) ? liste : []).map(b => ({
                id: String(b.id || neueId('b')),
                name: String(b.name || 'Brett'),
                geaendert: Number(b.geaendert) || Date.now(),
                teile: (Array.isArray(b.teile) ? b.teile : []).filter(t => t && arten.indexOf(t.art) >= 0).map(t => {
                    const g = { id: String(t.id || neueId('t')), art: t.art, farbe: f(t.farbe) };
                    if (t.art === 'strich') {
                        g.punkte = (Array.isArray(t.punkte) ? t.punkte : []).map(p => z(p, 0));
                        g.staerke = z(t.staerke, 4);
                    } else if (t.art === 'pfeil') {
                        g.x1 = z(t.x1, 0); g.y1 = z(t.y1, 0); g.x2 = z(t.x2, 100); g.y2 = z(t.y2, 0);
                        g.staerke = z(t.staerke, 4);
                    } else {
                        g.x = z(t.x, 0); g.y = z(t.y, 0);
                        g.b = Math.max(12, z(t.b, 100)); g.h = Math.max(12, z(t.h, 60));
                        if (t.art === 'zettel' || t.art === 'text') g.text = String(t.text || '');
                        if (t.art === 'text') g.groesse = z(t.groesse, 18);
                        if (t.art === 'rechteck' || t.art === 'ellipse') g.staerke = z(t.staerke, 4);
                    }
                    return g;
                })
            }));
        }

        /* ---------- Schritte zurücknehmen ---------- */

        function merken() {
            if (!brett()) return;
            zurueckStapel.push(JSON.stringify(brett().teile));
            if (zurueckStapel.length > 60) zurueckStapel.shift();
            vorStapel = [];
            knoepfeAktualisieren();
        }

        function zurueck() {
            if (!zurueckStapel.length || !brett()) return;
            vorStapel.push(JSON.stringify(brett().teile));
            brett().teile = JSON.parse(zurueckStapel.pop());
            auswahl = [];
            malen(); knoepfeAktualisieren(); sichernSpaeter();
        }

        function vor() {
            if (!vorStapel.length || !brett()) return;
            zurueckStapel.push(JSON.stringify(brett().teile));
            brett().teile = JSON.parse(vorStapel.pop());
            auswahl = [];
            malen(); knoepfeAktualisieren(); sichernSpaeter();
        }

        function knoepfeAktualisieren() {
            el('k-zurueck').disabled = !zurueckStapel.length;
            el('k-vor').disabled = !vorStapel.length;
            el('zahl').textContent = teile().length + (teile().length === 1 ? ' Teil' : ' Teile');
            el('zoomwert').textContent = Math.round(ansicht.z * 100) + ' %';
        }

        /* ---------- Rechnen zwischen Schirm und Fläche ---------- */

        const zuFlaeche = (sx, sy) => ({ x: (sx - ansicht.x) / ansicht.z, y: (sy - ansicht.y) / ansicht.z });
        const zuSchirm = (wx, wy) => ({ x: wx * ansicht.z + ansicht.x, y: wy * ansicht.z + ansicht.y });

        function mausAuf(e) {
            const r = el('leinwand').getBoundingClientRect();
            return zuFlaeche(e.clientX - r.left, e.clientY - r.top);
        }

        /* ---------- Zeichnen ---------- */

        function groesseSetzen() {
            const c = el('leinwand');
            const r = el('buehne').getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            c.width = Math.max(1, Math.round(r.width * dpr));
            c.height = Math.max(1, Math.round(r.height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            malen();
        }

        function aufhellen(hex, anteil) {
            const n = parseInt(hex.slice(1), 16);
            const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
            const m = (v) => Math.round(v + (255 - v) * anteil);
            return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
        }

        // Zeichnet die ganze Fläche. Dieselbe Hand malt den Schirm und das Bild.
        function malenAuf(c, liste, umriss, raster) {
            if (raster) {
                const r = el('buehne').getBoundingClientRect();
                c.save();
                c.fillStyle = '#CBD5E1';
                const schritt = 28;
                const a = zuFlaeche(0, 0), b = zuFlaeche(r.width, r.height);
                const von = p => Math.floor(p / schritt) * schritt;
                if (ansicht.z > 0.45) {
                    for (let x = von(a.x); x < b.x; x += schritt) {
                        for (let y = von(a.y); y < b.y; y += schritt) {
                            const s = zuSchirm(x, y);
                            c.fillRect(s.x, s.y, 1, 1);
                        }
                    }
                }
                c.restore();
            }

            liste.forEach(t => teilMalen(c, t));

            if (umriss) umriss.forEach(t => {
                const k = kasten(t);
                if (!k) return;
                const o = zuSchirm(k.x, k.y), u = zuSchirm(k.x + k.b, k.y + k.h);
                c.save();
                c.strokeStyle = '#81BED7';
                c.lineWidth = 1.5;
                c.setLineDash([5, 4]);
                c.strokeRect(o.x - 3, o.y - 3, u.x - o.x + 6, u.y - o.y + 6);
                c.restore();
            });

            // Griffe gibt es nur, wenn genau ein Teil gewählt ist — bei mehreren
            // wäre nicht zu sehen, worauf sie sich beziehen.
            if (umriss && umriss.length === 1) griffe(umriss[0]).forEach(g => {
                const s = zuSchirm(g.x, g.y);
                c.save();
                c.fillStyle = '#FFFFFF';
                c.strokeStyle = '#39756F';
                c.lineWidth = 1.5;
                c.beginPath();
                c.rect(s.x - GRIFF, s.y - GRIFF, GRIFF * 2, GRIFF * 2);
                c.fill(); c.stroke();
                c.restore();
            });
        }

        function teilMalen(c, t) {
            c.save();
            c.lineCap = 'round';
            c.lineJoin = 'round';
            if (t.art === 'strich') {
                c.strokeStyle = t.farbe;
                c.lineWidth = t.staerke * ansicht.z;
                if (t.punkte.length === 2) {
                    // Ein einzelner Tupfer ist ein Punkt, keine Strecke.
                    const p = zuSchirm(t.punkte[0], t.punkte[1]);
                    c.beginPath();
                    c.arc(p.x, p.y, Math.max(0.6, t.staerke * ansicht.z / 2), 0, 7);
                    c.fillStyle = t.farbe;
                    c.fill();
                } else {
                    c.beginPath();
                    for (let i = 0; i < t.punkte.length; i += 2) {
                        const p = zuSchirm(t.punkte[i], t.punkte[i + 1]);
                        i === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y);
                    }
                    c.stroke();
                }
            } else if (t.art === 'rechteck' || t.art === 'ellipse') {
                const o = zuSchirm(t.x, t.y);
                const b = t.b * ansicht.z, h = t.h * ansicht.z;
                c.strokeStyle = t.farbe;
                c.lineWidth = t.staerke * ansicht.z;
                c.beginPath();
                if (t.art === 'rechteck') c.rect(o.x, o.y, b, h);
                else c.ellipse(o.x + b / 2, o.y + h / 2, Math.abs(b / 2), Math.abs(h / 2), 0, 0, 7);
                c.stroke();
            } else if (t.art === 'pfeil') {
                const a = zuSchirm(t.x1, t.y1), b = zuSchirm(t.x2, t.y2);
                c.strokeStyle = t.farbe;
                c.fillStyle = t.farbe;
                c.lineWidth = t.staerke * ansicht.z;
                c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
                const w = Math.atan2(b.y - a.y, b.x - a.x);
                const l = Math.max(9, t.staerke * 3) * ansicht.z;
                c.beginPath();
                c.moveTo(b.x, b.y);
                c.lineTo(b.x - l * Math.cos(w - 0.4), b.y - l * Math.sin(w - 0.4));
                c.lineTo(b.x - l * Math.cos(w + 0.4), b.y - l * Math.sin(w + 0.4));
                c.closePath(); c.fill();
            } else if (t.art === 'zettel') {
                const o = zuSchirm(t.x, t.y);
                const b = t.b * ansicht.z, h = t.h * ansicht.z;
                c.fillStyle = aufhellen(t.farbe, 0.82);
                c.strokeStyle = aufhellen(t.farbe, 0.5);
                c.lineWidth = 1;
                c.beginPath();
                c.roundRect ? c.roundRect(o.x, o.y, b, h, 3 * ansicht.z) : c.rect(o.x, o.y, b, h);
                c.fill(); c.stroke();
                textMalen(c, t.text, o.x + 9 * ansicht.z, o.y + 9 * ansicht.z, b - 18 * ansicht.z, 14 * ansicht.z, t.farbe, 'bold');
            } else if (t.art === 'text') {
                const o = zuSchirm(t.x, t.y);
                textMalen(c, t.text, o.x, o.y, t.b * ansicht.z, t.groesse * ansicht.z, t.farbe, '');
            }
            c.restore();
        }

        // Umbruch von Hand, damit Schirm und Bild dieselben Zeilen bekommen
        function zeilenVon(c, text, breite, schriftgrad, fett) {
            c.font = (fett ? 'bold ' : '') + schriftgrad + 'px Arial, sans-serif';
            const out = [];
            String(text || '').split('\n').forEach(absatz => {
                if (!absatz) { out.push(''); return; }
                let zeile = '';
                absatz.split(' ').forEach(wort => {
                    const versuch = zeile ? zeile + ' ' + wort : wort;
                    if (c.measureText(versuch).width > breite && zeile) { out.push(zeile); zeile = wort; }
                    else zeile = versuch;
                });
                out.push(zeile);
            });
            return out;
        }

        function textMalen(c, text, x, y, breite, grad, farbe, fett) {
            if (!text) return;
            const zeilen = zeilenVon(c, text, breite, grad, fett === 'bold');
            c.fillStyle = farbe;
            c.textBaseline = 'top';
            zeilen.forEach((z, i) => c.fillText(z, x, y + i * grad * 1.3));
        }

        function malen() {
            const r = el('buehne').getBoundingClientRect();
            ctx.save();
            ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
            ctx.clearRect(0, 0, r.width, r.height);
            ctx.restore();
            malenAuf(ctx, teile(), teile().filter(t => auswahl.indexOf(t.id) >= 0), true);
            if (gummiband) {
                ctx.save();
                ctx.strokeStyle = '#81BED7';
                ctx.fillStyle = 'rgba(129,190,215,.14)';
                ctx.lineWidth = 1;
                const a = zuSchirm(gummiband.x1, gummiband.y1), b = zuSchirm(gummiband.x2, gummiband.y2);
                ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
                ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
                ctx.restore();
            }
        }

        /* ---------- Treffer und Kästen ---------- */

        // Freihandstriche haben keine Griffe: einen gezogenen Strich zu
        // stauchen verzerrt die Handschrift. Verschieben genügt.
        function griffe(t) {
            if (t.art === 'strich') return [];
            if (t.art === 'pfeil') return [{ k: 'a', x: t.x1, y: t.y1 }, { k: 'b', x: t.x2, y: t.y2 }];
            return [
                { k: 'lo', x: t.x, y: t.y },
                { k: 'ro', x: t.x + t.b, y: t.y },
                { k: 'lu', x: t.x, y: t.y + t.h },
                { k: 'ru', x: t.x + t.b, y: t.y + t.h }
            ];
        }

        function griffUnter(p) {
            if (werkzeug !== 'auswahl' || auswahl.length !== 1) return null;
            const t = teile().find(x => x.id === auswahl[0]);
            if (!t) return null;
            const m = zuSchirm(p.x, p.y);
            const g = griffe(t).find(g => {
                const s = zuSchirm(g.x, g.y);
                return Math.abs(s.x - m.x) <= GRIFF + 2 && Math.abs(s.y - m.y) <= GRIFF + 2;
            });
            return g ? { teil: t, griff: g.k } : null;
        }

        function kasten(t) {
            if (t.art === 'strich') {
                if (!t.punkte.length) return null;
                let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
                for (let i = 0; i < t.punkte.length; i += 2) {
                    x1 = Math.min(x1, t.punkte[i]); x2 = Math.max(x2, t.punkte[i]);
                    y1 = Math.min(y1, t.punkte[i + 1]); y2 = Math.max(y2, t.punkte[i + 1]);
                }
                return { x: x1, y: y1, b: x2 - x1, h: y2 - y1 };
            }
            if (t.art === 'pfeil') {
                return { x: Math.min(t.x1, t.x2), y: Math.min(t.y1, t.y2), b: Math.abs(t.x2 - t.x1), h: Math.abs(t.y2 - t.y1) };
            }
            return { x: Math.min(t.x, t.x + t.b), y: Math.min(t.y, t.y + t.h), b: Math.abs(t.b), h: Math.abs(t.h) };
        }

        const abstandZurStrecke = (px, py, x1, y1, x2, y2) => {
            const dx = x2 - x1, dy = y2 - y1;
            const l = dx * dx + dy * dy;
            const u = l ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l)) : 0;
            return Math.hypot(px - (x1 + u * dx), py - (y1 + u * dy));
        };

        function teilUnter(p) {
            const nah = 8 / ansicht.z;
            for (let i = teile().length - 1; i >= 0; i--) {
                const t = teile()[i];
                if (t.art === 'strich') {
                    for (let k = 0; k + 3 < t.punkte.length; k += 2) {
                        if (abstandZurStrecke(p.x, p.y, t.punkte[k], t.punkte[k + 1], t.punkte[k + 2], t.punkte[k + 3]) < nah + t.staerke / 2) return t;
                    }
                    if (t.punkte.length === 2 && Math.hypot(p.x - t.punkte[0], p.y - t.punkte[1]) < nah + t.staerke) return t;
                } else if (t.art === 'pfeil') {
                    if (abstandZurStrecke(p.x, p.y, t.x1, t.y1, t.x2, t.y2) < nah + t.staerke / 2) return t;
                } else {
                    const k = kasten(t);
                    if (p.x >= k.x - 2 && p.x <= k.x + k.b + 2 && p.y >= k.y - 2 && p.y <= k.y + k.h + 2) return t;
                }
            }
            return null;
        }

        /* ---------- Bedienen ---------- */

        let zug = null, gummiband = null;

        // Ohne dies nimmt der Browser beim Klick auf die Leinwand der gerade
        // geöffneten Eingabe den Fokus. Deren blur hielte den frischen
        // Haftzettel für leer verlassen und löschte ihn sofort wieder.
        // Wann eine Eingabe endet, bestimmt darum unten das pointerdown selbst.
        el('leinwand').addEventListener('mousedown', e => e.preventDefault());

        el('leinwand').addEventListener('pointerdown', e => {
            if (!brett()) return;

            // Eine offene Eingabe wird zuerst übernommen.
            const offeneEingabe = document.querySelector('.wb-eingabe');
            if (offeneEingabe) offeneEingabe.blur();
            el('leinwand').focus();
            // Der Zeigerfang hält den Zug fest, wenn die Maus die Leinwand
            // verlässt. Klappt er nicht, wird trotzdem gezeichnet.
            try { el('leinwand').setPointerCapture(e.pointerId); } catch (x) { /* ohne Fang weiter */ }
            const p = mausAuf(e);

            // Mittlere Taste schiebt immer die Fläche
            if (e.button === 1 || werkzeug === 'hand') {
                zug = { art: 'schieben', sx: e.clientX, sy: e.clientY, ax: ansicht.x, ay: ansicht.y };
                el('buehne').classList.add('zieht');
                return;
            }
            if (e.button !== 0) return;

            if (werkzeug === 'stift') {
                merken();
                const t = { id: neueId('t'), art: 'strich', punkte: [p.x, p.y], farbe, staerke };
                teile().push(t);
                zug = { art: 'malen', teil: t };
                malen();
                return;
            }
            if (werkzeug === 'radierer') {
                // Ein Zug am Radierer ist ein Rücknahmeschritt, auch wenn er
                // mehrere Striche erwischt. Erwischt er keinen, bleibt keiner.
                merken();
                zug = { art: 'radieren', traf: false };
                const t = teilUnter(p);
                if (t) { brett().teile = teile().filter(x => x !== t); auswahl = []; zug.traf = true; malen(); }
                return;
            }
            if (werkzeug === 'zettel' || werkzeug === 'text') {
                merken();
                const t = werkzeug === 'zettel'
                    ? { id: neueId('t'), art: 'zettel', x: p.x - ZETTEL_B / 2, y: p.y - ZETTEL_H / 2, b: ZETTEL_B, h: ZETTEL_H, text: '', farbe }
                    : { id: neueId('t'), art: 'text', x: p.x, y: p.y, b: 260, h: 30, text: '', groesse: 18, farbe };
                teile().push(t);
                auswahl = [t.id];
                werkzeugSetzen('auswahl');
                malen();
                textBearbeiten(t);
                fertig();
                return;
            }
            if (werkzeug === 'rechteck' || werkzeug === 'ellipse') {
                merken();
                const t = { id: neueId('t'), art: werkzeug, x: p.x, y: p.y, b: 1, h: 1, farbe, staerke };
                teile().push(t);
                zug = { art: 'aufziehen', teil: t, ox: p.x, oy: p.y };
                return;
            }
            if (werkzeug === 'pfeil') {
                merken();
                const t = { id: neueId('t'), art: 'pfeil', x1: p.x, y1: p.y, x2: p.x, y2: p.y, farbe, staerke };
                teile().push(t);
                zug = { art: 'pfeilziehen', teil: t };
                return;
            }

            // Auswahl: ein Griff geht dem Teil darunter vor
            const gr = griffUnter(p);
            if (gr) {
                merken();
                zug = { art: 'groesse', teil: gr.teil, griff: gr.griff, anfang: JSON.parse(JSON.stringify(gr.teil)) };
                return;
            }

            const t = teilUnter(p);
            if (t) {
                if (!e.shiftKey && auswahl.indexOf(t.id) < 0) auswahl = [t.id];
                else if (e.shiftKey && auswahl.indexOf(t.id) < 0) auswahl.push(t.id);
                merken();
                zug = { art: 'verschieben', ox: p.x, oy: p.y, anfang: JSON.parse(JSON.stringify(teile().filter(x => auswahl.indexOf(x.id) >= 0))) };
            } else {
                if (!e.shiftKey) auswahl = [];
                gummiband = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
                zug = { art: 'gummi' };
            }
            malen();
        });

        el('leinwand').addEventListener('pointermove', e => {
            if (!zug || !brett()) return;
            const p = mausAuf(e);
            if (zug.art === 'schieben') {
                ansicht.x = zug.ax + (e.clientX - zug.sx);
                ansicht.y = zug.ay + (e.clientY - zug.sy);
            } else if (zug.art === 'malen') {
                const n = zug.teil.punkte;
                if (Math.hypot(p.x - n[n.length - 2], p.y - n[n.length - 1]) > 1.6 / ansicht.z) n.push(p.x, p.y);
            } else if (zug.art === 'radieren') {
                const t = teilUnter(p);
                if (t) { brett().teile = teile().filter(x => x !== t); zug.traf = true; }
            } else if (zug.art === 'aufziehen') {
                zug.teil.x = Math.min(zug.ox, p.x);
                zug.teil.y = Math.min(zug.oy, p.y);
                zug.teil.b = Math.max(4, Math.abs(p.x - zug.ox));
                zug.teil.h = Math.max(4, Math.abs(p.y - zug.oy));
            } else if (zug.art === 'pfeilziehen') {
                zug.teil.x2 = p.x; zug.teil.y2 = p.y;
            } else if (zug.art === 'verschieben') {
                const dx = p.x - zug.ox, dy = p.y - zug.oy;
                zug.anfang.forEach(a => {
                    const t = teile().find(x => x.id === a.id);
                    if (!t) return;
                    if (t.art === 'strich') t.punkte = a.punkte.map((v, i) => i % 2 ? v + dy : v + dx);
                    else if (t.art === 'pfeil') { t.x1 = a.x1 + dx; t.y1 = a.y1 + dy; t.x2 = a.x2 + dx; t.y2 = a.y2 + dy; }
                    else { t.x = a.x + dx; t.y = a.y + dy; }
                });
            } else if (zug.art === 'groesse') {
                const a = zug.anfang, t = zug.teil;
                if (t.art === 'pfeil') {
                    if (zug.griff === 'a') { t.x1 = p.x; t.y1 = p.y; } else { t.x2 = p.x; t.y2 = p.y; }
                } else {
                    let x1 = a.x, y1 = a.y, x2 = a.x + a.b, y2 = a.y + a.h;
                    if (zug.griff === 'lo' || zug.griff === 'lu') x1 = p.x; else x2 = p.x;
                    if (zug.griff === 'lo' || zug.griff === 'ro') y1 = p.y; else y2 = p.y;
                    t.x = Math.min(x1, x2);
                    t.b = Math.max(MINDEST, Math.abs(x2 - x1));
                    if (t.art === 'text') {
                        // Beim Text bestimmt der Inhalt die Höhe. Gezogen wird
                        // nur die Breite; die obere Kante bleibt, wo sie war.
                        t.y = a.y;
                        t.h = Math.max(24, zeilenVon(ctx, t.text, t.b, t.groesse, false).length * t.groesse * 1.3);
                    } else {
                        t.y = Math.min(y1, y2);
                        t.h = Math.max(MINDEST, Math.abs(y2 - y1));
                    }
                }
            } else if (zug.art === 'gummi') {
                gummiband.x2 = p.x; gummiband.y2 = p.y;
                const k = { x: Math.min(gummiband.x1, gummiband.x2), y: Math.min(gummiband.y1, gummiband.y2),
                            b: Math.abs(gummiband.x2 - gummiband.x1), h: Math.abs(gummiband.y2 - gummiband.y1) };
                auswahl = teile().filter(t => {
                    const g = kasten(t);
                    return g && g.x >= k.x && g.y >= k.y && g.x + g.b <= k.x + k.b && g.y + g.h <= k.y + k.h;
                }).map(t => t.id);
            }
            malen();
        });

        function fertig() {
            knoepfeAktualisieren();
            if (brett()) brett().geaendert = Date.now();
            sichernSpaeter();
        }

        el('leinwand').addEventListener('pointerup', () => {
            if (!zug) return;
            if (zug.art === 'aufziehen' && (zug.teil.b < 6 && zug.teil.h < 6)) {
                brett().teile = teile().filter(t => t !== zug.teil);
                zurueckStapel.pop();
            }
            if (zug.art === 'pfeilziehen' && Math.hypot(zug.teil.x2 - zug.teil.x1, zug.teil.y2 - zug.teil.y1) < 6) {
                brett().teile = teile().filter(t => t !== zug.teil);
                zurueckStapel.pop();
            }
            if (zug.art === 'radieren' && !zug.traf) zurueckStapel.pop();
            // Ein Klick, der nichts bewegt oder nichts größer zieht, soll keinen
            // leeren Schritt hinterlassen — sonst scheint Strg+Z nichts zu tun.
            if (zug.art === 'verschieben' &&
                JSON.stringify(teile().filter(x => auswahl.indexOf(x.id) >= 0)) === JSON.stringify(zug.anfang)) {
                zurueckStapel.pop();
            }
            if (zug.art === 'groesse' && JSON.stringify(zug.teil) === JSON.stringify(zug.anfang)) {
                zurueckStapel.pop();
            }
            el('buehne').classList.remove('zieht');
            zug = null;
            gummiband = null;
            malen();
            fertig();
        });
        el('leinwand').addEventListener('pointercancel', () => { zug = null; gummiband = null; malen(); });

        el('leinwand').addEventListener('dblclick', e => {
            const t = teilUnter(mausAuf(e));
            if (t && (t.art === 'zettel' || t.art === 'text')) textBearbeiten(t);
        });

        el('leinwand').addEventListener('wheel', e => {
            e.preventDefault();
            const r = el('leinwand').getBoundingClientRect();
            const sx = e.clientX - r.left, sy = e.clientY - r.top;
            const vorher = zuFlaeche(sx, sy);
            ansicht.z = Math.min(4, Math.max(0.2, ansicht.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
            const nachher = zuFlaeche(sx, sy);
            ansicht.x += (nachher.x - vorher.x) * ansicht.z;
            ansicht.y += (nachher.y - vorher.y) * ansicht.z;
            malen(); knoepfeAktualisieren();
        }, { passive: false });

        /* ---------- Text eingeben ---------- */

        function textBearbeiten(t) {
            const alt = document.querySelector('.wb-eingabe');
            if (alt) alt.blur();
            const o = zuSchirm(t.x, t.y);
            const f = document.createElement('textarea');
            f.className = 'wb-eingabe';
            f.value = t.text || '';
            const grad = (t.art === 'zettel' ? 14 : t.groesse) * ansicht.z;
            f.style.left = (o.x + (t.art === 'zettel' ? 7 * ansicht.z : -2)) + 'px';
            f.style.top = (o.y + (t.art === 'zettel' ? 7 * ansicht.z : -2)) + 'px';
            f.style.width = ((t.art === 'zettel' ? t.b - 14 : t.b) * ansicht.z + 4) + 'px';
            f.style.height = ((t.art === 'zettel' ? t.h - 14 : Math.max(t.h, 30)) * ansicht.z + 4) + 'px';
            f.style.fontSize = grad + 'px';
            f.style.fontWeight = t.art === 'zettel' ? '700' : '400';
            f.style.color = t.farbe;
            f.style.padding = '2px';
            el('buehne').appendChild(f);
            f.focus();
            f.select();
            const schliessen = () => {
                if (!f.parentElement) return;
                const neu = f.value;
                f.remove();
                if (neu !== t.text) {
                    merken();
                    t.text = neu;
                    if (t.art === 'text') {
                        const z = zeilenVon(ctx, neu, t.b, t.groesse, false);
                        t.h = Math.max(24, z.length * t.groesse * 1.3);
                    }
                }
                if (!String(t.text).trim()) brett().teile = teile().filter(x => x !== t);
                malen(); fertig();
            };
            f.addEventListener('blur', schliessen);
            f.addEventListener('keydown', ev => {
                if (ev.key === 'Escape') { ev.preventDefault(); f.value = t.text || ''; f.blur(); }
                if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); f.blur(); }
            });
        }

        /* ---------- Leiste ---------- */

        function werkzeugSetzen(w) {
            werkzeug = w;
            el('buehne').className = 'wb-buehne ' + w;
            document.querySelectorAll('.wb-knopf[data-wz]').forEach(k => k.classList.toggle('an', k.dataset.wz === w));
        }
        el('leiste').addEventListener('click', e => {
            const k = e.target.closest('.wb-knopf[data-wz]');
            if (k) werkzeugSetzen(k.dataset.wz);
        });

        function farbeSetzen(f) {
            farbe = f;
            document.querySelectorAll('.wb-farbe').forEach(k => k.classList.toggle('an', k.dataset.f === f));
            if (auswahl.length) {
                merken();
                teile().filter(t => auswahl.indexOf(t.id) >= 0).forEach(t => { t.farbe = f; });
                malen(); fertig();
            }
        }

        function staerkeSetzen(s) {
            staerke = s;
            document.querySelectorAll('.wb-staerke').forEach(k => k.classList.toggle('an', Number(k.dataset.s) === s));
            if (auswahl.length) {
                merken();
                teile().filter(t => auswahl.indexOf(t.id) >= 0 && t.staerke !== undefined).forEach(t => { t.staerke = s; });
                malen(); fertig();
            }
        }

        function zoomen(richtung) {
            const r = el('buehne').getBoundingClientRect();
            const mitte = zuFlaeche(r.width / 2, r.height / 2);
            ansicht.z = Math.min(4, Math.max(0.2, ansicht.z * (richtung > 0 ? 1.2 : 1 / 1.2)));
            const neu = zuFlaeche(r.width / 2, r.height / 2);
            ansicht.x += (neu.x - mitte.x) * ansicht.z;
            ansicht.y += (neu.y - mitte.y) * ansicht.z;
            malen(); knoepfeAktualisieren();
        }

        function allesZeigen() {
            if (!teile().length) { ansicht = { x: 0, y: 0, z: 1 }; malen(); knoepfeAktualisieren(); return; }
            const k = gesamtKasten(teile(), 40);
            const r = el('buehne').getBoundingClientRect();
            ansicht.z = Math.min(2, Math.max(0.2, Math.min(r.width / k.b, r.height / k.h)));
            ansicht.x = (r.width - k.b * ansicht.z) / 2 - k.x * ansicht.z;
            ansicht.y = (r.height - k.h * ansicht.z) / 2 - k.y * ansicht.z;
            malen(); knoepfeAktualisieren();
        }

        function gesamtKasten(liste, rand) {
            let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
            liste.forEach(t => {
                const k = kasten(t);
                if (!k) return;
                const s = (t.staerke || 0) / 2;
                x1 = Math.min(x1, k.x - s); y1 = Math.min(y1, k.y - s);
                x2 = Math.max(x2, k.x + k.b + s); y2 = Math.max(y2, k.y + k.h + s);
            });
            if (!isFinite(x1)) return { x: 0, y: 0, b: 100, h: 100 };
            return { x: x1 - rand, y: y1 - rand, b: (x2 - x1) + rand * 2, h: (y2 - y1) + rand * 2 };
        }

        /* ---------- Bretter ---------- */

        function renderBretter() {
            el('bretter').innerHTML = bretter.map(b => `
                <li class="wb-eintrag ${b.id === aktiv ? 'aktiv' : ''}" onclick="brettOeffnen('${b.id}')">
                    <input class="wb-name" value="${poEsc(b.name)}" onclick="event.stopPropagation()"
                           onchange="brettBenennen('${b.id}', this.value)">
                    <span class="wb-werkzeuge">
                        <button class="po-x" title="Löschen" onclick="event.stopPropagation(); brettLoeschen('${b.id}')">✕</button>
                    </span>
                </li>`).join('');
        }

        function neuesBrett() {
            const b = neuesLeeresBrett();
            bretter.unshift(b);
            aktiv = b.id;
            ansicht = { x: 0, y: 0, z: 1 };
            auswahl = []; zurueckStapel = []; vorStapel = [];
            renderBretter(); malen(); knoepfeAktualisieren(); sichern();
        }

        function brettOeffnen(id) {
            aktiv = id;
            auswahl = []; zurueckStapel = []; vorStapel = [];
            ansicht = { x: 0, y: 0, z: 1 };
            renderBretter(); allesZeigen(); knoepfeAktualisieren(); sichern();
        }

        function brettBenennen(id, wert) {
            const b = bretter.find(x => x.id === id);
            if (!b) return;
            b.name = String(wert || '').trim() || b.name;
            renderBretter(); sichern();
        }

        async function brettLoeschen(id) {
            const b = bretter.find(x => x.id === id);
            if (!b) return;
            const ja = await poConfirm(`„${b.name}" wird gelöscht, mit ${b.teile.length} Teilen. Das lässt sich nicht rückgängig machen.`,
                                       { titel: 'Brett löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            bretter = bretter.filter(x => x.id !== id);
            if (!bretter.length) bretter = [neuesLeeresBrett()];
            if (aktiv === id) aktiv = bretter[0].id;
            auswahl = []; zurueckStapel = []; vorStapel = [];
            renderBretter(); malen(); knoepfeAktualisieren(); sichern();
        }

        async function brettLeeren() {
            if (!brett() || !teile().length) { poToast('Das Brett ist schon leer.'); return; }
            const ja = await poConfirm(`Alle ${teile().length} Teile auf „${brett().name}" werden entfernt.`,
                                       { titel: 'Brett leeren', ja: 'Ja, leeren', gefahr: true });
            if (!ja) return;
            merken();
            brett().teile = [];
            auswahl = [];
            malen(); fertig();
            poToast('Brett geleert');
        }

        /* ---------- Ausgeben ---------- */

        function bildExport() {
            if (!brett() || !teile().length) { poToast('Auf dem Brett ist nichts zu sehen.'); return; }
            const k = gesamtKasten(teile(), 36);
            const massstab = Math.min(3, Math.max(1, 1600 / k.b));
            const c = document.createElement('canvas');
            c.width = Math.round(k.b * massstab);
            c.height = Math.round(k.h * massstab);
            const g = c.getContext('2d');
            g.fillStyle = '#FFFFFF';
            g.fillRect(0, 0, c.width, c.height);

            // Für das Bild wird die Ansicht kurz auf den Ausschnitt gesetzt —
            // es malt dieselbe Hand wie auf dem Schirm.
            const merkeAnsicht = ansicht;
            ansicht = { x: -k.x * massstab, y: -k.y * massstab, z: massstab };
            malenAuf(g, teile(), null, false);
            ansicht = merkeAnsicht;

            c.toBlob(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = brett().name.replace(/[\\/:*?"<>|]/g, '-').slice(0, 60) + '.png';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                poToast('Bild gespeichert · ' + c.width + ' × ' + c.height + ' Punkte', 4000);
            }, 'image/png');
        }

        function exportJSON() {
            poDownload('whiteboards.json', JSON.stringify({ format: 'pocketops-whiteboard', version: 1, gesichertAm: new Date().toISOString(), bretter }));
            poToast(`Gesichert: ${bretter.length} Bretter`);
        }

        function importJSON(input) {
            poReadFile(input, async text => {
                const p = JSON.parse(text);
                if (!p || !Array.isArray(p.bretter)) { poToast('Die Datei enthält keine Bretter.', 4000); return; }
                const ja = await poConfirm(`${p.bretter.length} Bretter werden geöffnet. Der jetzige Stand wird dabei ersetzt.`,
                                           { titel: 'Bretter öffnen', ja: 'Ja, ersetzen', gefahr: true });
                if (!ja) return;
                bretter = pruefen(p.bretter);
                if (!bretter.length) bretter = [neuesLeeresBrett()];
                aktiv = bretter[0].id;
                auswahl = []; zurueckStapel = []; vorStapel = [];
                renderBretter(); allesZeigen(); knoepfeAktualisieren(); sichern();
                poToast(`Geöffnet: ${bretter.length} Bretter`);
            });
        }

        /* ---------- Tastatur ---------- */

        const KUERZEL = { v: 'auswahl', h: 'hand', s: 'stift', r: 'radierer', z: 'zettel', t: 'text', q: 'rechteck', e: 'ellipse', p: 'pfeil' };

        document.addEventListener('keydown', e => {
            if (document.querySelector('.wb-eingabe') || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
            const strg = e.ctrlKey || e.metaKey;
            if (strg && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                e.shiftKey ? vor() : zurueck();
                return;
            }
            if (strg && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                auswahl = teile().map(t => t.id);
                malen();
                return;
            }
            if (strg) return;
            if ((e.key === 'Delete' || e.key === 'Backspace') && auswahl.length) {
                e.preventDefault();
                merken();
                brett().teile = teile().filter(t => auswahl.indexOf(t.id) < 0);
                auswahl = [];
                malen(); fertig();
                return;
            }
            if (e.key === 'Escape') { auswahl = []; malen(); return; }
            const w = KUERZEL[e.key.toLowerCase()];
            if (w) { e.preventDefault(); werkzeugSetzen(w); }
        });

        window.addEventListener('resize', groesseSetzen);
        window.addEventListener('beforeunload', sichern);

        /* ---------- Start ---------- */

        (function start() {
            el('farben').innerHTML = FARBEN.map(f =>
                `<button class="wb-farbe" data-f="${f}" style="background:${f}" title="Farbe" onclick="farbeSetzen('${f}')"></button>`).join('');
            el('staerken').innerHTML = STAERKEN.map(s =>
                `<button class="wb-staerke" data-s="${s}" title="Strichstärke" onclick="staerkeSetzen(${s})"><i style="width:${s + 8}px;height:${s}px"></i></button>`).join('');
            el('hilfe').innerHTML = '<b>Rad</b> zoomt · <b>mittlere Taste</b> schiebt die Fläche · '
                                  + '<b>Doppelklick</b> auf Zettel oder Text bearbeitet · <b>Entf</b> löscht die Auswahl';

            try {
                const g = poLaden(SPEICHER);
                if (g && Array.isArray(g.bretter)) {
                    bretter = pruefen(g.bretter);
                    aktiv = g.aktiv;
                }
            } catch (e) { /* unbrauchbarer Stand wird verworfen */ }

            if (!bretter.length) bretter = [neuesLeeresBrett()];
            if (!bretter.some(b => b.id === aktiv)) aktiv = bretter[0].id;

            werkzeugSetzen('auswahl');
            farbeSetzen(FARBEN[0]);
            staerkeSetzen(STAERKEN[1]);
            renderBretter();
            groesseSetzen();
            if (teile().length) allesZeigen();
            knoepfeAktualisieren();
        })();
    </script>
</body>
</html>
