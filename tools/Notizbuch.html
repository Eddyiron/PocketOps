                '<div class="po-dialog-head">' + poEsc(name) + ' — ' + t.titel + '</div>'
              + '<div class="po-dialog-body po-hilfe" data-po-roh>' + teile.join('') + '</div>'
              + '<div class="po-dialog-foot"><button class="po-btn po-btn--go" data-zu>' + t.schluss + '</button></div>',
                (b, schliessen) => {
                    b.__abbruch = schliessen;
                    b.querySelector('[data-zu]').onclick = schliessen;
                    setTimeout(() => b.querySelector('[data-zu]').focus(), 30);
                });
            back.id = 'po-hilfe-fenster';
            back.querySelector('.po-dialog').style.maxWidth = '560px';
        }

        function _poStart() {
            document.documentElement.lang = _poSpr;
            _poKopfBauen();
            _poSprachbloecke();
            if (_poSpr === 'en') {
                _poStill = true;
                try { _poAnwenden(document.documentElement); } finally { _poStill = false; }
            }
            _poBeobachten();
            document.addEventListener('keydown', e => {
                if (e.key === 'F1') { e.preventDefault(); poHilfe(); }
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _poStart);
        else _poStart();
        /* PO-BASE:ENDE */

        /* ======================================================================
           NOTIZBUCH
           Notizbuch → Kapitel → Seite. Text und Aufbau liegen in IndexedDB,
           Bilder als eigene Einträge daneben. Nichts verlässt den Rechner.
           ====================================================================== */

        const DB_NAME = 'pocketops-notizbuch';
        let db = null;
        let daten = { version: 1, buecher: [] };
        let wahl = { buch: null, kapitel: null, seite: null };
        let bildUrls = new Map();          // Bild-Kennung → Objekt-URL
        let sucheAktiv = false;

        const el = id => document.getElementById(id);
        let zaehler = 0;
        const neueId = p => p + Date.now().toString(36) + (++zaehler).toString(36);

        /* ---------- Speicher ---------- */

        function dbOeffnen() {
            return new Promise((res, rej) => {
                const a = indexedDB.open(DB_NAME, 1);
                a.onupgradeneeded = () => {
                    const d = a.result;
                    if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
                    if (!d.objectStoreNames.contains('bilder')) d.createObjectStore('bilder', { keyPath: 'id' });
                };
                a.onsuccess = () => res(a.result);
                a.onerror = () => rej(a.error);
            });
        }

        function dbLauf(speicher, modus, fn) {
            return new Promise((res, rej) => {
                if (!db) return rej(new Error('kein Speicher'));
                const tx = db.transaction(speicher, modus);
                const anfrage = fn(tx.objectStore(speicher));
                tx.oncomplete = () => res(anfrage && anfrage.result);
                tx.onerror = () => rej(tx.error);
            });
        }

        let sicherTimer = null;
        function sichernSpaeter() {
            clearTimeout(sicherTimer);
            sicherTimer = setTimeout(sichernJetzt, 600);
        }

        async function sichernJetzt() {
            clearTimeout(sicherTimer);
            seiteUebernehmen();
            if (!db) return;
            try {
                await dbLauf('kv', 'readwrite', s => s.put(JSON.parse(JSON.stringify(daten)), 'daten'));
                const h = el('gespeichert');
                h.classList.add('an');
                setTimeout(() => h.classList.remove('an'), 1500);
            } catch (e) {
                poToast('Der Stand ließ sich nicht sichern: ' + e.message, 5000);
            }
        }

        /* ---------- Zugriff auf den Baum ---------- */

        const buchVon = id => daten.buecher.find(b => b.id === id) || null;
        function kapitelVon(buchId, kapId) {
            const b = buchVon(buchId);
            return b ? (b.kapitel.find(k => k.id === kapId) || null) : null;
        }
        function seiteVon(buchId, kapId, seiteId) {
            const k = kapitelVon(buchId, kapId);
            return k ? (k.seiten.find(s => s.id === seiteId) || null) : null;
        }
        const aktuelleSeite = () => seiteVon(wahl.buch, wahl.kapitel, wahl.seite);

        /* ---------- Anlegen ---------- */

        function neuesBuch() {
            const b = { id: neueId('b'), name: 'Neues Notizbuch', kapitel: [] };
            daten.buecher.push(b);
            wahl.buch = b.id;
            neuesKapitel(true);
            render();
            umbenennenStarten('buch', b.id);
        }

        function neuesKapitel(stumm = false) {
            if (!wahl.buch) { poToast('Lege zuerst ein Notizbuch an.'); return; }
            const b = buchVon(wahl.buch);
            const k = { id: neueId('k'), name: 'Neues Kapitel', seiten: [] };
            b.kapitel.push(k);
            wahl.kapitel = k.id;
            const s = { id: neueId('s'), titel: 'Neue Seite', html: '', geaendert: Date.now() };
            k.seiten.push(s);
            wahl.seite = s.id;
            if (!stumm) { render(); umbenennenStarten('kapitel', k.id); sichernSpaeter(); }
        }

        function neueSeite() {
            if (!wahl.kapitel) { poToast('Lege zuerst ein Kapitel an.'); return; }
            seiteUebernehmen();
            const k = kapitelVon(wahl.buch, wahl.kapitel);
            const s = { id: neueId('s'), titel: 'Neue Seite', html: '', geaendert: Date.now() };
            k.seiten.unshift(s);
            wahl.seite = s.id;
            sucheLeeren();
            render();
            el('seiten-titel').focus();
            el('seiten-titel').select();
            sichernSpaeter();
        }

        /* ---------- Auswählen ---------- */

        function waehleBuch(id) {
            seiteUebernehmen();
            wahl.buch = id;
            const b = buchVon(id);
            wahl.kapitel = b && b.kapitel[0] ? b.kapitel[0].id : null;
            const k = kapitelVon(wahl.buch, wahl.kapitel);
            wahl.seite = k && k.seiten[0] ? k.seiten[0].id : null;
            sucheLeeren();
            render();
        }

        function waehleKapitel(id) {
            seiteUebernehmen();
            wahl.kapitel = id;
            const k = kapitelVon(wahl.buch, id);
            wahl.seite = k && k.seiten[0] ? k.seiten[0].id : null;
            sucheLeeren();
            render();
        }

        function waehleSeite(id) {
            seiteUebernehmen();
            wahl.seite = id;
            render();
        }

        function springeZu(buchId, kapId, seiteId) {
            seiteUebernehmen();
            wahl = { buch: buchId, kapitel: kapId, seite: seiteId };
            sucheLeeren();
            render();
        }

        /* ---------- Umbenennen und Löschen ---------- */

        let benenntGerade = null;

        function umbenennenStarten(art, id) {
            benenntGerade = { art, id };
            render();
            const f = document.querySelector('.nb-umbenennen');
            if (f) { f.focus(); f.select(); }
        }

        function umbenennenFertig(art, id, wert) {
            if (!benenntGerade || benenntGerade.id !== id) return;   // blur nach dem Abbruch
            benenntGerade = null;
            const name = String(wert || '').trim();
            if (name) {
                if (art === 'buch') { const b = buchVon(id); if (b) b.name = name; }
                else { const k = kapitelVon(wahl.buch, id); if (k) k.name = name; }
            }
            render();
            sichernSpaeter();
        }

        async function loescheBuch(id) {
            const b = buchVon(id);
            if (!b) return;
            const seiten = b.kapitel.reduce((n, k) => n + k.seiten.length, 0);
            const ja = await poConfirm(
                `Das Notizbuch „${b.name}" wird gelöscht, mit ${b.kapitel.length} Kapitel${b.kapitel.length === 1 ? '' : 'n'} und ${seiten} Seite${seiten === 1 ? '' : 'n'}. Das lässt sich nicht rückgängig machen.`,
                { titel: 'Notizbuch löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            daten.buecher = daten.buecher.filter(x => x.id !== id);
            if (wahl.buch === id) {
                wahl.buch = daten.buecher[0] ? daten.buecher[0].id : null;
                const nb = buchVon(wahl.buch);
                wahl.kapitel = nb && nb.kapitel[0] ? nb.kapitel[0].id : null;
                const nk = kapitelVon(wahl.buch, wahl.kapitel);
                wahl.seite = nk && nk.seiten[0] ? nk.seiten[0].id : null;
            }
            render();
            sichernJetzt();
            bilderAufraeumen();
        }

        async function loescheKapitel(id) {
            const k = kapitelVon(wahl.buch, id);
            if (!k) return;
            const ja = await poConfirm(
                `Das Kapitel „${k.name}" wird gelöscht, mit ${k.seiten.length} Seite${k.seiten.length === 1 ? '' : 'n'}. Das lässt sich nicht rückgängig machen.`,
                { titel: 'Kapitel löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            const b = buchVon(wahl.buch);
            b.kapitel = b.kapitel.filter(x => x.id !== id);
            if (wahl.kapitel === id) {
                wahl.kapitel = b.kapitel[0] ? b.kapitel[0].id : null;
                const nk = kapitelVon(wahl.buch, wahl.kapitel);
                wahl.seite = nk && nk.seiten[0] ? nk.seiten[0].id : null;
            }
            render();
            sichernJetzt();
            bilderAufraeumen();
        }

        async function loescheSeite(id) {
            const s = seiteVon(wahl.buch, wahl.kapitel, id);
            if (!s) return;
            const ja = await poConfirm(`Die Seite „${s.titel}" wird gelöscht. Das lässt sich nicht rückgängig machen.`,
                                       { titel: 'Seite löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            const k = kapitelVon(wahl.buch, wahl.kapitel);
            k.seiten = k.seiten.filter(x => x.id !== id);
            if (wahl.seite === id) wahl.seite = k.seiten[0] ? k.seiten[0].id : null;
            render();
            sichernJetzt();
            bilderAufraeumen();
        }

        /* ---------- Zeichnen ---------- */

        let zeichnetGerade = false, nochmalZeichnen = false;

        function render() {
            if (zeichnetGerade) { nochmalZeichnen = true; return; }
            zeichnetGerade = true;
            try {
                renderBuecher();
                renderKapitel();
                if (!sucheAktiv) renderSeiten();
                renderEditor();
            } finally {
                zeichnetGerade = false;
                if (nochmalZeichnen) { nochmalZeichnen = false; render(); }
            }
        }

        function eintragWerkzeuge(umbenennenJs, loeschenJs) {
            return `<span class="nb-werkzeuge">
                <button class="po-x" title="Umbenennen" onclick="event.stopPropagation(); ${umbenennenJs}">✎</button>
                <button class="po-x" title="Löschen" onclick="event.stopPropagation(); ${loeschenJs}">✕</button>
            </span>`;
        }

        function renderBuecher() {
            const liste = el('buecher');
            if (!daten.buecher.length) {
                liste.innerHTML = '<li class="nb-leer-klein">Noch kein Notizbuch. Oben auf + tippen.</li>';
                return;
            }
            liste.innerHTML = daten.buecher.map(b => {
                const aktiv = b.id === wahl.buch;
                if (benenntGerade && benenntGerade.art === 'buch' && benenntGerade.id === b.id) {
                    return `<li class="nb-eintrag aktiv"><input class="nb-umbenennen" value="${poEsc(b.name)}"
                        onblur="umbenennenFertig('buch','${b.id}', this.value)"
                        onkeydown="if(event.key==='Enter')this.blur(); if(event.key==='Escape'){benenntGerade=null;render();}"></li>`;
                }
                const seiten = b.kapitel.reduce((n, k) => n + k.seiten.length, 0);
                return `<li class="nb-eintrag ${aktiv ? 'aktiv' : ''}" onclick="waehleBuch('${b.id}')" ondblclick="umbenennenStarten('buch','${b.id}')">
                    <span class="nb-text">${poEsc(b.name)}</span>
                    <span class="nb-zahl">${seiten}</span>
                    ${eintragWerkzeuge(`umbenennenStarten('buch','${b.id}')`, `loescheBuch('${b.id}')`)}
                </li>`;
            }).join('');
        }

        function renderKapitel() {
            const liste = el('kapitel');
            const b = buchVon(wahl.buch);
            if (!b) { liste.innerHTML = ''; return; }
            if (!b.kapitel.length) {
                liste.innerHTML = '<li class="nb-leer-klein">Noch kein Kapitel in diesem Notizbuch.</li>';
                return;
            }
            liste.innerHTML = b.kapitel.map(k => {
                const aktiv = k.id === wahl.kapitel;
                if (benenntGerade && benenntGerade.art === 'kapitel' && benenntGerade.id === k.id) {
                    return `<li class="nb-eintrag aktiv"><input class="nb-umbenennen" value="${poEsc(k.name)}"
                        onblur="umbenennenFertig('kapitel','${k.id}', this.value)"
                        onkeydown="if(event.key==='Enter')this.blur(); if(event.key==='Escape'){benenntGerade=null;render();}"></li>`;
                }
                return `<li class="nb-eintrag ${aktiv ? 'aktiv' : ''}" onclick="waehleKapitel('${k.id}')" ondblclick="umbenennenStarten('kapitel','${k.id}')">
                    <span class="nb-text">${poEsc(k.name)}</span>
                    <span class="nb-zahl">${k.seiten.length}</span>
                    ${eintragWerkzeuge(`umbenennenStarten('kapitel','${k.id}')`, `loescheKapitel('${k.id}')`)}
                </li>`;
            }).join('');
        }

        const datumKurz = t => new Date(t || Date.now()).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });

        function renderSeiten() {
            const liste = el('seiten');
            el('seiten-kopf').style.display = '';
            const k = kapitelVon(wahl.buch, wahl.kapitel);
            if (!k) { liste.innerHTML = ''; return; }
            if (!k.seiten.length) {
                liste.innerHTML = '<li class="nb-leer-klein">Noch keine Seite in diesem Kapitel.</li>';
                return;
            }
            liste.innerHTML = k.seiten.map(s => `
                <li class="nb-eintrag ${s.id === wahl.seite ? 'aktiv' : ''}" onclick="waehleSeite('${s.id}')">
                    <span class="nb-seiten-zeile">
                        <span class="nb-text">${poEsc(s.titel || 'Ohne Titel')}</span>
                        ${eintragWerkzeuge(`waehleSeite('${s.id}')`, `loescheSeite('${s.id}')`).replace('Umbenennen', 'Öffnen')}
                    </span>
                    <span class="nb-datum">${datumKurz(s.geaendert)}</span>
                </li>`).join('');
        }

        function renderEditor() {
            const s = aktuelleSeite();
            const bereich = el('editor-bereich');
            const nichts = el('nb-nichts');
            if (!s) {
                bereich.classList.add('nb-ohne-seite');
                nichts.innerHTML = daten.buecher.length
                    ? '<div class="po-empty">Keine Seite ausgewählt.<br>Links auf + tippen, um eine anzulegen.</div>'
                    : '<div class="po-empty">Noch kein Notizbuch.<br>Oben links auf + tippen, um das erste anzulegen.</div>';
                return;
            }
            bereich.classList.remove('nb-ohne-seite');
            el('seiten-titel').value = s.titel || '';
            const b = buchVon(wahl.buch), k = kapitelVon(wahl.buch, wahl.kapitel);
            el('pfad').textContent = `${b ? b.name : ''} › ${k ? k.name : ''}`;
            el('inhalt').innerHTML = s.html || '';
            bilderAufloesen(el('inhalt'));
            el('rollen').scrollTop = 0;
        }

        /* ---------- Inhalt übernehmen ---------- */

        function titelGeaendert(wert) {
            const s = aktuelleSeite();
            if (!s) return;
            s.titel = wert;
            s.geaendert = Date.now();
            if (!sucheAktiv) renderSeiten();
            sichernSpaeter();
        }

        // Die Objekt-URLs der Bilder gelten nur in dieser Sitzung und dürfen
        // nicht mitgespeichert werden — gesichert wird allein die Kennung.
        function inhaltLesen() {
            const kopie = el('inhalt').cloneNode(true);
            kopie.querySelectorAll('img[data-bild]').forEach(i => i.removeAttribute('src'));
            kopie.querySelectorAll('[contenteditable]').forEach(i => i.removeAttribute('contenteditable'));
            kopie.querySelectorAll('img.gewaehlt').forEach(i => i.classList.remove('gewaehlt'));
            return kopie.innerHTML;
        }

        function seiteUebernehmen() {
            const s = aktuelleSeite();
            if (!s || !el('inhalt')) return;
            const neu = inhaltLesen();
            if (neu !== s.html) { s.html = neu; s.geaendert = Date.now(); }
        }

        el('inhalt').addEventListener('input', () => {
            const s = aktuelleSeite();
            if (!s) return;
            s.html = inhaltLesen();
            s.geaendert = Date.now();
            sichernSpaeter();
        });

        /* ---------- Formatieren ---------- */

        try { document.execCommand('styleWithCSS', false, false); } catch (e) { /* ältere Browser */ }

        function befehl(bef, wert = null) {
            el('inhalt').focus();
            document.execCommand(bef, false, wert);
            leisteAktualisieren();
            inhaltGeaendert();
        }

        function block(tag) {
            el('inhalt').focus();
            const istSchon = document.queryCommandValue('formatBlock').toLowerCase().replace(/[<>]/g, '') === tag;
            document.execCommand('formatBlock', false, istSchon ? 'p' : tag);
            leisteAktualisieren();
            inhaltGeaendert();
        }

        function inhaltGeaendert() {
            const s = aktuelleSeite();
            if (!s) return;
            s.html = inhaltLesen();
            s.geaendert = Date.now();
            sichernSpaeter();
        }

        el('leiste').addEventListener('mousedown', e => {
            // Auswahl im Text darf beim Klick auf die Leiste nicht verloren gehen
            if (e.target.closest('.nb-knopf')) e.preventDefault();
        });

        el('leiste').addEventListener('click', e => {
            const k = e.target.closest('.nb-knopf');
            if (!k) return;
            if (k.dataset.bef) befehl(k.dataset.bef, k.dataset.wert || null);
            else if (k.dataset.block) block(k.dataset.block);
        });

        function leisteAktualisieren() {
            document.querySelectorAll('.nb-knopf[data-bef]').forEach(k => {
                let an = false;
                try { an = document.queryCommandState(k.dataset.bef); } catch (e) { /* nicht abfragbar */ }
                k.classList.toggle('an', !!an);
            });
            let blockName = '';
            try { blockName = (document.queryCommandValue('formatBlock') || '').toLowerCase().replace(/[<>]/g, ''); } catch (e) { /* nicht abfragbar */ }
            document.querySelectorAll('.nb-knopf[data-block]').forEach(k => {
                k.classList.toggle('an', k.dataset.block === blockName);
            });
            const sel = window.getSelection();
            const inAufgabe = sel.rangeCount && sel.anchorNode &&
                (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest('ul.nb-aufgaben');
            el('knopf-aufgaben').classList.toggle('an', !!inAufgabe);
        }

        document.addEventListener('selectionchange', () => {
            if (document.activeElement === el('inhalt')) leisteAktualisieren();
        });

        // Aufgabenliste: aus einer gewöhnlichen Liste wird eine mit Haken und zurück
        function aufgabenliste() {
            el('inhalt').focus();
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const start = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
            const vorhanden = start.closest('ul.nb-aufgaben');
            if (vorhanden) {
                vorhanden.classList.remove('nb-aufgaben');
                vorhanden.querySelectorAll('li').forEach(li => li.classList.remove('erledigt'));
            } else {
                const liste = start.closest('ul');
                if (liste) liste.classList.add('nb-aufgaben');
                else {
                    document.execCommand('insertUnorderedList');
                    const neu = (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest('ul');
                    if (neu) neu.classList.add('nb-aufgaben');
                }
            }
            leisteAktualisieren();
            inhaltGeaendert();
        }

        // Klick auf das Kästchen hakt ab — der Textbereich bleibt zum Schreiben
        el('inhalt').addEventListener('click', e => {
            const li = e.target.closest('ul.nb-aufgaben > li');
            if (li && e.clientX < li.getBoundingClientRect().left) {
                li.classList.toggle('erledigt');
                inhaltGeaendert();
                return;
            }
            document.querySelectorAll('.nb-blatt img.gewaehlt').forEach(i => i.classList.remove('gewaehlt'));
            if (e.target.tagName === 'IMG') e.target.classList.add('gewaehlt');
        });

        async function linkSetzen() {
            const sel = window.getSelection();
            const text = sel.toString();
            const a = await poAsk('Verweis einfügen', [
                { name: 'url', label: 'Adresse', platzhalter: 'https://…' },
                { name: 'text', label: 'Beschriftung', wert: text, pflicht: false }
            ], { ok: 'Einfügen' });
            if (!a || !a.url) return;
            el('inhalt').focus();
            if (text) document.execCommand('createLink', false, a.url);
            else document.execCommand('insertHTML', false,
                `<a href="${poEsc(a.url)}" target="_blank" rel="noopener">${poEsc(a.text || a.url)}</a>`);
            inhaltGeaendert();
        }

        /* ---------- Bilder ---------- */

        async function bildAblegen(blob) {
            const id = neueId('img');
            await dbLauf('bilder', 'readwrite', s => s.put({ id, blob, typ: blob.type, groesse: blob.size }));
            return id;
        }

        function bildUrl(id, blob) {
            if (bildUrls.has(id)) return bildUrls.get(id);
            const url = URL.createObjectURL(blob);
            bildUrls.set(id, url);
            return url;
        }

        async function bilderAufloesen(wurzel) {
            const offen = Array.from(wurzel.querySelectorAll('img[data-bild]:not([src])'));
            for (const img of offen) {
                const id = img.dataset.bild;
                if (bildUrls.has(id)) { img.src = bildUrls.get(id); continue; }
                try {
                    const rec = await dbLauf('bilder', 'readonly', s => s.get(id));
                    if (rec && rec.blob) img.src = bildUrl(id, rec.blob);
                    else img.replaceWith(document.createTextNode('[Bild fehlt]'));
                } catch (e) { /* Bild bleibt leer */ }
            }
        }

        async function bildEinfuegen(blob) {
            if (!db) { poToast('Ohne Browser-Speicher lassen sich keine Bilder ablegen.', 4500); return; }
            if (blob.size > 12 * 1024 * 1024) { poToast('Das Bild ist größer als 12 MB.', 4000); return; }
            const id = await bildAblegen(blob);
            const url = bildUrl(id, blob);
            el('inhalt').focus();
            document.execCommand('insertHTML', false, `<img data-bild="${id}" src="${url}" alt="">`);
            inhaltGeaendert();
        }

        function bilderAusDatei(input) {
            const dateien = Array.from(input.files || []);
            input.value = '';
            dateien.filter(f => f.type.startsWith('image/')).forEach(bildEinfuegen);
        }

        el('inhalt').addEventListener('paste', async e => {
            const items = Array.from(e.clipboardData.items || []);
            const bild = items.find(i => i.type.startsWith('image/'));
            if (bild) {
                e.preventDefault();
                const blob = bild.getAsFile();
                if (blob) await bildEinfuegen(blob);
                return;
            }
            // Eingefügtes HTML entschärfen, bevor es im Blatt landet
            const html = e.clipboardData.getData('text/html');
            if (html) {
                e.preventDefault();
                document.execCommand('insertHTML', false, htmlSaeubern(html));
                inhaltGeaendert();
            }
        });

        el('inhalt').addEventListener('dragover', e => e.preventDefault());
        el('inhalt').addEventListener('drop', async e => {
            const dateien = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
            if (!dateien.length) return;
            e.preventDefault();
            for (const f of dateien) await bildEinfuegen(f);
        });

        function htmlSaeubern(html) {
            const d = document.createElement('div');
            d.innerHTML = html;
            d.querySelectorAll('script, style, iframe, object, embed, link, meta').forEach(n => n.remove());
            d.querySelectorAll('*').forEach(n => {
                Array.from(n.attributes).forEach(a => {
                    const name = a.name.toLowerCase();
                    const wert = (a.value || '').trim().toLowerCase();
                    if (name.startsWith('on')) n.removeAttribute(a.name);
                    else if ((name === 'href' || name === 'src') && wert.startsWith('javascript:')) n.removeAttribute(a.name);
                    else if (name === 'srcdoc') n.removeAttribute(a.name);
                });
            });
            return d.innerHTML;
        }

        // Bilder, die auf keiner Seite mehr vorkommen, aus dem Speicher nehmen
        async function bilderAufraeumen() {
            if (!db) return;
            try {
                const benutzt = new Set();
                const re = /data-bild="([^"]+)"/g;
                daten.buecher.forEach(b => b.kapitel.forEach(k => k.seiten.forEach(s => {
                    let m; const h = s.html || '';
                    while ((m = re.exec(h)) !== null) benutzt.add(m[1]);
                })));
                const alle = await dbLauf('bilder', 'readonly', s => s.getAllKeys());
                const weg = (alle || []).filter(id => !benutzt.has(id));
                if (!weg.length) return;
                await dbLauf('bilder', 'readwrite', s => { weg.forEach(id => s.delete(id)); return null; });
                weg.forEach(id => {
                    if (bildUrls.has(id)) { URL.revokeObjectURL(bildUrls.get(id)); bildUrls.delete(id); }
                });
            } catch (e) { /* Aufräumen ist nur Kür */ }
        }

        /* ---------- Suche ---------- */

        let suchTimer = null;
        function sucheLaeuft() {
            clearTimeout(suchTimer);
            suchTimer = setTimeout(sucheZeigen, 180);
        }

        function sucheLeeren() {
            el('suche').value = '';
            sucheAktiv = false;
        }

        const nurText = html => {
            const d = document.createElement('div');
            d.innerHTML = html || '';
            return (d.textContent || '').replace(/\s+/g, ' ').trim();
        };

        function sucheZeigen() {
            const frage = el('suche').value.trim().toLowerCase();
            const liste = el('seiten');
            if (!frage) { sucheAktiv = false; renderSeiten(); return; }
            sucheAktiv = true;
            el('seiten-kopf').style.display = 'none';

            const treffer = [];
            daten.buecher.forEach(b => b.kapitel.forEach(k => k.seiten.forEach(s => {
                const text = nurText(s.html);
                const inTitel = (s.titel || '').toLowerCase().includes(frage);
                const i = text.toLowerCase().indexOf(frage);
                if (!inTitel && i < 0) return;
                let auszug = '';
                if (i >= 0) {
                    const von = Math.max(0, i - 32);
                    const roh = text.slice(von, i + frage.length + 48);
                    auszug = (von > 0 ? '… ' : '') + poEsc(roh).replace(
                        new RegExp(frage.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => '<b>' + m + '</b>');
                }
                treffer.push({ b, k, s, auszug });
            })));

            liste.innerHTML = treffer.length
                ? treffer.map(t => `
                    <li class="nb-eintrag" style="flex-direction:column;align-items:stretch" onclick="springeZu('${t.b.id}','${t.k.id}','${t.s.id}')">
                        <span class="nb-text" style="font-weight:700;color:var(--po-ink)">${poEsc(t.s.titel || 'Ohne Titel')}</span>
                        <span class="nb-treffer-stelle">${poEsc(t.b.name)} › ${poEsc(t.k.name)}</span>
                        ${t.auszug ? `<span class="nb-treffer-text">${t.auszug}</span>` : ''}
                    </li>`).join('')
                : '<li class="nb-leer-klein">Nichts gefunden.</li>';
        }

        /* ---------- Sichern und Öffnen als Datei ---------- */

        function blobZuDataUrl(blob) {
            return new Promise(res => {
                const r = new FileReader();
                r.onload = () => res(r.result);
                r.readAsDataURL(blob);
            });
        }

        function dataUrlZuBlob(url) {
            const [kopf, rumpf] = String(url).split(',');
            const typ = (kopf.match(/data:([^;]+)/) || [, 'image/png'])[1];
            const roh = atob(rumpf);
            const bytes = new Uint8Array(roh.length);
            for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
            return new Blob([bytes], { type: typ });
        }

        async function exportJSON() {
            await sichernJetzt();
            try {
                const benutzt = new Set();
                const re = /data-bild="([^"]+)"/g;
                daten.buecher.forEach(b => b.kapitel.forEach(k => k.seiten.forEach(s => {
                    let m; const h = s.html || '';
                    while ((m = re.exec(h)) !== null) benutzt.add(m[1]);
                })));
                const bilder = [];
                for (const id of benutzt) {
                    const rec = db ? await dbLauf('bilder', 'readonly', s => s.get(id)) : null;
                    if (rec && rec.blob) bilder.push({ id, daten: await blobZuDataUrl(rec.blob) });
                }
                const paket = { format: 'pocketops-notizbuch', version: 1, gesichertAm: new Date().toISOString(), buecher: daten.buecher, bilder };
                poDownload('notizbuch.json', JSON.stringify(paket));
                poToast(`Gesichert: ${daten.buecher.length} Notizbücher, ${bilder.length} Bilder`);
            } catch (e) {
                poToast('Das Sichern ist fehlgeschlagen: ' + e.message, 5000);
            }
        }

        function importJSON(input) {
            poReadFile(input, async text => {
                const p = JSON.parse(text);
                if (!p || !Array.isArray(p.buecher)) { poToast('Die Datei enthält kein Notizbuch.', 4000); return; }
                const ja = await poConfirm(
                    `${p.buecher.length} Notizbücher werden geöffnet. Der jetzige Stand wird dabei ersetzt.`,
                    { titel: 'Notizbuch öffnen', ja: 'Ja, ersetzen', gefahr: true });
                if (!ja) return;
                for (const bild of (p.bilder || [])) {
                    try { await dbLauf('bilder', 'readwrite', s => s.put({ id: bild.id, blob: dataUrlZuBlob(bild.daten) })); }
                    catch (e) { /* einzelnes Bild übersprungen */ }
                }
                bildUrls.forEach(u => URL.revokeObjectURL(u));
                bildUrls.clear();
                daten = { version: 1, buecher: pruefen(p.buecher) };
                ersteWahl();
                render();
                await sichernJetzt();
                poToast(`Geöffnet: ${daten.buecher.length} Notizbücher`);
            });
        }

        /* ---------- Aufbau prüfen ---------- */

        function pruefen(buecher) {
            return (Array.isArray(buecher) ? buecher : []).map(b => ({
                id: String(b.id || neueId('b')),
                name: String(b.name || 'Notizbuch'),
                kapitel: (Array.isArray(b.kapitel) ? b.kapitel : []).map(k => ({
                    id: String(k.id || neueId('k')),
                    name: String(k.name || 'Kapitel'),
                    seiten: (Array.isArray(k.seiten) ? k.seiten : []).map(s => ({
                        id: String(s.id || neueId('s')),
                        titel: String(s.titel || 'Ohne Titel'),
                        html: htmlSaeubern(String(s.html || '')),
                        geaendert: Number(s.geaendert) || Date.now()
                    }))
                }))
            }));
        }

        function ersteWahl() {
            const b = daten.buecher[0] || null;
            const k = b && b.kapitel[0] ? b.kapitel[0] : null;
            const s = k && k.seiten[0] ? k.seiten[0] : null;
            wahl = { buch: b ? b.id : null, kapitel: k ? k.id : null, seite: s ? s.id : null };
        }

        /* ---------- Tastatur ---------- */

        document.addEventListener('keydown', e => {
            const strg = e.ctrlKey || e.metaKey;
            if (strg && e.key.toLowerCase() === 's') { e.preventDefault(); sichernJetzt(); }
            if (strg && e.key.toLowerCase() === 'f') { e.preventDefault(); el('suche').focus(); el('suche').select(); }
            if (strg && e.key === 'Enter') { e.preventDefault(); neueSeite(); }
            if (e.key === 'Escape' && document.activeElement === el('suche')) { sucheLeeren(); render(); }
        });

        window.addEventListener('beforeunload', () => { seiteUebernehmen(); });

        /* ---------- Start ---------- */

        (async function start() {
            try {
                db = await dbOeffnen();
                const gespeichert = await dbLauf('kv', 'readonly', s => s.get('daten'));
                if (gespeichert && Array.isArray(gespeichert.buecher)) daten = { version: 1, buecher: pruefen(gespeichert.buecher) };
            } catch (e) {
                poToast('Der Browser-Speicher ist nicht verfügbar. Notizen bleiben nur bis zum Neuladen.', 6000);
            }

            if (!daten.buecher.length) {
                daten.buecher = [{
                    id: neueId('b'), name: 'Mein Notizbuch',
                    kapitel: [{
                        id: neueId('k'), name: 'Allgemein',
                        seiten: [{
                            id: neueId('s'), titel: 'Willkommen', geaendert: Date.now(),
                            html: '<p>Links die <b>Notizbücher</b> und ihre <b>Kapitel</b>, daneben die <b>Seiten</b>, hier der Text.</p>'
                                + '<ul class="nb-aufgaben"><li>Auf das Kästchen tippen hakt ab</li><li class="erledigt">So sieht erledigt aus</li></ul>'
                                + '<p>Bilder lassen sich einfügen (Strg+V) oder in das Blatt ziehen. Ein Doppelklick auf einen Namen links benennt ihn um.</p>'
                        }]
                    }]
                }];
            }
            ersteWahl();
            render();
            await bilderAufraeumen();
        })();
    </script>
</body>
</html>
