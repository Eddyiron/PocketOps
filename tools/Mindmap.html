        let _poSpr = 'de';
        try { if (localStorage.getItem('po_sprache') === 'en') _poSpr = 'en'; } catch (e) { /* ohne Speicher eben Deutsch */ }

        const poSprache = () => _poSpr;

        /* ---------- Wörterbuch ---------- */

        const _poNormal = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
        const _poEscRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        let _poExakt = null, _poMuster = null;

        function _poWbBauen() {
            if (_poExakt) return;
            _poExakt = new Map();
            _poMuster = [];
            const quellen = [PO_WB_BASIS, (typeof PO_WB !== 'undefined' ? PO_WB : null)];
            for (const q of quellen) {
                if (!q) continue;
                for (const de of Object.keys(q)) {
                    const en = q[de];
                    if (!en) continue;
                    if (de.indexOf('{}') >= 0) {
                        const teile = _poNormal(de).split('{}');
                        _poMuster.push({ re: new RegExp('^' + teile.map(_poEscRe).join('([\\s\\S]*?)') + '$'), en });
                    } else {
                        _poExakt.set(_poNormal(de), en);
                    }
                }
            }
        }

        /* Was das Wörterbuch nicht kennt, wird hier gesammelt. Beim Pflegen einer
           Übersetzung zeigt poLuecken() im Browser, was noch fehlt. */
        const _poLuecken = new Set();
        function poLuecken() { return Array.from(_poLuecken).sort((a, b) => a.localeCompare(b, 'de')); }

        /* Liefert die Übersetzung oder null, wenn das Wörterbuch nichts kennt. */
        function _poNachschlagen(text) {
            _poWbBauen();
            const n = _poNormal(text);
            if (!n) return null;
            const treffer = _poExakt.get(n);
            if (treffer !== undefined) return treffer;
            for (const m of _poMuster) {
                const t = n.match(m.re);
                if (!t) continue;
                let i = 0;
                return m.en.replace(/\{\}/g, () => { i++; return t[i] === undefined ? '' : t[i]; });
            }
            if (_poLuecken.size < 2000) _poLuecken.add(n);
            return null;
        }

        /* Für Text, der nicht im Seitengerüst steht, sondern gezeichnet wird —
           auf einer Leinwand etwa. Gibt auf Deutsch den Text unverändert zurück. */
        function poT(text) {
            if (_poSpr !== 'en') return text;
            const u = _poNachschlagen(text);
            return u === null ? text : u;
        }

        /* Die englische Fassung, unabhängig von der eingestellten Sprache. Gebraucht
           dort, wo beide Sprachen zugleich gelten müssen — etwa in einem Suchfeld,
           das auch nach dem Umschalten noch finden soll. */
        function poEn(text) {
            const u = _poNachschlagen(text);
            return u === null ? text : u;
        }

        /* ---------- Die Seite umschreiben ---------- */

        const _PO_ATTR = ['placeholder', 'title', 'aria-label', 'alt'];
        const _PO_TABU = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1, PRE: 1, CODE: 1, CANVAS: 1 };

        function _poDarf(el) {
            for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
                if (_PO_TABU[e.tagName]) return false;
                if (e.isContentEditable) return false;
                if (e.hasAttribute('data-po-roh')) return false;
                if (e.hasAttribute('data-po-nur')) return false;   // steht schon in seiner Sprache
            }
            return true;
        }

        /* Längere Texte — eine ganze Seite Erklärung etwa — zerfielen im Wörterbuch
           an jedem <b> in Stücke. Dafür gibt es den zweiten Weg: zwei Blöcke, einer
           je Sprache, ausgezeichnet mit data-po-nur="de" bzw. "en". Es wird immer
           nur einer gezeigt.
           Bewusst über style.display statt über hidden: eine Klasse mit display:flex
           gewänne sonst gegen hidden, und der Block stünde trotzdem da. */
        function _poSprachbloecke() {
            document.querySelectorAll('[data-po-nur]').forEach(el => {
                el.style.display = (el.getAttribute('data-po-nur') === _poSpr) ? '' : 'none';
            });
        }

        function _poTextKnoten(k) {
            if (!k || !k.nodeValue || !k.nodeValue.trim()) return;
            if (k.nodeValue === k.__poEn) return;                 // steht schon auf Englisch
            if (!_poDarf(k.parentElement)) return;
            const neu = _poNachschlagen(k.nodeValue);
            if (neu === null) return;
            k.__poDe = k.nodeValue;
            k.nodeValue = k.nodeValue.match(/^\s*/)[0] + neu + k.nodeValue.match(/\s*$/)[0];
            k.__poEn = k.nodeValue;
        }

        function _poMerkmal(el, name) {
            if (!el || el.nodeType !== 1 || !el.hasAttribute(name)) return;
            if (!_poDarf(el)) return;
            const wert = el.getAttribute(name);
            el.__poAttrEn = el.__poAttrEn || {};
            el.__poAttrDe = el.__poAttrDe || {};
            if (wert === el.__poAttrEn[name]) return;
            const neu = _poNachschlagen(wert);
            if (neu === null) return;
            el.__poAttrDe[name] = wert;
            el.setAttribute(name, neu);
            el.__poAttrEn[name] = neu;
        }

        function _poAnwenden(wurzel) {
            if (_poSpr !== 'en' || !wurzel) return;
            if (wurzel.nodeType === 3) { _poTextKnoten(wurzel); return; }
            if (wurzel.nodeType !== 1) return;
            const lauf = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT);
            let k;
            while ((k = lauf.nextNode())) _poTextKnoten(k);
            const mit = [wurzel].concat(Array.from(wurzel.querySelectorAll('*')));
            for (const el of mit) for (const a of _PO_ATTR) if (el.hasAttribute && el.hasAttribute(a)) _poMerkmal(el, a);
        }

        function _poZurueck() {
            const lauf = document.createTreeWalker(document.documentElement, NodeFilter.SHOW_TEXT);
            let k;
            while ((k = lauf.nextNode())) {
                if (k.__poDe !== undefined && k.nodeValue === k.__poEn) { k.nodeValue = k.__poDe; k.__poEn = undefined; }
            }
            for (const el of document.querySelectorAll('*')) {
                if (!el.__poAttrDe) continue;
                for (const a of Object.keys(el.__poAttrDe)) {
                    if (el.getAttribute(a) === el.__poAttrEn[a]) el.setAttribute(a, el.__poAttrDe[a]);
                }
                el.__poAttrEn = {};
            }
        }

        let _poStill = false;
        let _poBeob = null;

        function _poBeobachten() {
            _poBeob = new MutationObserver(aenderungen => {
                if (_poStill || _poSpr !== 'en') return;
                _poStill = true;
                try {
                    for (const a of aenderungen) {
                        if (a.type === 'childList') a.addedNodes.forEach(n => {
                            _poAnwenden(n);
                            if (n.nodeType === 1 && n.querySelector && (n.hasAttribute('data-po-nur') || n.querySelector('[data-po-nur]'))) _poSprachbloecke();
                        });
                        else if (a.type === 'characterData') _poTextKnoten(a.target);
                        else if (a.type === 'attributes') _poMerkmal(a.target, a.attributeName);
                    }
                } finally {
                    _poBeob.takeRecords();          // eigene Änderungen nicht noch einmal ansehen
                    _poStill = false;
                }
            });
            _poBeob.observe(document.documentElement, {
                childList: true, subtree: true, characterData: true,
                attributes: true, attributeFilter: _PO_ATTR
            });
        }

        /* ---------- Umschalten ---------- */

        function poSpracheSetzen(spr) {
            const neu = spr === 'en' ? 'en' : 'de';
            if (neu === _poSpr) return;
            _poSpr = neu;
            try { localStorage.setItem('po_sprache', neu); } catch (e) { /* dann eben nur für dieses Fenster */ }
            document.documentElement.lang = neu;
            /* Beide Fenster werden geschlossen statt übersetzt: ihr Inhalt steht als
               data-po-roh und geht am Wörterbuch vorbei. Beim nächsten Öffnen baut er
               sich in der neuen Sprache neu auf. Ohne das bliebe nach einem Wechsel
               bei offenem Fenster die alte Sprache stehen. */
            const hilfe = document.getElementById('po-hilfe-fenster');
            if (hilfe) hilfe.remove();
            const trinkgeld = document.getElementById('po-trinkgeld-fenster');
            if (trinkgeld) trinkgeld.remove();
            _poStill = true;
            try {
                if (neu === 'en') _poAnwenden(document.documentElement);
                else _poZurueck();
            } finally {
                if (_poBeob) _poBeob.takeRecords();
                _poStill = false;
            }
            _poSprachbloecke();
            _poKopfMalen();
            // Werkzeuge, die selbst zeichnen, müssen danach neu zeichnen.
            if (typeof poNeuZeichnen === 'function') poNeuZeichnen();
        }

        function _poKopfMalen() {
            document.querySelectorAll('.po-sprach button').forEach(b => {
                b.setAttribute('aria-pressed', String(b.dataset.spr === _poSpr));
            });
        }

        /* ---------- Trinkgeld ----------
           PocketOps verschenkt sich. Der Knopf ist die einzige Stelle, an der das
           Werkzeug etwas von sich aus möchte — entsprechend zurückhaltend.

           Bewusst „Trinkgeld“ und nicht „Spende“: eine Spende im steuerlichen Sinn
           kann nur eine anerkannt gemeinnützige Einrichtung entgegennehmen. Hier ist
           es eine freiwillige Zuwendung an eine Privatperson.

           Der Verweis geht an PayPal.me. Bewusst nicht an die Spendenseite mit der
           E-Mail-Adresse als Kennung: die stünde damit im Quelltext jeder der
           sechsundzwanzig Dateien und wäre, seit das Ganze öffentlich liegt, für
           Adress-Sammler maschinell abgreifbar. Der PayPal.me-Name zeigt sie nicht.

           Den Betrag gibt der Besucher selbst an — deshalb der blanke Name ohne
           angehängte Zahl. Soll sich das ändern, ist hier die eine Zeile zu ändern
           und _design/sync.mjs laufen zu lassen. */
        const PO_TRINKGELD_LINK = 'https://paypal.me/JensHeitmann306';

        const PO_TRINKGELD_TEXTE = {
            de: {
                titel: 'Trinkgeld',
                frei: 'PocketOps ist frei. Nimm es, gib es weiter, bau es um — es kostet nichts und wird nichts kosten.',
                arbeit: 'Darin steckt allerdings eine Menge Arbeit. Wenn dir eines der Werkzeuge den Tag leichter gemacht hat, freue ich mich über ein Trinkgeld. Wie viel, entscheidest du.',
                hinweis: 'Der Knopf öffnet PayPal in einem neuen Fenster. Hier wird nichts abgefragt und nichts mitgeschnitten.',
                knopf: 'Trinkgeld über PayPal',
                nein: 'Vielleicht später'
            },
            en: {
                titel: 'Tip jar',
                frei: 'PocketOps is free. Take it, pass it on, rebuild it — it costs nothing and it never will.',
                arbeit: 'There is a fair amount of work in it, though. If one of these tools has made your day easier, a tip would be welcome. You decide how much.',
                hinweis: 'The button opens PayPal in a new window. Nothing is asked for or recorded here.',
                knopf: 'Leave a tip via PayPal',
                nein: 'Maybe later'
            }
        };

        function poTrinkgeld() {
            if (document.getElementById('po-trinkgeld-fenster')) return;
            const t = PO_TRINKGELD_TEXTE[_poSpr] || PO_TRINKGELD_TEXTE.de;
            const back = _poModal(
                '<div class="po-dialog-head">' + poEsc(t.titel) + '</div>'
              + '<div class="po-dialog-body po-hilfe" data-po-roh>'
              +   '<p style="margin:0 0 12px">' + poEsc(t.frei) + '</p>'
              +   '<p style="margin:0 0 12px">' + poEsc(t.arbeit) + '</p>'
              +   '<p style="margin:0;color:var(--po-ink-3);font-size:11px">' + poEsc(t.hinweis) + '</p>'
              + '</div>'
              + '<div class="po-dialog-foot">'
              +   '<button class="po-btn" data-zu>' + poEsc(t.nein) + '</button>'
              +   '<a class="po-btn po-btn--primary" href="' + PO_TRINKGELD_LINK + '" target="_blank" rel="noopener noreferrer">'
              +     poEsc(t.knopf) + '</a>'
              + '</div>',
                (b, schliessen) => {
                    b.__abbruch = schliessen;
                    b.querySelector('[data-zu]').onclick = schliessen;
                    /* Nach dem Sprung zu PayPal soll hier nicht noch ein Fenster offen
                       stehenbleiben, auf das niemand mehr schaut. */
                    b.querySelector('a.po-btn').onclick = () => setTimeout(schliessen, 150);
                });
            back.id = 'po-trinkgeld-fenster';
        }

        function _poKopfBauen() {
            const leiste = document.querySelector('.po-head-actions');
            if (!leiste || document.querySelector('.po-meta')) return;
            const box = document.createElement('div');
            box.className = 'po-meta';
            box.innerHTML =
                '<div class="po-sprach" role="group" aria-label="Sprache / Language">'
              + '<button type="button" data-spr="de">DE</button>'
              + '<button type="button" data-spr="en">EN</button></div>'
              + '<button type="button" class="po-trinkgeld" title="Trinkgeld" aria-label="Trinkgeld">&#9829;</button>'
              + '<button type="button" class="po-frage" title="Anleitung" aria-label="Anleitung">?</button>'
              + '<div class="po-head-sep"></div>';
            leiste.insertBefore(box, leiste.firstChild);
            box.querySelectorAll('[data-spr]').forEach(b => { b.onclick = () => poSpracheSetzen(b.dataset.spr); });
            box.querySelector('.po-frage').onclick = poHilfe;
            box.querySelector('.po-trinkgeld').onclick = poTrinkgeld;
            _poKopfMalen();
        }

        /* ---------- Die Anleitung ---------- */

        /* Die Werkzeuge liegen im Ordner tools/, die Übersicht eine Ebene darüber.
           Woran sich das erkennen lässt: nur ein Werkzeug trägt das Markenzeichen als
           Rückverweis; auf der Übersicht selbst steht es als blosser Text. */
        const _poSicherungPfad = () => document.querySelector('a.po-brand') ? 'Sicherung.html' : 'tools/Sicherung.html';

        /* Die Rechner, von denen diese Seite etwas nachlädt — ohne Doppelte. */
        function _poFremdquellen() {
            return [...document.querySelectorAll('script[src], link[rel="stylesheet"][href]')]
                .map(e => e.getAttribute('src') || e.getAttribute('href'))
                .filter(u => /^https?:\/\//i.test(u || ''))
                .map(u => { try { return new URL(u).hostname; } catch (e) { return null; } })
                .filter((h, i, a) => h && a.indexOf(h) === i);
        }

        function poHilfe() {
            if (document.getElementById('po-hilfe-fenster')) return;
            const t = PO_HILFE_TEXTE[_poSpr];
            const h = (typeof PO_HILFE !== 'undefined' && PO_HILFE && PO_HILFE[_poSpr]) ? PO_HILFE[_poSpr] : null;
            const name = (document.querySelector('.po-tool-name') || {}).textContent || 'PocketOps';

            const teile = [];
            if (h && h.kurz) teile.push('<p style="margin:0 0 12px">' + h.kurz + '</p>');
            if (h && h.schritte && h.schritte.length) {
                teile.push('<div class="po-hilfe-titel">' + t.schritte + '</div>'
                         + '<ol class="po-hilfe-liste">' + h.schritte.map(s => '<li>' + s + '</li>').join('') + '</ol>');
            }
            if (h && h.tipps && h.tipps.length) {
                teile.push('<div class="po-hilfe-teil"><div class="po-hilfe-titel">' + t.tipps + '</div>'
                         + '<ul class="po-hilfe-liste">' + h.tipps.map(s => '<li>' + s + '</li>').join('') + '</ul></div>');
            }
            teile.push('<div class="po-hilfe-teil">'
                     + '<div class="po-hilfe-titel">' + t.sicherung + '</div>'
                     + '<p style="margin:0 0 8px">' + t.sofort.replace('{}', '<b>' + poEsc(poBrowser()) + '</b>') + '</p>'
                     + '<p style="margin:0 0 8px">' + t.andererBrowser + '</p>'
                     + '<p style="margin:0 0 8px">' + t.sicherungText + '</p>'
                     + '<p style="margin:0 0 8px">' + t.sicherungWarum + '</p>'
                     + '<p style="margin:0"><a href="' + _poSicherungPfad() + '">' + t.mehr + '</a></p></div>');
            /* Ein paar Werkzeuge holen sich eine Programmbibliothek aus dem Netz. Der
               Hinweis liest das aus der Seite selbst aus, statt es pauschal zu
               behaupten — so bleibt er richtig, auch wenn später eine Quelle dazukommt
               oder wegfällt. */
            const fremd = _poFremdquellen();
            teile.push('<div class="po-hilfe-teil" style="color:var(--po-ink-3);font-size:11px">'
                     + (fremd.length ? t.oertlichMitNetz.replace('{}', fremd.join(', ')) : t.oertlich)
                     + '</div>');

            const back = _poModal(
                '<div class="po-dialog-head">' + poEsc(name) + ' — ' + t.titel + '</div>'
              + '<div class="po-dialog-body po-hilfe" data-po-roh>' + teile.join('') + '</div>'
              + '<div class="po-dialog-foot"><button class="po-btn po-btn--go" data-zu>' + t.schluss + '</button></div>',
                (b, schliessen) => {
                    b.__abbruch = schliessen;
                    b.querySelector('[data-zu]').onclick = schliessen;
                    setTimeout(() => b.querySelector('[data-zu]').focus(), 30);
                });
            back.id = 'po-hilfe-fenster';
            back.querySelector('.po-dialog').style.maxWidth = '560px';
        }

        function _poStart() {
            document.documentElement.lang = _poSpr;
            _poKopfBauen();
            _poSprachbloecke();
            if (_poSpr === 'en') {
                _poStill = true;
                try { _poAnwenden(document.documentElement); } finally { _poStill = false; }
            }
            _poBeobachten();
            document.addEventListener('keydown', e => {
                if (e.key === 'F1') { e.preventDefault(); poHilfe(); }
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _poStart);
        else _poStart();
        /* PO-BASE:ENDE */

        /* Mehrere Mindmaps liegen nebeneinander. `mapData` zeigt immer auf die
           gerade offene — alles darunter arbeitet weiter damit und muss von der
           Liste nichts wissen. */
        let maps = [];
        let aktivId = null;
        let mapData = { nodes: [], links: [], backgroundColor: HELLER_HINTERGRUND };

        const SPEICHER = 'po_mindmap';
        const SEITE_AUS = 'po_mindmap_seite_aus';
        /* Die einzelne Mindmap der aelteren Fassung. Wird einmal uebernommen und
           bleibt danach unberuehrt liegen, falls doch etwas schiefgeht. */
        const STORAGE_KEY = 'mein_lokales_mindmap_v2';

        let selectedNodeId = null;
        let isConnectingMode = false;
        let connectSourceId = null;

        let draggingNode = null;
        let dragOffsetX = 0, dragOffsetY = 0;

        let isPanning = false;
        let panX = 0, panY = 0;
        let startPanX = 0, startPanY = 0;
        let zoomScale = 1;

        // Erweiterte Emoji-Liste
        const EMOJI_LIST = [
            "⭐", "📌", "💡", "🚀", "⚠️", "✅", "🎯", "🔥", "❓", "‼️", "🚩", "🔍",
            "📝", "📊", "📈", "⚙️", "🛠️", "💻", "🔒", "🔑", "💰", "⏰", "📅", "🧠",
            "💬", "🏆", "👑", "⚡", "🌟", "🎨", "🏷️", "📍", "👍", "👎", "😀", "🤔"
        ];

        let undoStack = [];
        let redoStack = [];

        function recordState() {
            undoStack.push(JSON.stringify(mapData));
            if (undoStack.length > 30) undoStack.shift();
            redoStack = [];
        }

        function undo() {
            if (undoStack.length > 0) {
                redoStack.push(JSON.stringify(mapData));
                aktiveErsetzen(JSON.parse(undoStack.pop()));
                saveToStorage();
                render();
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                undoStack.push(JSON.stringify(mapData));
                aktiveErsetzen(JSON.parse(redoStack.pop()));
                saveToStorage();
                render();
            }
        }

        function generateId() { return 'node_' + Math.random().toString(36).substr(2, 9); }
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function sanitizeMapData(raw) {
            if (!raw) raw = {};
            if (!raw.nodes) raw.nodes = [];
            if (!raw.links) raw.links = [];
            if (!raw.backgroundColor) raw.backgroundColor = HELLER_HINTERGRUND;

            raw.nodes.forEach(n => {
                if (!n.color) n.color = "#1e293b";
                if (!n.emoji) n.emoji = "";
            });

            raw.links.forEach(l => {
                if (l.collapsed === undefined) l.collapsed = false;
            });

            return raw;
        }

        function setHint(text, isAlert = false) {
            const hint = document.getElementById('status-hint');
            hint.innerText = text;
            hint.style.color = isAlert ? 'var(--danger)' : 'var(--text-muted)';
        }

        function neueKennung() {
            return 'map_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function neueLeereMap(name) {
            return {
                id: neueKennung(),
                name: name || 'Neue Mindmap',
                backgroundColor: HELLER_HINTERGRUND,
                nodes: [{
                    id: generateId(),
                    text: "Zentrales Thema\n(Doppelklick zum Editieren)",
                    x: window.innerWidth / 2 - 100,
                    y: window.innerHeight / 2 - 40,
                    color: "#1e293b",
                    emoji: "💡"
                }],
                links: []
            };
        }

        /* Macht aus einer einzelnen Karte einen vollständigen Eintrag — auch aus
           Dateien der älteren Fassung, die weder Kennung noch Namen kannten. */
        function sanitizeMap(raw, name) {
            const m = sanitizeMapData(raw || {});
            m.id = String(m.id || neueKennung());
            m.name = String(m.name || name || 'Mindmap').trim() || 'Mindmap';
            return m;
        }

        function loadFromStorage() {
            let g = null;
            g = poLaden(SPEICHER);

            if (g && Array.isArray(g.maps) && g.maps.length) {
                maps = g.maps.map(m => sanitizeMap(m));
                aktivId = g.aktiv;
            } else {
                let alt = null;
                alt = poLaden(STORAGE_KEY);
                maps = [alt && alt.nodes ? sanitizeMap(alt, 'Mindmap') : neueLeereMap('Mindmap')];
                aktivId = maps[0].id;
            }

            if (!maps.some(m => m.id === aktivId)) aktivId = maps[0].id;
            mapData = maps.find(m => m.id === aktivId);
            undoStack = []; redoStack = [];
        }

        function saveToStorage() { poSichern(SPEICHER, { maps, aktiv: aktivId }); }

        /* Setzt eine zurückgenommene oder geöffnete Fassung an die Stelle der
           offenen Mindmap. Kennung und Name bleiben, sonst nähme ein Schritt
           zurück auch eine Umbenennung mit. */
        function aktiveErsetzen(roh) {
            const neu = sanitizeMapData(roh);
            neu.id = mapData.id;
            neu.name = mapData.name;
            const i = maps.findIndex(m => m.id === aktivId);
            if (i >= 0) maps[i] = neu; else maps.push(neu);
            mapData = neu;
        }

        /* Setzt die offene Mindmap auf Anfang zurück; die anderen bleiben, wie
           sie sind. */
        function initDefaultMap() {
            const frisch = neueLeereMap(mapData.name);
            frisch.id = mapData.id;
            frisch.name = mapData.name;
            const i = maps.findIndex(m => m.id === aktivId);
            if (i >= 0) maps[i] = frisch; else { maps.push(frisch); aktivId = frisch.id; }
            mapData = frisch;
            panX = 0; panY = 0; zoomScale = 1;
            updateCanvasPan();
            saveToStorage();
        }

        /* ---------- Die Liste der Mindmaps ---------- */

        /* Nicht aus render() heraus aufrufen: render() läuft beim Ziehen einer
           Karte bei jeder Mausbewegung, die Leiste würde dabei ständig neu
           gebaut. Nur dort rufen, wo sich die Liste wirklich ändert. */
        function renderMapList() {
            document.getElementById('mm-liste').innerHTML = maps.map(m => `
                <li class="mm-eintrag ${m.id === aktivId ? 'aktiv' : ''}" onclick="openMap('${m.id}')">
                    <input class="mm-name" value="${poEsc(m.name)}" onclick="event.stopPropagation()"
                           onchange="renameMap('${m.id}', this.value)">
                    <span class="mm-werkzeuge">
                        <button class="po-x" title="Löschen" onclick="event.stopPropagation(); deleteMap('${m.id}')">&#10005;</button>
                    </span>
                </li>`).join('');
        }

        /* Alles, was zur offenen Mindmap gehört und beim Wechsel nicht
           mitwandern darf: Auswahl, Schritte zurück, Ausschnitt. */
        function aktiveSetzen(m) {
            aktivId = m.id;
            mapData = m;
            selectedNodeId = null;
            isConnectingMode = false;
            connectSourceId = null;
            undoStack = []; redoStack = [];
            panX = 0; panY = 0; zoomScale = 1;
            updateCanvasPan();
        }

        function newMap() {
            const m = neueLeereMap();
            maps.unshift(m);
            aktiveSetzen(m);
            saveToStorage();
            renderMapList(); render();
        }

        function openMap(id) {
            if (id === aktivId) return;
            const m = maps.find(x => x.id === id);
            if (!m) return;
            aktiveSetzen(m);
            saveToStorage();
            renderMapList(); render();
        }

        function renameMap(id, wert) {
            const m = maps.find(x => x.id === id);
            if (!m) return;
            m.name = String(wert || '').trim() || m.name;
            saveToStorage();
            renderMapList();
        }

        async function deleteMap(id) {
            const m = maps.find(x => x.id === id);
            if (!m) return;
            const ja = await poConfirm(`„${m.name}“ wird gelöscht, mit ${m.nodes.length} Karten. Das lässt sich nicht rückgängig machen.`,
                                       { titel: 'Mindmap löschen', ja: 'Ja, löschen', gefahr: true });
            if (!ja) return;
            maps = maps.filter(x => x.id !== id);
            if (!maps.length) maps = [neueLeereMap('Mindmap')];
            if (aktivId === id) aktiveSetzen(maps[0]);
            saveToStorage();
            renderMapList(); render();
        }

        /* Auf einer Mindmap zählt die Fläche, also lässt sich die Leiste
           wegklappen. Der Zustand hält über das Schließen des Fensters. */
        function toggleSidebar(aus) {
            const f = document.getElementById('mm-flaeche');
            const zu = (aus === undefined) ? !f.classList.contains('zu') : !!aus;
            f.classList.toggle('zu', zu);
            poSichern(SEITE_AUS, zu);
        }

        function resetMap() {
            poConfirm('Alle Karten und Verbindungen dieser Mindmap werden gelöscht. Das lässt sich nicht rückgängig machen.',
                      { titel: 'Mindmap zurücksetzen', ja: 'Ja, alles löschen', gefahr: true }).then(ja => {
                if (!ja) return;
                recordState();
                initDefaultMap();
                selectedNodeId = null;
                isConnectingMode = false;
                render();
                poToast('Mindmap zurückgesetzt');
            });
        }

        function updateBgColorInline(color) {
            document.getElementById('workspace').style.backgroundColor = color;
        }

        function saveBgColor(color) {
            recordState();
            mapData.backgroundColor = color;
            saveToStorage();
        }

        function changeZoom(delta) {
            zoomScale = Math.min(Math.max(0.3, zoomScale + delta), 2.0);
            updateCanvasPan();
        }

        function resetZoom() {
            zoomScale = 1;
            updateCanvasPan();
        }

        function updateCanvasPan() {
            const container = document.getElementById('canvas-container');
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
            document.getElementById('workspace').style.backgroundPosition = `${panX}px ${panY}px`;
            document.getElementById('zoom-text').innerText = `${Math.round(zoomScale * 100)}%`;
        }

        function getNodeDepths() {
            const depths = {};
            if (mapData.nodes.length === 0) return depths;

            const rootId = mapData.nodes[0].id;
            depths[rootId] = 0;

            let queue = [rootId];
            let visited = new Set([rootId]);

            while (queue.length > 0) {
                let curr = queue.shift();
                let currentDepth = depths[curr];

                mapData.links.forEach(l => {
                    let nextId = null;
                    if (l.source === curr) nextId = l.target;
                    else if (l.target === curr) nextId = l.source;

                    if (nextId && !visited.has(nextId)) {
                        visited.add(nextId);
                        depths[nextId] = currentDepth + 1;
                        queue.push(nextId);
                    }
                });
            }

            mapData.nodes.forEach(n => {
                if (depths[n.id] === undefined) depths[n.id] = 999;
            });

            return depths;
        }

        function countSubtreeNodes(parentId, childId) {
            const visited = new Set([parentId, childId]);
            let count = 1;
            let queue = [childId];

            const depths = getNodeDepths();

            while (queue.length > 0) {
                let curr = queue.shift();
                mapData.links.forEach(l => {
                    let next = null;
                    if (l.source === curr && depths[l.target] > depths[curr]) next = l.target;
                    else if (l.target === curr && depths[l.source] > depths[curr]) next = l.source;

                    if (next && !visited.has(next)) {
                        visited.add(next);
                        count++;
                        queue.push(next);
                    }
                });
            }
            return count;
        }

        function getHiddenNodeIds() {
            const hidden = new Set();
            const depths = getNodeDepths();

            function hideSubtree(parentId) {
                mapData.links.forEach(l => {
                    let childId = null;
                    if (l.source === parentId && depths[l.target] > depths[parentId]) childId = l.target;
                    else if (l.target === parentId && depths[l.source] > depths[parentId]) childId = l.source;

                    if (childId && !hidden.has(childId)) {
                        hidden.add(childId);
                        hideSubtree(childId);
                    }
                });
            }

            mapData.links.forEach(l => {
                if (l.collapsed) {
                    let childId = depths[l.target] > depths[l.source] ? l.target : l.source;
                    hidden.add(childId);
                    hideSubtree(childId);
                }
            });

            return hidden;
        }

        function toggleLinkCollapse(linkIndex, event) {
            event.stopPropagation();
            recordState();
            mapData.links[linkIndex].collapsed = !mapData.links[linkIndex].collapsed;
            render();
        }

        /* --- EMOJI FUNKTIONEN --- */
        function toggleEmojiMenu(id, event) {
            event.stopPropagation();
            const dropdown = document.getElementById(`emoji-dropdown-${id}`);
            if (dropdown) {
                const isOpen = dropdown.classList.contains('open');
                document.querySelectorAll('.emoji-dropdown').forEach(d => d.classList.remove('open'));
                if (!isOpen) dropdown.classList.add('open');
            }
        }

        function setNodeEmoji(id, emoji, event) {
            if (event) event.stopPropagation();
            recordState();
            const node = mapData.nodes.find(n => n.id === id);
            if (node) {
                node.emoji = emoji;
                render();
            }
        }

        function promptCustomEmoji(id, event) {
            if (event) event.stopPropagation();
            poAsk('Eigenes Zeichen', [{ name: 'zeichen', label: 'Emoji oder Zeichen', platzhalter: 'z. B. ✈' }], { ok: 'Übernehmen' })
                .then(a => { if (a && a.zeichen) setNodeEmoji(id, a.zeichen.trim().slice(0, 4)); });
        }

        function render() {
            const nodesLayer = document.getElementById('nodes-layer');
            const svgLayer = document.getElementById('svg-layer');
            const workspace = document.getElementById('workspace');

            const currentBg = mapData.backgroundColor || HELLER_HINTERGRUND;
            workspace.style.backgroundColor = currentBg;
            document.getElementById('bg-color-picker').value = currentBg;

            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            const hiddenNodeIds = getHiddenNodeIds();
            const depths = getNodeDepths();

            // Knoten rendern
            mapData.nodes.forEach(node => {
                if (hiddenNodeIds.has(node.id)) return;

                const el = document.createElement('div');
                el.className = 'node';
                el.id = node.id;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                el.style.backgroundColor = node.color || KARTENFARBE;
                el.style.color = schriftfarbeZu(node.color || KARTENFARBE);

                const safeText = escapeHTML(node.text).replace(/\n/g, '<br>');
                const emojiHtml = node.emoji ? `<span class="node-emoji">${escapeHTML(node.emoji)}</span>` : '';
                el.innerHTML = `<div class="node-content">${emojiHtml}<span class="node-text">${safeText}</span></div>`;

                if (node.id === selectedNodeId && !isConnectingMode) el.classList.add('selected');
                if (isConnectingMode && node.id !== connectSourceId) el.classList.add('connect-target');

                // Emoji Grid HTML generieren
                let emojiGridItems = `<span onclick="setNodeEmoji('${node.id}', '', event)" title="Entfernen">❌</span>`;
                EMOJI_LIST.forEach(e => {
                    emojiGridItems += `<span onclick="setNodeEmoji('${node.id}', '${e}', event)">${e}</span>`;
                });
                emojiGridItems += `<span onclick="promptCustomEmoji('${node.id}', event)" title="Freie Eingabe">➕</span>`;

                const menu = document.createElement('div');
                menu.className = 'node-menu';
                menu.innerHTML = `
                    <div class="color-picker-wrapper" title="Farbe ändern">
                        <span>🎨</span>
                        <input type="color" value="${node.color || KARTENFARBE}"
                               oninput="updateNodeColorInline('${node.id}', this.value)"
                               onchange="saveNodeColor('${node.id}', this.value)">
                    </div>
                    <div class="emoji-picker-wrapper">
                        <button onclick="toggleEmojiMenu('${node.id}', event)" title="Emoji wählen">😀</button>
                        <div class="emoji-dropdown" id="emoji-dropdown-${node.id}">
                            ${emojiGridItems}
                        </div>
                    </div>
                    <button onclick="startConnection('${node.id}', event)" title="Verbinden">🔗</button>
                    <button onclick="deleteNode('${node.id}', event)" title="Löschen">🗑️</button>
                `;
                el.appendChild(menu);

                el.addEventListener('mousedown', (e) => handleNodeMouseDown(e, node));
                el.addEventListener('click', (e) => handleNodeClick(e, node.id));
                el.addEventListener('dblclick', (e) => editNodeInline(node.id, e));

                nodesLayer.appendChild(el);
            });

            // Verbindungen & Buttons rendern
            mapData.links.forEach((link, index) => {
                const source = mapData.nodes.find(n => n.id === link.source);
                const target = mapData.nodes.find(n => n.id === link.target);

                if (!source || !target) return;

                const isTargetChild = depths[target.id] > depths[source.id];
                const parentNode = isTargetChild ? source : target;
                const childNode = isTargetChild ? target : source;

                if (hiddenNodeIds.has(parentNode.id)) return;

                const parentEl = document.getElementById(parentNode.id);
                const pW = parentEl ? parentEl.offsetWidth : 140;
                const pH = parentEl ? parentEl.offsetHeight : 60;
                const pX = parentNode.x + pW / 2;
                const pY = parentNode.y + pH / 2;

                if (!link.collapsed && !hiddenNodeIds.has(childNode.id)) {
                    const childEl = document.getElementById(childNode.id);
                    const cW = childEl ? childEl.offsetWidth : 140;
                    const cH = childEl ? childEl.offsetHeight : 60;
                    const cX = childNode.x + cW / 2;
                    const cY = childNode.y + cH / 2;

                    const dx = cX - pX;
                    const dy = cY - pY;
                    const pathData = `M ${pX} ${pY} C ${pX + dx/2} ${pY}, ${cX - dx/2} ${cY}, ${cX} ${cY}`;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData);
                    path.setAttribute('class', 'link-path');

                    path.onclick = (e) => {
                        e.stopPropagation();
                        poConfirm('Die Verbindung zwischen den beiden Karten wird entfernt.',
                                  { titel: 'Verbindung löschen', ja: 'Ja, entfernen', gefahr: true }).then(ja => {
                            if (!ja) return;
                            recordState();
                            mapData.links.splice(index, 1);
                            render();
                        });
                    };
                    svgLayer.appendChild(path);

                    const midX = (pX + cX) / 2;
                    const midY = (pY + cY) / 2;

                    const toggleBtn = document.createElement('div');
                    toggleBtn.className = 'line-toggle-btn';
                    toggleBtn.style.left = midX + 'px';
                    toggleBtn.style.top = midY + 'px';
                    toggleBtn.innerText = '-';
                    toggleBtn.title = 'Ast einklappen';
                    toggleBtn.onclick = (e) => toggleLinkCollapse(index, e);

                    nodesLayer.appendChild(toggleBtn);
                }
                else if (link.collapsed) {
                    const cX = childNode.x + 70;
                    const cY = childNode.y + 30;

                    let dirX = cX - pX;
                    let dirY = cY - pY;
                    let len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;

                    const btnX = pX + (dirX / len) * (pW / 2 + 12);
                    const btnY = pY + (dirY / len) * (pH / 2 + 12);

                    const subCount = countSubtreeNodes(parentNode.id, childNode.id);

                    const toggleBtn = document.createElement('div');
                    toggleBtn.className = 'line-toggle-btn';
                    toggleBtn.style.left = btnX + 'px';
                    toggleBtn.style.top = btnY + 'px';
                    toggleBtn.innerText = `+ (${subCount})`;
                    toggleBtn.title = `${subCount} Karte(n) wieder ausklappen`;
                    toggleBtn.onclick = (e) => toggleLinkCollapse(index, e);

                    nodesLayer.appendChild(toggleBtn);
                }
            });

            updateCanvasPan();
            saveToStorage();
        }

        function createNewNodeCenter() {
            const x = (-panX + (window.innerWidth / 2) - 80) / zoomScale;
            const y = (-panY + (window.innerHeight / 2) - 30) / zoomScale;
            createNewNode(x, y);
        }

        function createNewNode(x, y) {
            recordState();
            const newNode = {
                id: generateId(),
                text: 'Neue Karte',
                x: x,
                y: y,
                color: KARTENFARBE,
                emoji: ''
            };
            mapData.nodes.push(newNode);
            selectedNodeId = newNode.id;
            render();
        }

        function deleteNode(id, event) {
            if (event) event.stopPropagation();
            recordState();
            mapData.nodes = mapData.nodes.filter(n => n.id !== id);
            mapData.links = mapData.links.filter(l => l.source !== id && l.target !== id);
            if (selectedNodeId === id) selectedNodeId = null;
            render();
        }

        function startConnection(id, event) {
            if (event) event.stopPropagation();
            isConnectingMode = true;
            connectSourceId = id;
            setHint("Klicke auf eine Zielkarte zum Verbinden (Escape zum Abbrechen)");
            render();
        }

        function updateNodeColorInline(id, color) {
            const el = document.getElementById(id);
            if (el) el.style.backgroundColor = color;
        }

        function saveNodeColor(id, color) {
            recordState();
            const node = mapData.nodes.find(n => n.id === id);
            if (node) { node.color = color; saveToStorage(); }
        }

        function editNodeInline(id, event) {
            event.stopPropagation();
            const node = mapData.nodes.find(n => n.id === id);
            if (!node) return;

            const el = document.getElementById(id);
            if (!el) return;

            const contentDiv = el.querySelector('.node-content');
            if (!contentDiv) return;

            const textarea = document.createElement('textarea');
            textarea.className = 'inline-editor';
            textarea.value = node.text;

            contentDiv.innerHTML = '';
            contentDiv.appendChild(textarea);
            textarea.focus();
            textarea.select();

            function save() {
                recordState();
                node.text = textarea.value.trim() || 'Karte';
                render();
            }

            textarea.addEventListener('blur', save);
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    textarea.blur();
                }
            });
        }

        function handleNodeMouseDown(e, node) {
            if (e.button !== 0 || isConnectingMode) return;
            e.stopPropagation();
            draggingNode = node;
            dragOffsetX = (e.clientX / zoomScale) - node.x;
            dragOffsetY = (e.clientY / zoomScale) - node.y;
        }

        function handleNodeClick(e, id) {
            e.stopPropagation();
            if (isConnectingMode) {
                if (connectSourceId && connectSourceId !== id) {
                    const exists = mapData.links.some(l =>
                        (l.source === connectSourceId && l.target === id) ||
                        (l.source === id && l.target === connectSourceId)
                    );
                    if (!exists) {
                        recordState();
                        mapData.links.push({ source: connectSourceId, target: id, collapsed: false });
                    }
                }
                isConnectingMode = false;
                connectSourceId = null;
                setHint("Tipp: Ziehen zum Bewegen | Doppelklick für neue Karte");
                render();
            } else {
                selectedNodeId = id;
                render();
            }
        }

        function handleWorkspaceDblClick(e) {
            if (e.target.id === 'workspace' || e.target.id === 'svg-layer' || e.target.id === 'canvas-container') {
                const rect = document.getElementById('workspace').getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const x = (mouseX - panX) / zoomScale;
                const y = (mouseY - panY) / zoomScale;
                createNewNode(x, y);
            }
        }

        // Workspace Events (Panning & Dragging)
        const workspace = document.getElementById('workspace');

        workspace.addEventListener('mousedown', (e) => {
            if (e.button === 0 && (e.target.id === 'workspace' || e.target.id === 'svg-layer' || e.target.id === 'canvas-container')) {
                isPanning = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
                selectedNodeId = null;
                if (isConnectingMode) {
                    isConnectingMode = false;
                    connectSourceId = null;
                    setHint("Tipp: Ziehen zum Bewegen | Doppelklick für neue Karte");
                }
                render();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (draggingNode) {
                draggingNode.x = (e.clientX / zoomScale) - dragOffsetX;
                draggingNode.y = (e.clientY / zoomScale) - dragOffsetY;
                render();
            } else if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateCanvasPan();
            }
        });

        window.addEventListener('mouseup', () => {
            if (draggingNode) {
                recordState();
                saveToStorage();
                draggingNode = null;
            }
            isPanning = false;
        });

        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.05 : -0.05;
            changeZoom(delta);
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

            if (e.key === 'Escape') {
                if (isConnectingMode) {
                    isConnectingMode = false;
                    connectSourceId = null;
                    setHint("Tipp: Ziehen zum Bewegen | Doppelklick für neue Karte");
                    render();
                }
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedNodeId) {
                    deleteNode(selectedNodeId);
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (e.shiftKey) redo();
                else undo();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                redo();
            }
        });

        // Import / Export
        /* Gesichert wird alles, nicht nur die offene Mindmap. */
        function exportJSON() {
            poDownload(`mindmaps_${new Date().toISOString().slice(0, 10)}.json`,
                       JSON.stringify({ format: 'pocketops-mindmap', version: 1,
                                        gesichertAm: new Date().toISOString(), maps }, null, 2));
            poToast(`Gesichert: ${maps.length} Mindmaps`);
        }

        function importJSON(input) {
            poReadFile(input, async text => {
                let p = null;
                try { p = JSON.parse(text); } catch (e) { p = null; }

                /* Neue Dateien bringen alle Mindmaps mit, ältere nur eine einzelne.
                   Beide müssen sich öffnen lassen. */
                let neue = null;
                if (p && Array.isArray(p.maps)) neue = p.maps.map((m, i) => sanitizeMap(m, 'Mindmap ' + (i + 1)));
                else if (p && Array.isArray(p.nodes)) neue = [sanitizeMap(p, 'Mindmap')];
                if (!neue || !neue.length) { poToast('Die Datei enthält keine Mindmap.', 4000); return; }

                const ja = await poConfirm(`${neue.length} Mindmaps werden geöffnet. Der jetzige Stand wird dabei ersetzt.`,
                                           { titel: 'Mindmaps öffnen', ja: 'Ja, ersetzen', gefahr: true });
                if (!ja) return;

                maps = neue;
                aktiveSetzen(maps[0]);
                saveToStorage();
                renderMapList(); render();
                poToast(`Geöffnet: ${neue.length} Mindmaps`);
            });
        }

        function exportPDF() {
            const element = document.getElementById('canvas-container');
            const opt = {
                margin:       10,
                filename:     `mindmap_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, backgroundColor: mapData.backgroundColor || '#0b0f19' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Init
        window.onload = () => {
            loadFromStorage();
            /* Früher lag hier '1' als nackte Zeichenkette; beides muss zählen. */
            if (_poJa(poLaden(SEITE_AUS))) toggleSidebar(true);
            renderMapList();
            render();
        };
    </script>
</body>
</html>
