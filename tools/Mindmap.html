    <style>
        /* PO-TOKENS:ANFANG (Urfassung: _design/po-tokens.css · nachziehen mit _design/sync.mjs) */
        /* ======================================================================
           POCKETOPS · GEMEINSAME GESTALTUNG
           Nachschlagefassung. Die Werkzeuge laden diese Datei nicht — jedes trägt
           den Block selbst, damit es als einzelne Datei läuft. Wird hier etwas
           geändert, muss es in alle Werkzeuge nachgezogen werden.
           ====================================================================== */
        /* Breite und Höhe schließen Innenabstand und Rahmen ein. Ohne das rechnet
           der Browser sie obendrauf, und eine Angabe wie width:100% ragt über ihren
           Platz hinaus. */
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* Markenfarben */
            --po-accent:      #9E292B;
            --po-accent-dark: #852224;
            --po-teal:        #39756F;
            --po-teal-dark:   #2F635E;
            --po-slate:       #697896;
            --po-frost:       #81BED7;
            --po-frost-soft:  #D9F3FF;
            --po-teal-soft:   #E8F5F1;
            --po-slate-soft:  #E0E8F8;

            /* Flächen */
            --po-bg:          #F1F5F9;
            --po-surface:     #FFFFFF;
            --po-surface-2:   #F8FAFC;
            --po-surface-3:   #E2E8F0;
            --po-stage:       #CBD5E1;

            /* Kopfzeile */
            --po-chrome:      #0F172A;
            --po-chrome-2:    #1E293B;
            --po-chrome-line: #334155;
            --po-on-chrome:   #F8FAFC;
            --po-on-chrome-2: #94A3B8;

            /* Text */
            --po-ink:         #1E293B;
            --po-ink-2:       #475569;
            --po-ink-3:       #94A3B8;

            /* Linien */
            --po-line:        #E2E8F0;
            --po-line-2:      #CBD5E1;

            /* Zustände */
            --po-ok:          #39756F;
            --po-warn:        #D89B2B;
            --po-bad:         #9E292B;

            /* Maße */
            --po-r-sm:   4px;
            --po-r:      6px;
            --po-r-lg:  10px;
            --po-r-pill: 999px;
            --po-head-h: 64px;
            --po-shadow:    0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .10);
            --po-shadow-lg: 0 10px 24px -8px rgba(15, 23, 42, .25);
            --po-font: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            --po-mono: 'Cascadia Mono', Consolas, 'Courier New', monospace;
        }

        /* ---------- Seitengerüst ---------- */
        .po-body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--po-bg);
            color: var(--po-ink);
            font-family: var(--po-font);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        .po-main { flex: 1; overflow: auto; padding: 20px; }
        .po-wrap { max-width: 1280px; margin: 0 auto; }
        .po-wrap--wide { max-width: 1600px; margin: 0 auto; }
        .po-split { display: grid; gap: 16px; align-items: start; }
        .po-split--1-2 { grid-template-columns: minmax(280px, 1fr) 2fr; }
        .po-split--2-1 { grid-template-columns: 2fr minmax(280px, 1fr); }
        .po-split--1-1 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 1000px) {
            .po-split--1-2, .po-split--2-1, .po-split--1-1 { grid-template-columns: 1fr; }
        }
        .po-stack > * + * { margin-top: 12px; }
        .po-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* ---------- Kopfzeile und Marke ---------- */
        .po-head {
            height: var(--po-head-h);
            background: var(--po-chrome);
            color: var(--po-on-chrome);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 20px;
            flex-shrink: 0;
            box-shadow: var(--po-shadow);
            position: relative;
            z-index: 20;
        }
        .po-head-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .po-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            border-radius: var(--po-r);
            padding: 4px 6px;
            margin-left: -6px;
            transition: background-color .15s;
        }
        a.po-brand:hover { background: var(--po-chrome-2); }
        .po-mark {
            width: 34px;
            height: 34px;
            border-radius: var(--po-r-lg);
            background: linear-gradient(135deg, var(--po-accent), var(--po-teal));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }
        .po-mark svg { width: 19px; height: 19px; display: block; }
        .po-brand-text { display: flex; flex-direction: column; line-height: 1.1; }
        .po-line-name {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--po-on-chrome-2);
        }
        .po-tool-name { font-size: 17px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
        .po-chip {
            font-size: 10px;
            font-weight: 600;
            color: var(--po-on-chrome-2);
            background: var(--po-chrome-2);
            border: 1px solid var(--po-chrome-line);
            border-radius: var(--po-r-pill);
            padding: 3px 9px;
            white-space: nowrap;
        }
        .po-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .po-head-sep { width: 1px; height: 24px; background: var(--po-chrome-line); flex-shrink: 0; }

        /* ---------- Sprache und Anleitung in der Kopfzeile ----------
           Beides setzt po-base.js selbst in die Kopfzeile, links vor die
           Aktionen des Werkzeugs: es gehört zur Reihe, nicht zum Werkzeug. */
        .po-meta { display: flex; align-items: center; gap: 8px; }
        .po-sprach {
            display: inline-flex;
            border: 1px solid var(--po-chrome-line);
            border-radius: var(--po-r-pill);
            overflow: hidden;
            background: var(--po-chrome-2);
        }
        .po-sprach button {
            font: inherit;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            padding: 5px 10px;
            border: none;
            background: transparent;
            color: var(--po-on-chrome-2);
            cursor: pointer;
            transition: background-color .15s, color .15s;
        }
        .po-sprach button:hover { color: #fff; }
        .po-sprach button[aria-pressed="true"] { background: var(--po-accent); color: #fff; }
        .po-sprach button:focus-visible { outline: 2px solid var(--po-frost); outline-offset: -2px; }
        .po-frage {
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: var(--po-r-pill);
            border: 1px solid var(--po-chrome-line);
            background: var(--po-chrome-2);
            color: #E2E8F0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color .15s, color .15s;
        }
        .po-frage:hover { background: #2B3A4F; color: #fff; }
        .po-frage:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }

        /* Der Trinkgeldknopf steht neben dem Fragezeichen und ist genauso gebaut. Nur
           das Herz trägt Farbe — auffallen soll er, drängeln nicht. */
        .po-trinkgeld {
            font: inherit;
            font-size: 13px;
            line-height: 1;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: var(--po-r-pill);
            border: 1px solid var(--po-chrome-line);
            background: var(--po-chrome-2);
            color: #E79A9B;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color .15s, color .15s;
        }
        .po-trinkgeld:hover { background: #2B3A4F; color: #fff; }
        .po-trinkgeld:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }

        /* Ein Verweis, der wie ein Knopf aussieht, bringt die Unterstreichung mit. */
        a.po-btn { text-decoration: none; }

        /* ---------- Das Hilfefenster ---------- */
        .po-hilfe { max-height: 68vh; overflow: auto; }
        .po-hilfe p { line-height: 1.55; }
        .po-hilfe a { color: var(--po-teal); font-weight: 600; }
        .po-hilfe-titel {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--po-ink-3);
            margin: 0 0 6px;
        }
        .po-hilfe-liste { margin: 0; padding-left: 20px; }
        .po-hilfe-liste li { margin-bottom: 5px; line-height: 1.5; }
        .po-hilfe-teil { border-top: 1px solid var(--po-line); margin-top: 14px; padding-top: 12px; }

        /* ---------- Schaltflächen ---------- */
        .po-btn {
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: var(--po-r);
            border: 1px solid var(--po-line-2);
            background: var(--po-surface);
            color: var(--po-ink-2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background-color .15s, border-color .15s, color .15s;
        }
        .po-btn:hover { background: var(--po-surface-2); border-color: var(--po-slate); color: var(--po-ink); }
        .po-btn:active { transform: translateY(1px); }
        .po-btn:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }
        .po-btn[disabled] { opacity: .5; cursor: not-allowed; }

        .po-head .po-btn { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #E2E8F0; }
        .po-head .po-btn:hover { background: #2B3A4F; border-color: #475569; color: #fff; }

        .po-btn--primary { background: var(--po-accent); border-color: var(--po-accent); color: #fff; }
        .po-btn--primary:hover { background: var(--po-accent-dark); border-color: var(--po-accent-dark); color: #fff; }
        .po-head .po-btn--primary { background: var(--po-accent); border-color: var(--po-accent); color: #fff; }
        .po-head .po-btn--primary:hover { background: var(--po-accent-dark); border-color: var(--po-accent-dark); color: #fff; }

        .po-btn--go { background: var(--po-teal); border-color: var(--po-teal); color: #fff; }
        .po-btn--go:hover { background: var(--po-teal-dark); border-color: var(--po-teal-dark); color: #fff; }

        .po-btn--danger { color: var(--po-bad); border-color: #FECACA; background: #FEF2F2; }
        .po-btn--danger:hover { background: #FEE2E2; border-color: #FCA5A5; color: #7F1D1D; }
        .po-head .po-btn--danger { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #FCA5A5; }
        .po-head .po-btn--danger:hover { background: #4C1D1D; border-color: #991B1B; color: #FEE2E2; }

        .po-btn--ghost { background: transparent; border-color: transparent; color: var(--po-ink-3); padding: 5px 7px; }
        .po-btn--ghost:hover { background: var(--po-surface-3); color: var(--po-ink); border-color: transparent; }

        .po-btn--sm { font-size: 11px; padding: 4px 8px; }
        .po-btn--block { width: 100%; justify-content: center; }

        /* kleines rundes Löschen-Kreuz in Listen und Tabellen */
        .po-x {
            font: inherit;
            font-size: 10px;
            line-height: 1;
            width: 18px;
            height: 18px;
            border-radius: var(--po-r-pill);
            border: 1px solid transparent;
            background: transparent;
            color: var(--po-ink-3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color .15s, color .15s;
        }
        .po-x:hover { background: #FEE2E2; color: var(--po-bad); }

        /* ---------- Panels und Abschnitte ---------- */
        .po-panel {
            background: var(--po-surface);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow);
        }
        .po-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            background: var(--po-surface-2);
            border-bottom: 1px solid var(--po-line);
            border-radius: var(--po-r-lg) var(--po-r-lg) 0 0;
        }
        .po-panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--po-ink-2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .po-panel-body { padding: 14px; }
        .po-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--po-ink-3);
            margin: 0 0 8px;
        }
        .po-hint {
            font-size: 11px;
            color: var(--po-ink-2);
            background: var(--po-surface-2);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r);
            padding: 10px 12px;
            line-height: 1.5;
        }

        /* ---------- Eingabefelder ---------- */
        .po-label { font-size: 11px; font-weight: 600; color: var(--po-ink-2); display: block; margin-bottom: 4px; }
        .po-input, .po-select, .po-textarea {
            font: inherit;
            font-size: 12px;
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--po-line-2);
            border-radius: var(--po-r);
            background: var(--po-surface);
            color: var(--po-ink);
            box-sizing: border-box;
        }
        /* Ein Farbfeld füllt der Browser selbst aus. Ohne eigene Höhe fiele es
           gegenüber den anderen Feldern zusammen, und der Innenabstand ließe den
           Farbfleck zu klein wirken. */
        .po-input[type="color"] { height: 32px; padding: 3px; cursor: pointer; }
        .po-input:focus, .po-select:focus, .po-textarea:focus {
            outline: none;
            border-color: var(--po-frost);
            box-shadow: 0 0 0 3px rgba(129, 190, 215, .25);
        }
        .po-textarea { min-height: 72px; resize: vertical; }
        .po-search { font-size: 13px; padding: 10px 14px; border-radius: var(--po-r-lg); }
        .po-num { width: 58px; text-align: center; padding: 5px 4px; }
        .po-field { display: flex; gap: 6px; align-items: center; }
        .po-field .po-input { flex: 1; min-width: 0; }

        .po-range { width: 100%; accent-color: var(--po-teal); }
        .po-range-value { font-weight: 700; color: var(--po-teal); font-variant-numeric: tabular-nums; }

        .po-check { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; font-weight: 600; color: var(--po-ink-2); cursor: pointer; }
        .po-check input { width: 15px; height: 15px; margin-top: 1px; accent-color: var(--po-teal); flex-shrink: 0; }

        /* ---------- Karten ---------- */
        .po-card {
            background: var(--po-surface);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow);
            padding: 14px;
        }
        .po-card--pick { cursor: pointer; transition: border-color .15s, background-color .15s; }
        .po-card--pick:hover { border-color: var(--po-frost); background: var(--po-surface-2); }

        /* ---------- Tabellen ---------- */
        .po-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .po-table th, .po-table td { padding: 8px 10px; border: 1px solid var(--po-line); text-align: left; }
        .po-table th {
            background: var(--po-surface-2);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--po-ink-2);
            white-space: nowrap;
        }
        .po-table tbody tr:nth-child(even) { background: var(--po-surface-2); }
        .po-table--center th, .po-table--center td { text-align: center; }
        .po-table--center th:first-child, .po-table--center td:first-child { text-align: left; }

        /* ---------- Zustände ---------- */
        .po-badge {
            font-size: 10px;
            font-weight: 700;
            border-radius: var(--po-r-pill);
            padding: 2px 8px;
            border: 1px solid transparent;
            display: inline-block;
        }
        .po-badge--ok   { color: var(--po-ok);  background: var(--po-teal-soft); border-color: #BFE3DA; }
        .po-badge--warn { color: #92610F;       background: #FEF6E7;             border-color: #F5D9A0; }
        .po-badge--bad  { color: var(--po-bad); background: #FEF2F2;             border-color: #FECACA; }
        .po-badge--neutral { color: var(--po-ink-2); background: var(--po-surface-3); border-color: var(--po-line-2); }

        .po-empty { text-align: center; color: var(--po-ink-3); font-size: 12px; padding: 28px 16px; line-height: 1.6; }

        /* ---------- Hinweisfenster unten rechts ---------- */
        .po-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 200;
            background: var(--po-chrome);
            color: var(--po-on-chrome);
            font-size: 12px;
            font-weight: 600;
            padding: 11px 16px;
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow-lg);
            max-width: 340px;
            line-height: 1.45;
        }

        /* ---------- Der Streifen, wenn nicht gespeichert werden konnte ----------
           Bewusst ein Streifen und kein Hinweisfenster: „deine Arbeit wird nicht
           gespeichert" darf nicht nach zwei Sekunden verschwinden. Er sitzt unten
           über der ganzen Breite, damit er auch dann auffällt, wenn der Blick in
           der Mitte der Seite klebt. Oben wäre die Kopfzeile verdeckt, und mit ihr
           der Knopf „Speichern", auf den der Text verweist. */
        .po-speicherwarnung {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 300;              /* über dem Hinweisfenster (200) und dem Dialog (150) */
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px 16px;
            background: #FEF2F2;
            border-top: 3px solid var(--po-bad);
            box-shadow: 0 -8px 20px -10px rgba(15, 23, 42, .3);
            font-size: 12px;
            line-height: 1.5;
            color: var(--po-ink);
        }
        .po-speicherwarnung-text { flex: 1; min-width: 0; }
        .po-speicherwarnung strong { display: block; color: var(--po-bad); font-size: 13px; margin-bottom: 2px; }
        .po-speicherwarnung-zu {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            border: 1px solid #FECACA;
            border-radius: var(--po-r);
            background: var(--po-surface);
            color: var(--po-bad);
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
        }
        .po-speicherwarnung-zu:hover { background: #FEE2E2; }

        /* ---------- Dialog ---------- */
        .po-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .po-dialog {
            background: var(--po-surface);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow-lg);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .po-dialog-head { padding: 16px 18px 0; font-size: 15px; font-weight: 700; color: var(--po-ink); }
        .po-dialog-body { padding: 10px 18px 16px; font-size: 13px; color: var(--po-ink-2); line-height: 1.55; }
        .po-dialog-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 18px;
            background: var(--po-surface-2);
            border-top: 1px solid var(--po-line);
        }

        /* ---------- Bildlaufleisten ---------- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--po-line-2); border-radius: var(--po-r-pill); }
        ::-webkit-scrollbar-thumb:hover { background: var(--po-slate); }

        /* ---------- Druck ---------- */
        @media print {
            .po-head, .po-toast, .po-backdrop, .po-no-print { display: none !important; }
            .po-body { height: auto; overflow: visible; }
            .po-main { overflow: visible; padding: 0; }
            .po-panel { box-shadow: none; border-color: #ccc; }
        }
        /* PO-TOKENS:ENDE */

        *, *::before, *::after { box-sizing: border-box; }

        /* Die alten Namen bleiben, die Werte kommen jetzt aus der Reihe */
        :root {
            --bg-color: #F1F5F9;
            --panel-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #94A3B8;
            --primary: #39756F;
            --primary-hover: #2F635E;
            --accent: #81BED7;
            --border-color: #E2E8F0;
            --line-color: #94A3B8;
            --danger: #9E292B;
            --success: #39756F;
        }

        body {
            font-family: var(--po-font);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER & FLOATING BAR --- */
        .header {
            display: flex;
            gap: 12px;
            padding: 12px 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
        }

        /* Knöpfe ohne eigene Klasse folgen dem Aussehen der Reihe */
        button {
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: var(--po-r);
            border: 1px solid var(--po-line-2);
            background: var(--po-surface);
            color: var(--po-ink-2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color .15s, border-color .15s, color .15s;
        }
        button:hover { background: var(--po-surface-2); border-color: var(--po-slate); color: var(--po-ink); }

        .bg-picker-wrapper { position: relative; display: inline-block; }
        .bg-picker-wrapper input[type="color"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .hint-text { color: var(--po-on-chrome-2); font-size: 10px; font-weight: 600; white-space: nowrap; }

        /* --- Seitenleiste mit den Mindmaps --- */
        .mm-flaeche {
            flex: 1; display: grid; grid-template-columns: 212px 1fr;
            overflow: hidden; transition: grid-template-columns .18s ease;
        }
        .mm-flaeche.zu { grid-template-columns: 0 1fr; }
        /* Sonst bliebe die Trennlinie der Leiste als Strich stehen. */
        .mm-flaeche.zu .mm-seite { border-right: none; }

        .mm-seite {
            display: flex; flex-direction: column; min-width: 0;
            background: var(--po-surface); border-right: 1px solid var(--po-line); overflow: hidden;
        }
        .mm-kopf {
            display: flex; align-items: center; gap: 4px;
            padding: 9px 8px 9px 14px; flex-shrink: 0;
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--po-ink-3);
        }
        .mm-kopf > span { flex: 1; min-width: 0; }
        .mm-knopf {
            font: inherit; font-size: 15px; line-height: 1; width: 22px; height: 22px; padding: 0;
            border: 1px solid transparent; background: transparent; color: var(--po-ink-3);
            border-radius: var(--po-r-sm); cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .mm-knopf:hover { background: var(--po-surface-3); border-color: transparent; color: var(--po-teal); }

        .mm-liste { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; flex: 1; }
        .mm-eintrag {
            display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: var(--po-r);
            cursor: pointer; font-size: 12.5px; color: var(--po-ink-2); line-height: 1.35;
        }
        .mm-eintrag:hover { background: var(--po-surface-3); }
        .mm-eintrag.aktiv { background: var(--po-surface); color: var(--po-ink); font-weight: 700; box-shadow: var(--po-shadow); }
        .mm-name { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 12.5px; color: inherit; font-weight: inherit; padding: 1px 3px; }
        .mm-name:focus { outline: none; background: var(--po-surface-2); border-radius: var(--po-r-sm); box-shadow: 0 0 0 2px rgba(129,190,215,.35); }
        .mm-werkzeuge { display: flex; opacity: 0; transition: opacity .15s; }
        .mm-eintrag:hover .mm-werkzeuge, .mm-eintrag.aktiv .mm-werkzeuge { opacity: 1; }

        /* Holt die ausgeblendete Leiste zurueck. Steht in der Flaeche und nicht
           in der Leiste — sonst verschwaende er mit ihr. */
        .mm-zeigen {
            position: absolute; top: 12px; left: 12px; z-index: 6;
            width: 30px; height: 30px; padding: 0; font-size: 15px; line-height: 1;
            background: var(--po-surface); border: 1px solid var(--po-line-2); color: var(--po-ink-2);
            border-radius: var(--po-r); box-shadow: var(--po-shadow); cursor: pointer;
            display: none; align-items: center; justify-content: center;
        }
        .mm-flaeche.zu .mm-zeigen { display: flex; }

        /* --- WORKSPACE & CANVAS --- */
        .workspace {
            flex-grow: 1;
            position: relative;
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(15, 23, 42, 0.14) 1px, transparent 1px);
            background-size: 24px 24px;
            cursor: grab;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        .workspace:active { cursor: grabbing; }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: 0 0;
            pointer-events: none;
        }

        #svg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;
        }

        .link-path {
            stroke: var(--line-color);
            stroke-width: 2.5px;
            fill: none;
            pointer-events: stroke;
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        .link-path:hover { stroke: var(--danger); stroke-width: 4px; }

        /* --- LINE TOGGLE BUTTON (OHNE FARBIGEN KREIS) --- */
        .line-toggle-btn {
            position: absolute;
            background: transparent;
            color: var(--text-main);
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: none;
            z-index: 25;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            transition: transform 0.2s, color 0.2s;
            text-shadow: 0 1px 3px rgba(255,255,255,.9);
            user-select: none;
            padding: 2px;
        }
        .line-toggle-btn:hover {
            transform: translate(-50%, -50%) scale(1.3);
            color: var(--accent);
            background: transparent;
        }

        /* --- NODES --- */
        #nodes-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20;
        }

        .node {
            position: absolute;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            min-width: 140px;
            max-width: 280px;
            text-align: center;
            box-shadow: var(--po-shadow-lg);
            cursor: grab;
            pointer-events: auto;
            word-wrap: break-word;
            user-select: none;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        .node:active { cursor: grabbing; }

        .node.selected {
            border-color: var(--po-teal);
            box-shadow: 0 0 0 3px rgba(57, 117, 111, .3), var(--po-shadow-lg);
            z-index: 30;
        }

        .node.connect-target:hover {
            border-color: var(--po-frost);
            box-shadow: 0 0 0 3px rgba(129, 190, 215, .45);
            cursor: crosshair;
        }

        .node-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .node-emoji {
            font-size: 1.25em;
            line-height: 1;
        }

        /* --- FLOATING MENU FOR SELECTED NODE --- */
        .node-menu {
            display: none; position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            background: var(--po-surface);
            border: 1px solid var(--po-line); border-radius: var(--po-r); padding: 4px; gap: 2px;
            z-index: 40; pointer-events: auto; white-space: nowrap;
            box-shadow: var(--po-shadow-lg);
        }

        .node.selected .node-menu { display: flex; }

        .node-menu button {
            background: transparent; border-color: transparent; color: var(--po-ink-2);
            padding: 4px 7px; font-size: 13px; margin: 0; border-radius: var(--po-r-sm);
        }
        .node-menu button:hover { background: var(--po-surface-3); border-color: transparent; }

        .color-picker-wrapper { position: relative; display: inline-block; cursor: pointer; }
        .color-picker-wrapper input[type="color"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .color-picker-wrapper span {
            padding: 4px 8px; font-size: 13px; display: block; border-radius: 4px; cursor: pointer;
        }
        .color-picker-wrapper:hover span { background: var(--po-surface-3); }

        /* --- EXPANDED EMOJI PICKER DROPDOWN --- */
        .emoji-picker-wrapper {
            position: relative;
            display: inline-block;
        }

        .emoji-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 6px;
            background: var(--po-surface);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r-lg);
            padding: 8px;
            gap: 4px;
            grid-template-columns: repeat(6, 1fr);
            max-height: 200px;
            width: 220px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: var(--po-shadow-lg);
        }

        .emoji-dropdown.open {
            display: grid;
        }

        .emoji-dropdown span {
            cursor: pointer;
            padding: 6px 0;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
            transition: background 0.15s, transform 0.1s;
            user-select: none;
        }

        .emoji-dropdown span:hover {
            background: var(--po-surface-3);
            transform: scale(1.15);
        }

        /* --- INLINE EDITOR --- */
        .inline-editor {
            width: 100%; min-height: 80px; border: none; background: transparent;
            resize: vertical; font-family: inherit; font-size: 14px; text-align: center;
            outline: none; color: inherit; line-height: 1.4;
        }

        /* --- ZOOM CONTROLS --- */
        .zoom-controls {
            position: absolute; bottom: 20px; right: 20px; z-index: 90;
            display: flex; gap: 6px; background: var(--po-surface);
            padding: 6px; border-radius: var(--po-r-lg); border: 1px solid var(--po-line);
            box-shadow: var(--po-shadow);
        }
        .zoom-controls button { padding: 6px 12px; font-size: 14px; box-shadow: none; }
    </style>
</head>

    <script>
        const HELLER_HINTERGRUND = '#F1F5F9';
        const KARTENFARBE = '#FFFFFF';

        // Dunkle Karten brauchen helle Schrift, helle Karten dunkle.
        function schriftfarbeZu(hintergrund) {
            const h = String(hintergrund || KARTENFARBE).replace('#', '');
            if (h.length !== 6) return '#1E293B';
            const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255)
                .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
            const hell = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            return hell > 0.45 ? '#1E293B' : '#F8FAFC';
        }

        /* PO-BASE:ANFANG (Urfassung: _design/po-base.js · nachziehen mit _design/sync.mjs) */
        /* ======================================================================
           POCKETOPS · GEMEINSAME BAUSTEINE
           Nachschlagefassung. Die Werkzeuge laden diese Datei nicht — jedes trägt
           den Block selbst, damit es als einzelne Datei läuft.

           poToast(text)                  kurzer Hinweis unten rechts
           poConfirm(frage, opt)          Rückfrage, liefert ein Versprechen
           poAsk(titel, felder)           kleine Eingabemaske statt prompt()
                                          Feld: { name, label, wert, typ, pflicht }
                                          typ 'date', 'number', 'color' kommen vom
                                          Browser; typ 'auswahl' braucht zusätzlich
                                          optionen: [{ wert, text }] und wird zur Liste
           poEsc(text)                    Text für HTML entschärfen
           poDownload(name, text, typ)    Datei zum Herunterladen anbieten
           poReadFile(input, fn)          gewählte Datei als Text lesen
           poSichern(schluessel, wert)    sofort in den Browser-Speicher, mit
                                          Prüfung und sichtbarem Fehlschlag
           poLaden(schluessel, ersatz)    Stand zurücklesen
           poVergessen(schluessel)        Stand löschen
           poSpeicherLage()               was im Speicher liegt und wie viel
           poBrowser()                    Browser, dem der Speicher gehört
           poSpeicherStoerung()           denselben Streifen für Werkzeuge mit
           poSpeicherBehoben()            eigener Ablage in IndexedDB
           poBeimVerlassen(fn)            vor dem Schliessen noch wegschreiben
           PO_ABLAGEN                     Verzeichnis aller Ablagen der Reihe
           poAblageName(k)                Werkzeug zu einem Schlüssel, sonst null
           ====================================================================== */

        function poEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        let _poToastTimer = null;
        function poToast(text, dauer = 2600) {
            let t = document.getElementById('po-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'po-toast';
                t.className = 'po-toast';
                document.body.appendChild(t);
            }
            t.textContent = text;
            t.style.display = 'block';
            clearTimeout(_poToastTimer);
            _poToastTimer = setTimeout(() => { t.style.display = 'none'; }, dauer);
        }

        function _poModal(innerHtml, aufbau) {
            const back = document.createElement('div');
            back.className = 'po-backdrop';
            back.innerHTML = `<div class="po-dialog" role="dialog" aria-modal="true">${innerHtml}</div>`;
            document.body.appendChild(back);
            const schliessen = () => { document.removeEventListener('keydown', aufTaste); back.remove(); };
            const aufTaste = e => { if (e.key === 'Escape') { e.preventDefault(); back.__abbruch && back.__abbruch(); } };
            document.addEventListener('keydown', aufTaste);
            back.addEventListener('mousedown', e => { if (e.target === back) back.__abbruch && back.__abbruch(); });
            aufbau(back, schliessen);
            return back;
        }

        function poConfirm(frage, { titel = 'Bitte bestätigen', ja = 'Ja, weiter', nein = 'Abbrechen', gefahr = false } = {}) {
            return new Promise(res => {
                _poModal(`
                    <div class="po-dialog-head">${poEsc(titel)}</div>
                    <div class="po-dialog-body">${poEsc(frage)}</div>
                    <div class="po-dialog-foot">
                        <button class="po-btn" data-nein>${poEsc(nein)}</button>
                        <button class="po-btn ${gefahr ? 'po-btn--primary' : 'po-btn--go'}" data-ja>${poEsc(ja)}</button>
                    </div>`, (back, schliessen) => {
                    const fertig = wert => { schliessen(); res(wert); };
                    back.__abbruch = () => fertig(false);
                    back.querySelector('[data-nein]').onclick = () => fertig(false);
                    back.querySelector('[data-ja]').onclick = () => fertig(true);
                    setTimeout(() => back.querySelector('[data-ja]').focus(), 30);
                });
            });
        }

        /* felder: [{ name, label, wert, typ: 'text'|'number', min, max, pflicht }]
           Ergebnis: Objekt mit den Werten, oder null bei Abbruch. */
        function poAsk(titel, felder, { ok = 'Hinzufügen' } = {}) {
            return new Promise(res => {
                /* typ: 'auswahl' erwartet zusätzlich optionen: [{ wert, text }] und wird
                   zur Liste. Alles andere geht als type an ein <input> — 'date', 'number'
                   und 'color' kommen so vom Browser, ohne eigenes Zutun. */
                const html = felder.map((f, i) => {
                    const feld = f.typ === 'auswahl'
                        ? `<select class="po-select" id="po-f-${i}">`
                          + (f.optionen || []).map(o =>
                                `<option value="${poEsc(o.wert)}"${String(o.wert) === String(f.wert) ? ' selected' : ''}>${poEsc(o.text)}</option>`
                            ).join('')
                          + `</select>`
                        : `<input class="po-input" id="po-f-${i}" type="${f.typ || 'text'}"
                               value="${poEsc(f.wert == null ? '' : f.wert)}"
                               ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''}
                               ${f.platzhalter ? `placeholder="${poEsc(f.platzhalter)}"` : ''}>`;
                    return `
                    <div style="margin-bottom:10px">
                        <label class="po-label" for="po-f-${i}">${poEsc(f.label)}</label>
                        ${feld}
                    </div>`;
                }).join('');
                _poModal(`
                    <div class="po-dialog-head">${poEsc(titel)}</div>
                    <div class="po-dialog-body"><form id="po-ask-form">${html}</form></div>
                    <div class="po-dialog-foot">
                        <button class="po-btn" data-nein>Abbrechen</button>
                        <button class="po-btn po-btn--go" data-ja>${poEsc(ok)}</button>
                    </div>`, (back, schliessen) => {
                    const fertig = wert => { schliessen(); res(wert); };
                    back.__abbruch = () => fertig(null);
                    back.querySelector('[data-nein]').onclick = () => fertig(null);
                    const senden = () => {
                        const out = {};
                        let fehlt = null;
                        felder.forEach((f, i) => {
                            const el = back.querySelector('#po-f-' + i);
                            let v = el.value.trim();
                            if (f.typ === 'number') v = v === '' ? null : Number(v);
                            if (f.pflicht !== false && (v === '' || v === null)) fehlt = fehlt || el;
                            out[f.name] = v;
                        });
                        if (fehlt) { fehlt.focus(); fehlt.style.borderColor = 'var(--po-bad)'; return; }
                        fertig(out);
                    };
                    back.querySelector('[data-ja]').onclick = senden;
                    back.querySelector('#po-ask-form').onsubmit = e => { e.preventDefault(); senden(); };
                    setTimeout(() => back.querySelector('#po-f-0') && back.querySelector('#po-f-0').focus(), 30);
                });
            });
        }

        function poDownload(name, inhalt, typ = 'application/json') {
            const blob = new Blob([inhalt], { type: typ });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        }

        function poReadFile(input, fn) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f) return;
            const r = new FileReader();
            const melden = e => poToast('Die Datei lässt sich nicht lesen: ' + (e && e.message ? e.message : e), 4200);
            r.onerror = () => melden(new Error('Die Datei ließ sich nicht öffnen.'));
            r.onload = ev => {
                // Ein Rückruf mit async wirft nicht, er gibt ein abgelehntes Versprechen
                // zurück. Beides muss hier ankommen, sonst bleibt ein Fehler stumm.
                try {
                    const p = fn(ev.target.result);
                    if (p && typeof p.catch === 'function') p.catch(melden);
                } catch (e) { melden(e); }
            };
            r.readAsText(f);
        }

        /* ======================================================================
           POCKETOPS · SPEICHERN

           poSichern(schluessel, wert)   schreibt sofort und prüft, ob es ankam
           poLaden(schluessel, ersatz)   liest zurück, verträgt Schrott
           poVergessen(schluessel)       Stand löschen
           poSpeicherLage()              was liegt im Speicher, wie viel ist es
           poBrowser()                   Name des Browsers, dem der Speicher gehört

           Jede Eingabe wird augenblicklich geschrieben. Es gibt für den
           Browser-Speicher keinen Speicherknopf und soll keinen geben — wer ein
           Ticket anlegt und das Fenster schliesst, muss es beim nächsten Öffnen
           wiederfinden. Der Knopf „Speichern“ in der Kopfzeile ist etwas
           anderes: die .json-Datei, die den Browser überlebt.

           Zwei Dinge dürfen dabei nie stumm bleiben:

           1. Ein fehlgeschlagener Schreibvorgang. Der Browser-Speicher ist auf
              wenige Megabyte begrenzt, und alle Werkzeuge teilen sich diesen
              einen Vorrat, weil sie unter derselben Adresse laufen. Läuft er
              über, wirft setItem. Früher stand der Aufruf in mehreren
              Werkzeugen ohne try — die Karte war gezeichnet, gespeichert war
              nichts, und niemand erfuhr davon. Darum wird hier jeder
              Schreibvorgang zurückgelesen und ein Fehlschlag angesagt.

           2. Dass der Speicher dem Browser gehört, nicht der Datei. Dieselbe
              Datei einmal in Chrome und einmal in Edge geöffnet zeigt zwei
              getrennte Ablagen. Die Arbeit ist dann nicht weg, sie liegt im
              anderen Browser — aber ohne Hinweis sieht es nach Datenverlust
              aus. Die Anleitung sagt es darum ausdrücklich und nennt den
              Browser, in dem man gerade sitzt.
           ====================================================================== */

        const _poVoll = e => !!e && (e.name === 'QuotaExceededError'
                                  || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
                                  || e.code === 22);

        /* Welcher Schlüssel zuletzt nicht geschrieben werden konnte. Nötig, damit
           ein winziger Schreibvorgang, der auch bei vollem Speicher noch durchgeht
           — eine Seitenleisten-Einstellung etwa —, den Streifen nicht wegräumt,
           während die eigentliche Arbeit weiterhin nicht gespeichert wird. */
        let _poSpeicherKaputt = null;

        /* Einmal zu Anfang prüfen, ob überhaupt geschrieben werden darf. Im
           privaten Fenster mancher Browser und bei gesperrtem Speicher wirft
           schon der Zugriff auf localStorage, nicht erst setItem.

           Ein voller Speicher gilt dabei ausdrücklich als vorhanden. Lesen geht
           dort noch, ein kleinerer Stand passt womöglich hinein, und vor allem:
           sonst meldete jedes Werkzeug nach einem Neuladen bei vollem Vorrat
           „dieser Browser lässt keinen Speicher zu". Das ist die falsche Auskunft
           und schickt den Nutzer zur falschen Abhilfe — aufräumen hilft, ein
           anderer Browser nicht. */
        const _poSpeicherDa = (() => {
            try {
                localStorage.setItem('po_probe', '1');
                localStorage.removeItem('po_probe');
                return true;
            } catch (e) { return _poVoll(e); }
        })();

        function poSichern(schluessel, wert) {
            const text = JSON.stringify(wert);
            if (text === undefined) return false;          // nichts Speicherbares
            if (!_poSpeicherDa) { _poSpeicherKaputt = schluessel; _poSpeicherWarnen('zu'); return false; }
            try {
                localStorage.setItem(schluessel, text);
            } catch (e) {
                _poSpeicherKaputt = schluessel;
                _poSpeicherWarnen(_poVoll(e) ? 'voll' : 'fehler');
                return false;
            }
            /* Zurücklesen. Es gibt Umgebungen, die setItem annehmen und den Wert
               nicht behalten; ohne diese Prüfung merkt das niemand. */
            if (localStorage.getItem(schluessel) !== text) {
                _poSpeicherKaputt = schluessel;
                _poSpeicherWarnen('fluechtig');
                return false;
            }
            if (_poSpeicherKaputt === null || _poSpeicherKaputt === schluessel) {
                _poSpeicherKaputt = null;
                _poSpeicherEntwarnen();
            }
            return true;
        }

        function poLaden(schluessel, ersatz = null) {
            if (!_poSpeicherDa) return ersatz;
            let roh = null;
            try { roh = localStorage.getItem(schluessel); } catch (e) { return ersatz; }
            if (roh === null || roh === '') return ersatz;
            try {
                const w = JSON.parse(roh);
                return (w === null || w === undefined) ? ersatz : w;
            } catch (e) {
                /* Eine Fassung von früher hat nackten Text abgelegt, kein JSON.
                   Zurückgeben nur dann, wenn das Werkzeug überhaupt Text erwartet —
                   sonst bekäme es eine Zeichenkette, wo es ein Objekt auspackt. */
                return typeof ersatz === 'string' ? roh : ersatz;
            }
        }

        /* Löschen gehört dazu: ein zurückgesetztes Werkzeug soll keinen alten
           Stand hinterlassen, der beim nächsten Öffnen wieder auftaucht. */
        function poVergessen(schluessel) {
            try { localStorage.removeItem(schluessel); return true; } catch (e) { return false; }
        }

        /* Ein Ja/Nein aus dem Speicher. Ältere Stände haben '1' und '0' als nackte
           Zeichenketten abgelegt, neue true und false — beides muss gelesen werden,
           sonst verliert ein Nutzer beim Umstieg seine Einstellung. */
        const _poJa = v => v === true || v === 1 || v === '1';

        /* ---------- Der Hinweis, wenn nicht gespeichert werden konnte ----------
           Bewusst kein poToast: ein Hinweis, der nach zwei Sekunden verschwindet,
           ist für „deine Arbeit wird nicht gespeichert“ das falsche Mittel. Der
           Streifen bleibt stehen, bis der nächste Schreibvorgang gelingt oder der
           Nutzer ihn wegklickt. */

        const _PO_SPEICHER_GRUENDE = {
            voll: {
                kurz: 'Nicht gespeichert: der Browser-Speicher ist voll.',
                lang: 'Alle PocketOps-Werkzeuge teilen sich einen Vorrat von wenigen Megabyte. Lege deine Arbeit jetzt mit dem Knopf oben rechts in der Kopfzeile als .json-Datei ab und räume in den anderen Werkzeugen auf, was du nicht mehr brauchst.'
            },
            zu: {
                kurz: 'Nicht gespeichert: dieser Browser lässt keinen Speicher zu.',
                lang: 'Im privaten Fenster und bei gesperrtem Speicher kann das Werkzeug nichts ablegen. Deine Arbeit ist nur so lange da, wie dieses Fenster offen bleibt. Lege sie mit dem Knopf oben rechts in der Kopfzeile als .json-Datei ab.'
            },
            fluechtig: {
                kurz: 'Nicht gespeichert: der Browser behält den Stand nicht.',
                lang: 'Das Werkzeug hat geschrieben und beim Zurücklesen etwas anderes gefunden. Verlasse dich hier nicht auf den Browser-Speicher, sondern lege deine Arbeit mit dem Knopf oben rechts in der Kopfzeile als .json-Datei ab.'
            },
            fehler: {
                kurz: 'Nicht gespeichert: der Browser hat den Stand abgelehnt.',
                lang: 'Der Grund ist von hier aus nicht zu erkennen. Lege deine Arbeit jetzt mit dem Knopf oben rechts in der Kopfzeile als .json-Datei ab, damit sie nicht an diesem Fenster hängt.'
            },
            /* Notizbuch, Dokument, SlideCraft und Sprachmemo legen nicht in
               localStorage ab, sondern in der Browser-Datenbank — dort passen Bilder
               und Tonaufnahmen hinein, die den Vorrat von localStorage sprengen
               würden. Scheitert das, soll derselbe Streifen stehen wie sonst. */
            ablage: {
                kurz: 'Nicht gespeichert: die Ablage des Browsers antwortet nicht.',
                lang: 'Dieses Werkzeug legt in der Browser-Datenbank ab, und die ist gerade nicht zu erreichen — im privaten Fenster zum Beispiel. Lege deine Arbeit mit dem Knopf oben rechts in der Kopfzeile als .json-Datei ab, solange dieses Fenster offen ist.'
            }
        };

        /* Für die Werkzeuge mit eigener Ablage: denselben bleibenden Streifen
           anzeigen, statt den Fehlschlag in die Konsole zu schreiben, wo ihn
           niemand sieht. Die Marke ist bewusst kein gültiger Schlüsselname, damit
           sie sich nicht mit einem echten Schlüssel aus localStorage überschneidet. */
        const _PO_ABLAGE = '\u0001ablage';
        function poSpeicherStoerung() { _poSpeicherKaputt = _PO_ABLAGE; _poSpeicherWarnen('ablage'); }
        function poSpeicherBehoben() {
            if (_poSpeicherKaputt === _PO_ABLAGE) { _poSpeicherKaputt = null; _poSpeicherEntwarnen(); }
        }

        /* ---------- Beim Verlassen noch wegschreiben ----------
           Werkzeuge, die ihre Schreibvorgänge bündeln — ein Zeichenbrett schreibt
           nicht bei jedem Strich —, müssen sie loswerden, bevor die Seite
           verschwindet. Sonst verliert genau der Nutzer seine letzte Eingabe, der
           nach dem Tippen sofort schliesst.

           Nicht beforeunload allein: beim Schliessen eines Tabs löst Chrome den
           Haken nicht verlässlich aus. visibilitychange auf 'hidden' und pagehide
           kommen zuverlässig und noch früh genug für einen Schreibvorgang. Alle drei
           werden gesetzt, der Aufruf muss also mehrfaches Ausführen aushalten — bei
           einem Schreibvorgang, der immer denselben Stand ablegt, ist das gegeben.

           visibilitychange hat einen zweiten Nutzen: es greift auch, wenn der Nutzer
           bloss den Tab wechselt. Dann ist der Stand schon weg, bevor irgendetwas
           schiefgehen kann. */
        function poBeimVerlassen(fn) {
            /* Notizbuch, Dokument und SlideCraft geben hier eine async-Funktion
               herein. Die wirft nicht, sie liefert ein abgelehntes Versprechen —
               dasselbe, was bei poReadFile schon zu beachten war. Beides muss hier
               verschwinden, denn beim Verlassen der Seite soll kein Fehler mehr
               auffallen, auf den niemand reagieren kann. */
            const weg = () => {
                try {
                    const v = fn();
                    if (v && typeof v.catch === 'function') v.catch(() => {});
                } catch (e) { /* beim Verlassen nicht noch stolpern */ }
            };
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') weg(); });
            window.addEventListener('pagehide', weg);
            window.addEventListener('beforeunload', weg);
        }

        function _poSpeicherWarnen(art) {
            const g = _PO_SPEICHER_GRUENDE[art] || _PO_SPEICHER_GRUENDE.fehler;
            let s = document.getElementById('po-speicher-warnung');
            if (!s) {
                s = document.createElement('div');
                s.id = 'po-speicher-warnung';
                s.className = 'po-speicherwarnung';
                s.setAttribute('role', 'alert');
                s.innerHTML = '<div class="po-speicherwarnung-text"><strong></strong><span></span></div>'
                            + '<button type="button" class="po-speicherwarnung-zu" title="Schließen" aria-label="Schließen">&#10005;</button>';
                s.querySelector('button').onclick = () => s.remove();
                (document.body || document.documentElement).appendChild(s);
            }
            /* Beim Wechsel des Grundes den Text austauschen, nicht einen zweiten
               Streifen aufbauen. */
            s.querySelector('strong').textContent = g.kurz;
            s.querySelector('span').textContent = g.lang;
        }

        function _poSpeicherEntwarnen() {
            const s = document.getElementById('po-speicher-warnung');
            if (s) s.remove();
        }

        /* ======================================================================
           POCKETOPS · WAS WO LIEGT

           Ein Verzeichnis aller Ablagen der Reihe. Zwei Stellen brauchen es:
           die Übersicht sichert daraus das Gesamtsystem, und „Sichern &
           Zurückholen" zeigt daraus an, was gerade im Browser liegt.

           Es steht hier und nicht an beiden Stellen, weil zwei Kopien
           auseinanderlaufen. Und eine hier vergessene Zeile heisst: die Arbeit
           eines Werkzeugs wandert nicht in die Gesamtsicherung. Kommt ein
           Werkzeug dazu, gehört sein Schlüssel hierher — der Schritt steht auch
           in _design/LIESMICH.md unter „Ein neues Werkzeug aufnehmen".
           ====================================================================== */

        const PO_ABLAGEN = {

            /* Schlüssel in localStorage → Werkzeug, dem sie gehören */
            schluessel: {
                po_kanban:        'Kanban',
                po_kanban_bahnen: 'Kanban mit Bahnen',
                po_tagesplan:     'Tagesplan',
                po_mindmap:       'Mindmap',
                po_roadmap:       'Roadmap',
                po_whiteboard:    'Whiteboard',
                po_diagramm:      'Diagramm',
                po_markdown:      'Markdown-Editor',
                po_raci:          'RACI-Matrix',
                po_scoring:       'Entscheidungsmatrix',
                po_matrix:        'Priorisierungsmatrix',
                po_stakeholder:   'Stakeholder-Karte',
                po_radar:         'Team-Radar',
                po_rechner:       'Rechner',
                po_timer:         'Timer',
                po_dreigewinnt:   'Drei gewinnt',
                po_viergewinnt:   'Vier gewinnt',
                po_galgen:        'Galgenmännchen',
                po_hub_ansicht:   'Übersicht (Angeheftetes)',
                myWorkstationHub: 'Übersicht (eigene Verweise)',
                po_bildausschnitt_einst: 'Bildausschnitt (Verzögerung)',
                po_mindmap_seite_aus:    'Mindmap (Seitenleiste)',
                po_roadmap_seite_aus:    'Roadmap (Seitenleiste)',
                po_sprache:       'Spracheinstellung'
            },

            /* Davon die, die keine Arbeit sind, sondern Einstellung. Sie wandern
               mit in die Sicherung — aber ein Browser, in dem nur sie stehen,
               gilt als leer. Sonst meldete der frisch ausgepackte Ordner nach dem
               ersten Sprachwechsel, es liege schon etwas darin. */
            einstellungen: [
                'po_sprache', 'po_hub_ansicht', 'po_mindmap_seite_aus',
                'po_roadmap_seite_aus', 'po_bildausschnitt_einst', 'po_timer'
            ],

            /* Schlüssel aus früheren Fassungen. Sie werden beim ersten Start
               gelesen und nicht mehr geschrieben. In die Sicherung gehören sie
               trotzdem, solange sie da sind. */
            alte: {
                mein_lokales_kanban:           'Kanban (alter Stand)',
                mein_lokales_kanban_swimlanes: 'Kanban mit Bahnen (alter Stand)',
                mein_lokales_mindmap_v2:       'Mindmap (alter Stand)',
                raci_data:                     'RACI-Matrix (alter Stand)',
                decision_matrix:               'Entscheidungsmatrix (alter Stand)',
                matrix_data:                   'Priorisierungsmatrix (alter Stand)',
                matrix_labels:                 'Priorisierungsmatrix (alte Achsen)',
                stakeholders:                  'Stakeholder-Karte (alter Stand)',
                topics:                        'Team-Radar (alte Themen)',
                members:                       'Team-Radar (alte Mitglieder)'
            },

            /* Fünf Werkzeuge legen nicht in localStorage ab, sondern in
               IndexedDB: dort passen Bilder und Tonaufnahmen hinein, die den
               Vorrat von localStorage sprengen würden.

               Die Behälter stehen mit ihrem Schlüsselpfad dabei (null heisst: der
               Schlüssel liegt ausserhalb des Wertes). Beim Sichern wäre das nicht
               nötig — da liest man sie aus der Datenbank. Beim Zurückholen in
               einen Browser, der das Werkzeug noch nie geöffnet hat, gibt es
               aber nichts zu lesen: dort muss die Übersicht die Datenbank selbst
               anlegen können. Genau das ist der Fall „neuer Rechner, Sicherung
               einlesen", und ohne diese Angaben wäre er stumm fehlgeschlagen.

               Ändert ein Werkzeug seine Behälter, gehört die Fassung hier hoch. */
            datenbanken: {
                'pocketops-notizbuch':  { werkzeug: 'Notizbuch',      fassung: 1, behaelter: { kv: null, bilder: 'id' } },
                'pocketops-dokument':   { werkzeug: 'Dokument',       fassung: 1, behaelter: { kv: null, bilder: 'id' } },
                'SlideCraftDB':         { werkzeug: 'SlideCraft',     fassung: 1, behaelter: { kv: null, library: 'id' } },
                'pocketops-sprachmemo': { werkzeug: 'Sprachmemo',     fassung: 1, behaelter: { kv: null, ton: 'id' } },
                'po_bildausschnitt':    { werkzeug: 'Bildausschnitt', fassung: 1, behaelter: { kv: null, bilder: 'id' } }
            }
        };

        /* Name des Werkzeugs zu einem Schlüssel — oder null, wenn der Schlüssel
           nicht von PocketOps stammt. Unter file:// liegt der Speicher aller
           örtlichen Seiten beieinander, da kann Fremdes dabeisein. */
        const poAblageName = k =>
            PO_ABLAGEN.schluessel[k] || PO_ABLAGEN.alte[k] || null;

        /* Gehört der Schlüssel zu PocketOps? Maßgeblich dafür, was in die
           Gesamtsicherung wandert. */
        const poAblageEigen = k => poAblageName(k) !== null;

        /* ---------- Auskunft über den Speicher ----------
           Für die Seite „Sichern & Zurückholen“, und zum Nachsehen in der Konsole,
           wenn ein Werkzeug leer startet, obwohl etwas drinstehen müsste. */

        function poBrowser() {
            const u = navigator.userAgent || '';
            if (/Firefox\//.test(u))  return 'Firefox';
            if (/Edg\//.test(u))      return 'Edge';
            if (/OPR\//.test(u))      return 'Opera';
            if (/Chrome\//.test(u))   return 'Chrome';
            if (/Safari\//.test(u))   return 'Safari';
            return 'dieser Browser';
        }

        function poSpeicherLage() {
            if (!_poSpeicherDa) return { da: false, browser: poBrowser(), bytes: 0, schluessel: [] };
            const schluessel = [];
            let bytes = 0;
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    const v = localStorage.getItem(k) || '';
                    /* Zwei Byte je Zeichen: der Browser legt UTF-16 ab, und genau
                       danach rechnet er auch seine Grenze. */
                    const b = (k.length + v.length) * 2;
                    bytes += b;
                    schluessel.push({ name: k, bytes: b });
                }
            } catch (e) { /* mitten im Zählen abgebrochen — was da ist, wird gemeldet */ }
            schluessel.sort((a, b) => b.bytes - a.bytes);
            return { da: true, browser: poBrowser(), bytes, schluessel };
        }

        /* Markenzeichen für die Kopfzeile — in jedem Werkzeug gleich */
        const PO_MARK = '<span class="po-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h16v8a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5v-8Z"/><path d="M8.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5"/><path d="M9.5 13.5h5"/></svg></span>';

        /* ======================================================================
           POCKETOPS · ZWEISPRACHIGKEIT

           Die Werkzeuge sind auf Deutsch geschrieben — Beschriftungen, Hinweise,
           Meldungen, alles. Englisch entsteht nicht aus einem zweiten Satz
           Quelltext, sondern aus einem Wörterbuch: deutscher Satz → englischer
           Satz. Ein Beobachter schreibt um, was auf der Seite steht, und merkt
           sich am Knoten das Original — darum geht beim Zurückschalten nichts
           verloren, und am deutschen Quelltext ändert sich nichts.

           Je Werkzeug steht sein Wörterbuch in einem eigenen Block
           (PO-SPRACHE, Urfassung: _design/sprache/<Datei>.js) vor diesem hier.
           Gemeinsames — Kopfzeile, Dialoge, Meldungen aus dieser Datei — steht
           unten in PO_WB_BASIS.

           Platzhalter: '{}' steht für eine Stelle, die unverändert bleibt.
               '{} von {} Fehlern'  →  '{} of {} mistakes'

           Was nie übersetzt wird: was der Nutzer selbst geschrieben hat.
           Eingabefelder, Textflächen, alles unter contenteditable und alles
           unter data-po-roh bleibt unangetastet.
           ====================================================================== */

        /* Gemeinsame Einträge. Gelten in jedem Werkzeug. */
        const PO_WB_BASIS = {
            'Zur PocketOps-Übersicht': 'To the PocketOps overview',
            'Trinkgeld': 'Tip jar',
            'Speichern': 'Save',
            /* Zwei Umfänge, zwei Beschriftungen: in der Übersicht alles auf
               einmal, im Werkzeug nur dieses eine. */
            'Tool speichern': 'Save this tool',
            'Speichern Gesamtsystem': 'Save whole system',
            'Gesamtsystem öffnen': 'Open whole system',
            'Gesamtsystem zurückholen': 'Restore whole system',
            'Ja, einlesen': 'Yes, read it in',
            'Öffnen': 'Open',
            'Zurücksetzen': 'Reset',
            'Abbrechen': 'Cancel',

        /* Text der Hilfe selbst — in beiden Sprachen, nicht über das Wörterbuch. */
        const PO_HILFE_TEXTE = {
