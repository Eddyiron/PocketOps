<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketOps · Übersicht</title>
  <!-- PO-ICON:ANFANG (Urfassung: _design/po-icon.svg · nachziehen mit _design/sync.mjs) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E %3Cdefs%3E %3ClinearGradient id='po' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E %3Cstop stop-color='%239E292B'/%3E %3Cstop offset='1' stop-color='%2339756F'/%3E %3C/linearGradient%3E %3C/defs%3E %3Crect width='32' height='32' rx='7.5' fill='url(%23po)'/%3E %3Cpath d='M11.4 11.6V9.8a2.2 2.2 0 0 1 2.2-2.2h4.8a2.2 2.2 0 0 1 2.2 2.2v1.8' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E %3Crect x='5' y='11.2' width='22' height='13.8' rx='2.6' fill='%23fff'/%3E %3Crect x='5' y='17.2' width='22' height='1.7' fill='url(%23po)'/%3E %3C/svg%3E">
  <!-- PO-ICON:ENDE -->
  <style>
    /* PO-TOKENS:ANFANG (Urfassung: _design/po-tokens.css · nachziehen mit _design/sync.mjs) */
        /* ======================================================================
           POCKETOPS · GEMEINSAME GESTALTUNG
           Nachschlagefassung. Die Werkzeuge laden diese Datei nicht — jedes trägt
           den Block selbst, damit es als einzelne Datei läuft. Wird hier etwas
           geändert, muss es in alle Werkzeuge nachgezogen werden.
           ====================================================================== */
        /* Breite und Höhe schließen Innenabstand und Rahmen ein. Ohne das rechnet
           der Browser sie obendrauf, und eine Angabe wie width:100% ragt über ihren
           Platz hinaus. */
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* Markenfarben */
            --po-accent:      #9E292B;
            --po-accent-dark: #852224;
            --po-teal:        #39756F;
            --po-teal-dark:   #2F635E;
            --po-slate:       #697896;
            --po-frost:       #81BED7;
            --po-frost-soft:  #D9F3FF;
            --po-teal-soft:   #E8F5F1;
            --po-slate-soft:  #E0E8F8;

            /* Flächen */
            --po-bg:          #F1F5F9;
            --po-surface:     #FFFFFF;
            --po-surface-2:   #F8FAFC;
            --po-surface-3:   #E2E8F0;
            --po-stage:       #CBD5E1;

            /* Kopfzeile */
            --po-chrome:      #0F172A;
            --po-chrome-2:    #1E293B;
            --po-chrome-line: #334155;
            --po-on-chrome:   #F8FAFC;
            --po-on-chrome-2: #94A3B8;

            /* Text */
            --po-ink:         #1E293B;
            --po-ink-2:       #475569;
            --po-ink-3:       #94A3B8;

            /* Linien */
            --po-line:        #E2E8F0;
            --po-line-2:      #CBD5E1;

            /* Zustände */
            --po-ok:          #39756F;
            --po-warn:        #D89B2B;
            --po-bad:         #9E292B;

            /* Maße */
            --po-r-sm:   4px;
            --po-r:      6px;
            --po-r-lg:  10px;
            --po-r-pill: 999px;
            --po-head-h: 64px;
            --po-shadow:    0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .10);
            --po-shadow-lg: 0 10px 24px -8px rgba(15, 23, 42, .25);
            --po-font: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            --po-mono: 'Cascadia Mono', Consolas, 'Courier New', monospace;
        }

        /* ---------- Seitengerüst ---------- */
        .po-body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--po-bg);
            color: var(--po-ink);
            font-family: var(--po-font);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        .po-main { flex: 1; overflow: auto; padding: 20px; }
        .po-wrap { max-width: 1280px; margin: 0 auto; }
        .po-wrap--wide { max-width: 1600px; margin: 0 auto; }
        .po-split { display: grid; gap: 16px; align-items: start; }
        .po-split--1-2 { grid-template-columns: minmax(280px, 1fr) 2fr; }
        .po-split--2-1 { grid-template-columns: 2fr minmax(280px, 1fr); }
        .po-split--1-1 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 1000px) {
            .po-split--1-2, .po-split--2-1, .po-split--1-1 { grid-template-columns: 1fr; }
        }
        .po-stack > * + * { margin-top: 12px; }
        .po-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* ---------- Kopfzeile und Marke ---------- */
        .po-head {
            height: var(--po-head-h);
            background: var(--po-chrome);
            color: var(--po-on-chrome);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 20px;
            flex-shrink: 0;
            box-shadow: var(--po-shadow);
            position: relative;
            z-index: 20;
        }
        .po-head-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .po-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            border-radius: var(--po-r);
            padding: 4px 6px;
            margin-left: -6px;
            transition: background-color .15s;
        }
        a.po-brand:hover { background: var(--po-chrome-2); }
        .po-mark {
            width: 34px;
            height: 34px;
            border-radius: var(--po-r-lg);
            background: linear-gradient(135deg, var(--po-accent), var(--po-teal));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }
        .po-mark svg { width: 19px; height: 19px; display: block; }
        .po-brand-text { display: flex; flex-direction: column; line-height: 1.1; }
        .po-line-name {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--po-on-chrome-2);
        }
        .po-tool-name { font-size: 17px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
        .po-chip {
            font-size: 10px;
            font-weight: 600;
            color: var(--po-on-chrome-2);
            background: var(--po-chrome-2);
            border: 1px solid var(--po-chrome-line);
            border-radius: var(--po-r-pill);
            padding: 3px 9px;
            white-space: nowrap;
        }
        .po-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .po-head-sep { width: 1px; height: 24px; background: var(--po-chrome-line); flex-shrink: 0; }

        /* ---------- Sprache und Anleitung in der Kopfzeile ----------
           Beides setzt po-base.js selbst in die Kopfzeile, links vor die
           Aktionen des Werkzeugs: es gehört zur Reihe, nicht zum Werkzeug. */
        .po-meta { display: flex; align-items: center; gap: 8px; }
        .po-sprach {
            display: inline-flex;
            border: 1px solid var(--po-chrome-line);
            border-radius: var(--po-r-pill);
            overflow: hidden;
            background: var(--po-chrome-2);
        }
        .po-sprach button {
            font: inherit;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            padding: 5px 10px;
            border: none;
            background: transparent;
            color: var(--po-on-chrome-2);
            cursor: pointer;
            transition: background-color .15s, color .15s;
        }
        .po-sprach button:hover { color: #fff; }
        .po-sprach button[aria-pressed="true"] { background: var(--po-accent); color: #fff; }
        .po-sprach button:focus-visible { outline: 2px solid var(--po-frost); outline-offset: -2px; }
        .po-frage {
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: var(--po-r-pill);
            border: 1px solid var(--po-chrome-line);
            background: var(--po-chrome-2);
            color: #E2E8F0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color .15s, color .15s;
        }
        .po-frage:hover { background: #2B3A4F; color: #fff; }
        .po-frage:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }

        /* Der Trinkgeldknopf steht neben dem Fragezeichen und ist genauso gebaut. Nur
           das Herz trägt Farbe — auffallen soll er, drängeln nicht. */
        .po-trinkgeld {
            font: inherit;
            font-size: 13px;
            line-height: 1;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: var(--po-r-pill);
            border: 1px solid var(--po-chrome-line);
            background: var(--po-chrome-2);
            color: #E79A9B;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color .15s, color .15s;
        }
        .po-trinkgeld:hover { background: #2B3A4F; color: #fff; }
        .po-trinkgeld:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }

        /* Ein Verweis, der wie ein Knopf aussieht, bringt die Unterstreichung mit. */
        a.po-btn { text-decoration: none; }

        /* ---------- Das Hilfefenster ---------- */
        .po-hilfe { max-height: 68vh; overflow: auto; }
        .po-hilfe p { line-height: 1.55; }
        .po-hilfe a { color: var(--po-teal); font-weight: 600; }
        .po-hilfe-titel {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--po-ink-3);
            margin: 0 0 6px;
        }
        .po-hilfe-liste { margin: 0; padding-left: 20px; }
        .po-hilfe-liste li { margin-bottom: 5px; line-height: 1.5; }
        .po-hilfe-teil { border-top: 1px solid var(--po-line); margin-top: 14px; padding-top: 12px; }

        /* ---------- Schaltflächen ---------- */
        .po-btn {
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: var(--po-r);
            border: 1px solid var(--po-line-2);
            background: var(--po-surface);
            color: var(--po-ink-2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background-color .15s, border-color .15s, color .15s;
        }
        .po-btn:hover { background: var(--po-surface-2); border-color: var(--po-slate); color: var(--po-ink); }
        .po-btn:active { transform: translateY(1px); }
        .po-btn:focus-visible { outline: 2px solid var(--po-frost); outline-offset: 1px; }
        .po-btn[disabled] { opacity: .5; cursor: not-allowed; }

        .po-head .po-btn { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #E2E8F0; }
        .po-head .po-btn:hover { background: #2B3A4F; border-color: #475569; color: #fff; }

        .po-btn--primary { background: var(--po-accent); border-color: var(--po-accent); color: #fff; }
        .po-btn--primary:hover { background: var(--po-accent-dark); border-color: var(--po-accent-dark); color: #fff; }
        .po-head .po-btn--primary { background: var(--po-accent); border-color: var(--po-accent); color: #fff; }
        .po-head .po-btn--primary:hover { background: var(--po-accent-dark); border-color: var(--po-accent-dark); color: #fff; }

        .po-btn--go { background: var(--po-teal); border-color: var(--po-teal); color: #fff; }
        .po-btn--go:hover { background: var(--po-teal-dark); border-color: var(--po-teal-dark); color: #fff; }

        .po-btn--danger { color: var(--po-bad); border-color: #FECACA; background: #FEF2F2; }
        .po-btn--danger:hover { background: #FEE2E2; border-color: #FCA5A5; color: #7F1D1D; }
        .po-head .po-btn--danger { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #FCA5A5; }
        .po-head .po-btn--danger:hover { background: #4C1D1D; border-color: #991B1B; color: #FEE2E2; }

        .po-btn--ghost { background: transparent; border-color: transparent; color: var(--po-ink-3); padding: 5px 7px; }
        .po-btn--ghost:hover { background: var(--po-surface-3); color: var(--po-ink); border-color: transparent; }

        .po-btn--sm { font-size: 11px; padding: 4px 8px; }
        .po-btn--block { width: 100%; justify-content: center; }

        /* kleines rundes Löschen-Kreuz in Listen und Tabellen */
        .po-x {
            font: inherit;
            font-size: 10px;
            line-height: 1;
            width: 18px;
            height: 18px;
            border-radius: var(--po-r-pill);
            border: 1px solid transparent;
            background: transparent;
            color: var(--po-ink-3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color .15s, color .15s;
        }
        .po-x:hover { background: #FEE2E2; color: var(--po-bad); }

        /* ---------- Panels und Abschnitte ---------- */
        .po-panel {
            background: var(--po-surface);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow);
        }
        .po-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            background: var(--po-surface-2);
            border-bottom: 1px solid var(--po-line);
            border-radius: var(--po-r-lg) var(--po-r-lg) 0 0;
        }
        .po-panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--po-ink-2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .po-panel-body { padding: 14px; }
        .po-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--po-ink-3);
            margin: 0 0 8px;
        }
        .po-hint {
            font-size: 11px;
            color: var(--po-ink-2);
            background: var(--po-surface-2);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r);
            padding: 10px 12px;
            line-height: 1.5;
        }

        /* ---------- Eingabefelder ---------- */
        .po-label { font-size: 11px; font-weight: 600; color: var(--po-ink-2); display: block; margin-bottom: 4px; }
        .po-input, .po-select, .po-textarea {
            font: inherit;
            font-size: 12px;
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--po-line-2);
            border-radius: var(--po-r);
            background: var(--po-surface);
            color: var(--po-ink);
            box-sizing: border-box;
        }
        /* Ein Farbfeld füllt der Browser selbst aus. Ohne eigene Höhe fiele es
           gegenüber den anderen Feldern zusammen, und der Innenabstand ließe den
           Farbfleck zu klein wirken. */
        .po-input[type="color"] { height: 32px; padding: 3px; cursor: pointer; }
        .po-input:focus, .po-select:focus, .po-textarea:focus {
            outline: none;
            border-color: var(--po-frost);
            box-shadow: 0 0 0 3px rgba(129, 190, 215, .25);
        }
        .po-textarea { min-height: 72px; resize: vertical; }
        .po-search { font-size: 13px; padding: 10px 14px; border-radius: var(--po-r-lg); }
        .po-num { width: 58px; text-align: center; padding: 5px 4px; }
        .po-field { display: flex; gap: 6px; align-items: center; }
        .po-field .po-input { flex: 1; min-width: 0; }

        .po-range { width: 100%; accent-color: var(--po-teal); }
        .po-range-value { font-weight: 700; color: var(--po-teal); font-variant-numeric: tabular-nums; }

        .po-check { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; font-weight: 600; color: var(--po-ink-2); cursor: pointer; }
        .po-check input { width: 15px; height: 15px; margin-top: 1px; accent-color: var(--po-teal); flex-shrink: 0; }

        /* ---------- Karten ---------- */
        .po-card {
            background: var(--po-surface);
            border: 1px solid var(--po-line);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow);
            padding: 14px;
        }
        .po-card--pick { cursor: pointer; transition: border-color .15s, background-color .15s; }
        .po-card--pick:hover { border-color: var(--po-frost); background: var(--po-surface-2); }

        /* ---------- Tabellen ---------- */
        .po-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .po-table th, .po-table td { padding: 8px 10px; border: 1px solid var(--po-line); text-align: left; }
        .po-table th {
            background: var(--po-surface-2);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--po-ink-2);
            white-space: nowrap;
        }
        .po-table tbody tr:nth-child(even) { background: var(--po-surface-2); }
        .po-table--center th, .po-table--center td { text-align: center; }
        .po-table--center th:first-child, .po-table--center td:first-child { text-align: left; }

        /* ---------- Zustände ---------- */
        .po-badge {
            font-size: 10px;
            font-weight: 700;
            border-radius: var(--po-r-pill);
            padding: 2px 8px;
            border: 1px solid transparent;
            display: inline-block;
        }
        .po-badge--ok   { color: var(--po-ok);  background: var(--po-teal-soft); border-color: #BFE3DA; }
        .po-badge--warn { color: #92610F;       background: #FEF6E7;             border-color: #F5D9A0; }
        .po-badge--bad  { color: var(--po-bad); background: #FEF2F2;             border-color: #FECACA; }
        .po-badge--neutral { color: var(--po-ink-2); background: var(--po-surface-3); border-color: var(--po-line-2); }

        .po-empty { text-align: center; color: var(--po-ink-3); font-size: 12px; padding: 28px 16px; line-height: 1.6; }

        /* ---------- Hinweisfenster unten rechts ---------- */
        .po-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 200;
            background: var(--po-chrome);
            color: var(--po-on-chrome);
            font-size: 12px;
            font-weight: 600;
            padding: 11px 16px;
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow-lg);
            max-width: 340px;
            line-height: 1.45;
        }

        /* ---------- Dialog ---------- */
        .po-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .po-dialog {
            background: var(--po-surface);
            border-radius: var(--po-r-lg);
            box-shadow: var(--po-shadow-lg);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .po-dialog-head { padding: 16px 18px 0; font-size: 15px; font-weight: 700; color: var(--po-ink); }
        .po-dialog-body { padding: 10px 18px 16px; font-size: 13px; color: var(--po-ink-2); line-height: 1.55; }
        .po-dialog-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 18px;
            background: var(--po-surface-2);
            border-top: 1px solid var(--po-line);
        }

        /* ---------- Bildlaufleisten ---------- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--po-line-2); border-radius: var(--po-r-pill); }
        ::-webkit-scrollbar-thumb:hover { background: var(--po-slate); }

        /* ---------- Druck ---------- */
        @media print {
            .po-head, .po-toast, .po-backdrop, .po-no-print { display: none !important; }
            .po-body { height: auto; overflow: visible; }
            .po-main { overflow: visible; padding: 0; }
            .po-panel { box-shadow: none; border-color: #ccc; }
        }
    /* PO-TOKENS:ENDE */

    /* Die alten Namen bleiben, die Werte kommen jetzt aus der Reihe */
    :root {
      --bg: #F1F5F9;
      --card-bg: #FFFFFF;
      --primary: #39756F;
      --primary-hover: #2F635E;
      --text: #1E293B;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .10);
    }

    * { box-sizing: border-box; font-family: var(--po-font); }
    body { background-color: var(--bg); color: var(--text); margin: 0; }

    .hub-inhalt { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; }

    /* Knöpfe ohne eigene Klasse folgen dem Aussehen der Reihe */
    button {
      font: inherit; font-size: 12px; font-weight: 600;
      padding: 7px 12px; border-radius: var(--po-r);
      border: 1px solid var(--po-line-2); background: var(--po-surface); color: var(--po-ink-2);
      cursor: pointer; transition: background-color .15s, border-color .15s, color .15s;
    }
    button:hover { background: var(--po-surface-2); border-color: var(--po-slate); color: var(--po-ink); }
    button.secondary { background: var(--po-surface); }
    button.danger { background: #FEF2F2; border-color: #FECACA; color: var(--po-bad); }
    button.danger:hover { background: #FEE2E2; border-color: #FCA5A5; color: #7F1D1D; }

    .po-head button { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #E2E8F0; }
    .po-head button:hover { background: #2B3A4F; border-color: #475569; color: #fff; }
    .po-head button.danger { background: var(--po-chrome-2); border-color: var(--po-chrome-line); color: #FCA5A5; }
    .po-head button.danger:hover { background: #4C1D1D; border-color: #991B1B; color: #FEE2E2; }

    /* Werkzeuge der Reihe */
    .wz-gruppe { margin-bottom: 22px; }
    .wz-gruppe:last-of-type { margin-bottom: 30px; }

    .wz-kopf {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: none; border: none; padding: 4px 2px 9px; cursor: pointer; text-align: left;
      color: var(--po-ink-3); border-bottom: 1px solid var(--po-line); margin-bottom: 12px;
    }
    .wz-kopf:hover { color: var(--po-ink-2); }
    .wz-kopf-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; }
    .wz-kopf-was { font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--po-ink-3); }
    .wz-kopf-zahl {
      font-size: 10px; font-variant-numeric: tabular-nums; color: var(--po-ink-3);
      background: var(--po-surface-3); border-radius: var(--po-r-pill); padding: 1px 7px; margin-left: auto;
    }
    .wz-pfeil { font-size: 9px; transition: transform .18s; display: inline-block; }
    .wz-gruppe.zu .wz-pfeil { transform: rotate(-90deg); }
    .wz-gruppe.zu .wz-raster { display: none; }

    .wz-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 12px; }

    .wz-kachel {
      position: relative; display: flex; align-items: center; gap: 12px;
      background: var(--po-surface); border: 1px solid var(--po-line); border-radius: var(--po-r-lg);
      box-shadow: var(--po-shadow); padding: 13px 15px; color: inherit;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .wz-kachel:hover { border-color: var(--po-frost); box-shadow: var(--po-shadow-lg); transform: translateY(-1px); }
    .wz-zeichen {
      width: 36px; height: 36px; border-radius: var(--po-r); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--po-teal-soft); color: var(--po-teal); font-size: 17px;
    }
    .wz-text { min-width: 0; flex: 1; }
    .wz-name {
      display: block; font-size: 13px; font-weight: 700; color: var(--po-ink);
      line-height: 1.25; text-decoration: none;
    }
    /* Die ganze Kachel wird anklickbar, ohne den Stern mitzureißen */
    .wz-name::after { content: ''; position: absolute; inset: 0; border-radius: var(--po-r-lg); }
    .wz-was { display: block; font-size: 11px; color: var(--po-ink-3); margin-top: 2px; line-height: 1.35; }

    .wz-stern {
      position: relative; z-index: 1; flex-shrink: 0;
      width: 24px; height: 24px; border: none; background: none; cursor: pointer;
      color: var(--po-line-2); font-size: 14px; line-height: 1; border-radius: var(--po-r-sm);
      opacity: 0; transition: opacity .15s, color .15s, background-color .15s;
    }
    .wz-kachel:hover .wz-stern, .wz-stern.fest { opacity: 1; }
    .wz-stern:hover { background: var(--po-surface-3); color: var(--po-warn); }
    .wz-stern.fest { color: var(--po-warn); }

    .wz-nichts { padding: 18px 2px 26px; font-size: 12px; color: var(--po-ink-3); }

    /* Search Bar */
    .search-container { margin-bottom: 25px; }
    .search-input {
      width: 100%; padding: 11px 16px; border: 1px solid var(--po-line-2);
      border-radius: var(--po-r-lg); font-size: 13px; background: var(--po-surface);
      box-shadow: var(--po-shadow); outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .search-input:focus { border-color: var(--po-frost); box-shadow: 0 0 0 3px rgba(129, 190, 215, .25); }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

    .card {
      background: var(--card-bg); border-radius: var(--po-r-lg); padding: 16px;
      box-shadow: var(--po-shadow); border: 2px solid var(--po-line); display: flex;
      flex-direction: column; position: relative; transition: border-color 0.2s, background-color 0.2s, opacity 0.2s;
      cursor: grab;
    }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: 0.4; border-color: var(--text-muted); }

    /* Drag Hover Effekte */
    .card.drag-over {
      border-color: var(--po-frost);
      background-color: var(--po-frost-soft);
    }
    .card.drag-over-card {
      border-color: var(--po-frost);
      box-shadow: 0 0 0 3px rgba(129, 190, 215, .3);
    }

    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
    }
    .card-title-group { display: flex; align-items: center; gap: 8px; }
    .card-title { font-weight: 700; font-size: 1.1rem; color: #111827; }
    .card-actions { display: flex; gap: 4px; opacity: 0.4; transition: opacity 0.2s; }
    .card:hover .card-actions { opacity: 1; }

    .icon-btn { background: none; color: var(--text-muted); padding: 4px 6px; font-size: 0.85rem; border-radius: 4px; border: none; cursor: pointer; }
    .icon-btn:hover { background: #f3f4f6; color: var(--text); }

    /* Links List & Tree */
    .link-list { list-style: none; padding: 0; margin: 0; min-height: 40px; }
    .link-item { margin-bottom: 8px; }
    .link-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; border-radius: 6px; transition: background 0.15s, opacity 0.2s;
      cursor: grab; background: #fafafa; border: 1px dashed transparent;
    }
    .link-row:active { cursor: grabbing; }
    .link-row:hover { background: var(--po-surface-2); border-color: var(--po-line); }
    .link-row.dragging { opacity: 0.4; }
    .link-row.drag-over-link { border-color: var(--po-frost); background: var(--po-frost-soft); }

    .drag-handle { color: var(--text-muted); margin-right: 6px; cursor: grab; font-size: 0.9rem; }

    .link-main {
      text-decoration: none; color: var(--text); font-weight: 500;
      flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .link-main:hover { color: var(--primary); }
    .link-meta { display: flex; align-items: center; gap: 2px; opacity: 0.3; transition: opacity 0.2s; }
    .link-row:hover .link-meta { opacity: 1; }

    /* Sublinks Tree */
    .sublink-list { list-style: none; padding-left: 18px; margin: 4px 0 6px 0; border-left: 2px solid #e5e7eb; min-height: 10px; }
    .sublink-item { margin-bottom: 4px; }
    .sublink-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 6px; border-radius: 4px; cursor: grab;
    }
    .sublink-row:active { cursor: grabbing; }
    .sublink-row:hover { background: #f3f4f6; }
    .sublink-row.dragging { opacity: 0.4; }

    .sublink-main {
      font-size: 0.85rem; text-decoration: none; color: var(--text-muted);
      flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sublink-main:hover { color: var(--text); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, .55); display: none; justify-content: center;
      align-items: center; z-index: 1000;
    }
    .modal {
      background: var(--po-surface); padding: 20px; border-radius: var(--po-r-lg);
      width: 100%; max-width: 440px; box-shadow: var(--po-shadow-lg);
    }
    .modal h2 { margin-top: 0; margin-bottom: 14px; font-size: 15px; color: var(--po-ink); }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--po-ink-2); margin-bottom: 4px; }
    .form-group input {
      width: 100%; padding: 7px 9px; border: 1px solid var(--po-line-2);
      border-radius: var(--po-r); font-size: 12px; outline: none; color: var(--po-ink);
    }
    .form-group input:focus { border-color: var(--po-frost); box-shadow: 0 0 0 3px rgba(129, 190, 215, .25); }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  </style>

<script>
  /* PO-BASE:ANFANG (Urfassung: _design/po-base.js · nachziehen mit _design/sync.mjs) */
        /* ======================================================================
           POCKETOPS · GEMEINSAME BAUSTEINE
           Nachschlagefassung. Die Werkzeuge laden diese Datei nicht — jedes trägt
           den Block selbst, damit es als einzelne Datei läuft.

           poToast(text)                  kurzer Hinweis unten rechts
           poConfirm(frage, opt)          Rückfrage, liefert ein Versprechen
           poAsk(titel, felder)           kleine Eingabemaske statt prompt()
                                          Feld: { name, label, wert, typ, pflicht }
                                          typ 'date', 'number', 'color' kommen vom
                                          Browser; typ 'auswahl' braucht zusätzlich
                                          optionen: [{ wert, text }] und wird zur Liste
           poEsc(text)                    Text für HTML entschärfen
           poDownload(name, text, typ)    Datei zum Herunterladen anbieten
           poReadFile(input, fn)          gewählte Datei als Text lesen
           ====================================================================== */

        function poEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        let _poToastTimer = null;
        function poToast(text, dauer = 2600) {
            let t = document.getElementById('po-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'po-toast';
                t.className = 'po-toast';
                document.body.appendChild(t);
            }
            t.textContent = text;
            t.style.display = 'block';
            clearTimeout(_poToastTimer);
            _poToastTimer = setTimeout(() => { t.style.display = 'none'; }, dauer);
        }

        function _poModal(innerHtml, aufbau) {
            const back = document.createElement('div');
            back.className = 'po-backdrop';
            back.innerHTML = `<div class="po-dialog" role="dialog" aria-modal="true">${innerHtml}</div>`;
            document.body.appendChild(back);
            const schliessen = () => { document.removeEventListener('keydown', aufTaste); back.remove(); };
            const aufTaste = e => { if (e.key === 'Escape') { e.preventDefault(); back.__abbruch && back.__abbruch(); } };
            document.addEventListener('keydown', aufTaste);
            back.addEventListener('mousedown', e => { if (e.target === back) back.__abbruch && back.__abbruch(); });
            aufbau(back, schliessen);
            return back;
        }

        function poConfirm(frage, { titel = 'Bitte bestätigen', ja = 'Ja, weiter', nein = 'Abbrechen', gefahr = false } = {}) {
            return new Promise(res => {
                _poModal(`
                    <div class="po-dialog-head">${poEsc(titel)}</div>
                    <div class="po-dialog-body">${poEsc(frage)}</div>
                    <div class="po-dialog-foot">
                        <button class="po-btn" data-nein>${poEsc(nein)}</button>
                        <button class="po-btn ${gefahr ? 'po-btn--primary' : 'po-btn--go'}" data-ja>${poEsc(ja)}</button>
                    </div>`, (back, schliessen) => {
                    const fertig = wert => { schliessen(); res(wert); };
                    back.__abbruch = () => fertig(false);
                    back.querySelector('[data-nein]').onclick = () => fertig(false);
                    back.querySelector('[data-ja]').onclick = () => fertig(true);
                    setTimeout(() => back.querySelector('[data-ja]').focus(), 30);
                });
            });
        }

        /* felder: [{ name, label, wert, typ: 'text'|'number', min, max, pflicht }]
           Ergebnis: Objekt mit den Werten, oder null bei Abbruch. */
        function poAsk(titel, felder, { ok = 'Hinzufügen' } = {}) {
            return new Promise(res => {
                /* typ: 'auswahl' erwartet zusätzlich optionen: [{ wert, text }] und wird
                   zur Liste. Alles andere geht als type an ein <input> — 'date', 'number'
                   und 'color' kommen so vom Browser, ohne eigenes Zutun. */
                const html = felder.map((f, i) => {
                    const feld = f.typ === 'auswahl'
                        ? `<select class="po-select" id="po-f-${i}">`
                          + (f.optionen || []).map(o =>
                                `<option value="${poEsc(o.wert)}"${String(o.wert) === String(f.wert) ? ' selected' : ''}>${poEsc(o.text)}</option>`
                            ).join('')
                          + `</select>`

                    </div>`, (back, schliessen) => {

        function poDownload(name, inhalt, typ = 'application/json') {
            const blob = new Blob([inhalt], { type: typ });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);

                try {

        /* Markenzeichen für die Kopfzeile — in jedem Werkzeug gleich */
        const PO_MARK = '<span class="po-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h16v8a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5v-8Z"/><path d="M8.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5"/><path d="M9.5 13.5h5"/></svg></span>';

        /* ======================================================================
           POCKETOPS · ZWEISPRACHIGKEIT

           Die Werkzeuge sind auf Deutsch geschrieben — Beschriftungen, Hinweise,
           Meldungen, alles. Englisch entsteht nicht aus einem zweiten Satz
           Quelltext, sondern aus einem Wörterbuch: deutscher Satz → englischer
           Satz. Ein Beobachter schreibt um, was auf der Seite steht, und merkt
           sich am Knoten das Original — darum geht beim Zurückschalten nichts
           verloren, und am deutschen Quelltext ändert sich nichts.

           Je Werkzeug steht sein Wörterbuch in einem eigenen Block
           (PO-SPRACHE, Urfassung: _design/sprache/<Datei>.js) vor diesem hier.
           Gemeinsames — Kopfzeile, Dialoge, Meldungen aus dieser Datei — steht
           unten in PO_WB_BASIS.

           Platzhalter: '{}' steht für eine Stelle, die unverändert bleibt.
               '{} von {} Fehlern'  →  '{} of {} mistakes'

           Was nie übersetzt wird: was der Nutzer selbst geschrieben hat.
           Eingabefelder, Textflächen, alles unter contenteditable und alles

           ====================================================================== */

        /* Gemeinsame Einträge. Gelten in jedem Werkzeug. */
        const PO_WB_BASIS = {
            'Zur PocketOps-Übersicht': 'To the PocketOps overview',
            'Trinkgeld': 'Tip jar',
            'Speichern': 'Save',
            'Öffnen': 'Open',

            'Drucken': 'Print',
            'Kopieren': 'Copy',
            'Anleitung': 'Help',

            'Schließen': 'Close',
            'Die Datei lässt sich nicht lesen: {}': 'The file cannot be read: {}',

        };

        /* Text der Hilfe selbst — in beiden Sprachen, nicht über das Wörterbuch. */
        const PO_HILFE_TEXTE = {
            de: {
                titel: 'Kurzanleitung',
                schritte: 'So geht es',
                tipps: 'Gut zu wissen',
                oertlich: 'Deine Arbeit bleibt auf diesem Rechner. Sie wird nirgendwohin geschickt.',
                oertlichMitNetz: 'Deine Arbeit bleibt auf diesem Rechner und wird nirgendwohin geschickt. Dieses Werkzeug lädt beim Öffnen allerdings eine Programmbibliothek nach, von: {}. Der fremde Server erfährt dabei deine IP-Adresse. Woran du arbeitest, verlässt den Rechner auch dann nicht.',
                sicherung: 'Sichern und Zurückholen',
                sicherungText: 'Mit <b>Speichern</b> legt das Werkzeug deine Arbeit als Datei neben sich — eine <b>.json</b>-Datei. Das ist nichts Gefährliches: eine Textdatei, die du mit dem Editor öffnen und lesen kannst. Mit <b>Öffnen</b> holst du sie zurück, in dieses oder in ein anderes Fenster.',
                sicherungWarum: 'Warum das wichtig ist: deine Arbeit liegt sonst nur im Browser. Räumt jemand den Browser auf, ist sie weg. Die gespeicherte Datei bleibt.',
                mehr: 'Ausführlich: Sichern &amp; Zurückholen',
                schluss: 'Verstanden'

            en: {
                titel: 'Quick guide',
                schritte: 'How it works',
                tipps: 'Worth knowing',
                oertlich: 'Your work stays on this computer. It is not sent anywhere.',
                oertlichMitNetz: 'Your work stays on this computer and is not sent anywhere. This tool does fetch a code library when it opens, from: {}. That server learns your IP address. What you are working on still never leaves the machine.',

                sicherungText: '<b>Save</b> puts your work into a file next to the tool — a <b>.json</b> file. Nothing dangerous about it: a text file you can open and read in any editor. <b>Open</b> brings it back, into this window or another one.',

        let _poSpr = 'de';

        const poSprache = () => _poSpr;

        /* ---------- Wörterbuch ---------- */

        const _poNormal = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
        const _poEscRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        let _poExakt = null, _poMuster = null;

        function _poWbBauen() {
            if (_poExakt) return;
            _poExakt = new Map();
            _poMuster = [];
            const quellen = [PO_WB_BASIS, (typeof PO_WB !== 'undefined' ? PO_WB : null)];
            for (const q of quellen) {
                if (!q) continue;
                for (const de of Object.keys(q)) {
                    const en = q[de];
                    if (!en) continue;
                    if (de.indexOf('{}') >= 0) {
                        const teile = _poNormal(de).split('{}');
                        _poMuster.push({ re: new RegExp('^' + teile.map(_poEscRe).join('([\\s\\S]*?)') + '$'), en });
                    } else {
                        _poExakt.set(_poNormal(de), en);
                    }
                }
            }
        }

        /* Was das Wörterbuch nicht kennt, wird hier gesammelt. Beim Pflegen einer
           Übersetzung zeigt poLuecken() im Browser, was noch fehlt. */
        const _poLuecken = new Set();
        function poLuecken() { return Array.from(_poLuecken).sort((a, b) => a.localeCompare(b, 'de')); }

        /* Liefert die Übersetzung oder null, wenn das Wörterbuch nichts kennt. */
        function _poNachschlagen(text) {
            _poWbBauen();
            const n = _poNormal(text);
            if (!n) return null;
            const treffer = _poExakt.get(n);
            if (treffer !== undefined) return treffer;
            for (const m of _poMuster) {
                const t = n.match(m.re);
                if (!t) continue;
                let i = 0;
                return m.en.replace(/\{\}/g, () => { i++; return t[i] === undefined ? '' : t[i]; });
            }
            if (_poLuecken.size < 2000) _poLuecken.add(n);
            return null;
        }

        /* Für Text, der nicht im Seitengerüst steht, sondern gezeichnet wird —
           auf einer Leinwand etwa. Gibt auf Deutsch den Text unverändert zurück. */
        function poT(text) {
            if (_poSpr !== 'en') return text;
            const u = _poNachschlagen(text);
            return u === null ? text : u;
        }

        /* Die englische Fassung, unabhängig von der eingestellten Sprache. Gebraucht
           dort, wo beide Sprachen zugleich gelten müssen — etwa in einem Suchfeld,
           das auch nach dem Umschalten noch finden soll. */
        function poEn(text) {
            const u = _poNachschlagen(text);
            return u === null ? text : u;
        }

        /* ---------- Die Seite umschreiben ---------- */

        const _PO_ATTR = ['placeholder', 'title', 'aria-label', 'alt'];
        const _PO_TABU = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1, PRE: 1, CODE: 1, CANVAS: 1 };

        function _poDarf(el) {
            for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
                if (_PO_TABU[e.tagName]) return false;
                if (e.isContentEditable) return false;
                if (e.hasAttribute('data-po-roh')) return false;
                if (e.hasAttribute('data-po-nur')) return false;   // steht schon in seiner Sprache
            }
            return true;
        }

        /* Längere Texte — eine ganze Seite Erklärung etwa — zerfielen im Wörterbuch
           an jedem <b> in Stücke. Dafür gibt es den zweiten Weg: zwei Blöcke, einer
           je Sprache, ausgezeichnet mit data-po-nur="de" bzw. "en". Es wird immer
           nur einer gezeigt.
           Bewusst über style.display statt über hidden: eine Klasse mit display:flex
           gewänne sonst gegen hidden, und der Block stünde trotzdem da. */
        function _poSprachbloecke() {
            document.querySelectorAll('[data-po-nur]').forEach(el => {
                el.style.display = (el.getAttribute('data-po-nur') === _poSpr) ? '' : 'none';
            });
        }

        function _poTextKnoten(k) {
            if (!k || !k.nodeValue || !k.nodeValue.trim()) return;
            if (k.nodeValue === k.__poEn) return;                 // steht schon auf Englisch
            if (!_poDarf(k.parentElement)) return;
            const neu = _poNachschlagen(k.nodeValue);
            if (neu === null) return;
            k.__poDe = k.nodeValue;
            k.nodeValue = k.nodeValue.match(/^\s*/)[0] + neu + k.nodeValue.match(/\s*$/)[0];
            k.__poEn = k.nodeValue;
        }

        function _poMerkmal(el, name) {
            if (!el || el.nodeType !== 1 || !el.hasAttribute(name)) return;
            if (!_poDarf(el)) return;
            const wert = el.getAttribute(name);
            el.__poAttrEn = el.__poAttrEn || {};
            el.__poAttrDe = el.__poAttrDe || {};
            if (wert === el.__poAttrEn[name]) return;
            const neu = _poNachschlagen(wert);
            if (neu === null) return;
            el.__poAttrDe[name] = wert;
            el.setAttribute(name, neu);
            el.__poAttrEn[name] = neu;
        }

        function _poAnwenden(wurzel) {
            if (_poSpr !== 'en' || !wurzel) return;
            if (wurzel.nodeType === 3) { _poTextKnoten(wurzel); return; }
            if (wurzel.nodeType !== 1) return;
            const lauf = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT);
            let k;
            while ((k = lauf.nextNode())) _poTextKnoten(k);
            const mit = [wurzel].concat(Array.from(wurzel.querySelectorAll('*')));
            for (const el of mit) for (const a of _PO_ATTR) if (el.hasAttribute && el.hasAttribute(a)) _poMerkmal(el, a);
        }

        function _poZurueck() {
            const lauf = document.createTreeWalker(document.documentElement, NodeFilter.SHOW_TEXT);
            let k;
            while ((k = lauf.nextNode())) {
                if (k.__poDe !== undefined && k.nodeValue === k.__poEn) { k.nodeValue = k.__poDe; k.__poEn = undefined; }
            }
            for (const el of document.querySelectorAll('*')) {
                if (!el.__poAttrDe) continue;
                for (const a of Object.keys(el.__poAttrDe)) {
                    if (el.getAttribute(a) === el.__poAttrEn[a]) el.setAttribute(a, el.__poAttrDe[a]);
                }
                el.__poAttrEn = {};
            }

        let _poStill = false;
        let _poBeob = null;

        function _poBeobachten() {
            _poBeob = new MutationObserver(aenderungen => {
                if (_poStill || _poSpr !== 'en') return;
                _poStill = true;
                try {
                    for (const a of aenderungen) {
                        if (a.type === 'childList') a.addedNodes.forEach(n => {
                            _poAnwenden(n);
                            if (n.nodeType === 1 && n.querySelector && (n.hasAttribute('data-po-nur') || n.querySelector('[data-po-nur]'))) _poSprachbloecke();
                        });
                        else if (a.type === 'characterData') _poTextKnoten(a.target);
                        else if (a.type === 'attributes') _poMerkmal(a.target, a.attributeName);
                    }
                } finally {
                    _poBeob.takeRecords();          // eigene Änderungen nicht noch einmal ansehen
                    _poStill = false;
                }
            });
            _poBeob.observe(document.documentElement, {
                childList: true, subtree: true, characterData: true,
                attributes: true, attributeFilter: _PO_ATTR
            });
        }

        /* ---------- Umschalten ---------- */

        function poSpracheSetzen(spr) {
            const neu = spr === 'en' ? 'en' : 'de';
            if (neu === _poSpr) return;
            _poSpr = neu;
            try { localStorage.setItem('po_sprache', neu); } catch (e) { /* dann eben nur für dieses Fenster */ }

            /* Beide Fenster werden geschlossen statt übersetzt: ihr Inhalt steht als
               data-po-roh und geht am Wörterbuch vorbei. Beim nächsten Öffnen baut er
               sich in der neuen Sprache neu auf. Ohne das bliebe nach einem Wechsel
               bei offenem Fenster die alte Sprache stehen. */

            if (hilfe) hilfe.remove();
            const trinkgeld = document.getElementById('po-trinkgeld-fenster');
            if (trinkgeld) trinkgeld.remove();
            _poStill = true;
            try {
                if (neu === 'en') _poAnwenden(document.documentElement);
                else _poZurueck();
            } finally {
                if (_poBeob) _poBeob.takeRecords();
                _poStill = false;
            }
            _poSprachbloecke();
            _poKopfMalen();
            // Werkzeuge, die selbst zeichnen, müssen danach neu zeichnen.
            if (typeof poNeuZeichnen === 'function') poNeuZeichnen();
        }

        function _poKopfMalen() {

        function poTrinkgeld() {

        /* ---------- Die Anleitung ---------- */

        /* Die Werkzeuge liegen im Ordner tools/, die Übersicht eine Ebene darüber.
           Woran sich das erkennen lässt: nur ein Werkzeug trägt das Markenzeichen als
           Rückverweis; auf der Übersicht selbst steht es als blosser Text. */
        const _poSicherungPfad = () => document.querySelector('a.po-brand') ? 'Sicherung.html' : 'tools/Sicherung.html';

        /* Die Rechner, von denen diese Seite etwas nachlädt — ohne Doppelte. */
        function _poFremdquellen() {
            return [...document.querySelectorAll('script[src], link[rel="stylesheet"][href]')]
                .map(e => e.getAttribute('src') || e.getAttribute('href'))
                .filter(u => /^https?:\/\//i.test(u || ''))

        function poHilfe() {

            const h = (typeof PO_HILFE !== 'undefined' && PO_HILFE && PO_HILFE[_poSpr]) ? PO_HILFE[_poSpr] : null;
            const name = (document.querySelector('.po-tool-name') || {}).textContent || 'PocketOps';

  const ALLE_WERKZEUGE = GRUPPEN.flatMap(g => g.werkzeuge);

  /* ---------- Angeheftet und zugeklappt ---------- */

  let angeheftet = [];
  let zugeklappt = [];

  function hubEinstellungenLaden() {
    try {
      const d = JSON.parse(localStorage.getItem('po_hub_ansicht') || 'null');
      if (d) {
        /* Vor dem Umzug nach tools/ standen hier blosse Dateinamen. Ohne das
           hier verlören angeheftete Werkzeuge beim ersten Start ihren Platz. */
        angeheftet = (d.angeheftet || [])
            .map(x => (x.indexOf('/') < 0 ? 'tools/' + x : x))
            .filter(x => ALLE_WERKZEUGE.some(w => w.datei === x));
        zugeklappt = (d.zugeklappt || []).filter(x => GRUPPEN.some(g => g.id === x) || x === 'angeheftet');
      }
    } catch (e) { /* unbrauchbarer Stand wird verworfen */ }
  }

  function hubEinstellungenSichern() {
    try { localStorage.setItem('po_hub_ansicht', JSON.stringify({ angeheftet, zugeklappt })); }
    catch (e) { /* ohne Speicher gilt die Ansicht nur bis zum Neuladen */ }
  }

  function anheften(datei, ev) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    angeheftet = angeheftet.includes(datei) ? angeheftet.filter(x => x !== datei) : angeheftet.concat([datei]);
    hubEinstellungenSichern();
    renderWerkzeuge();
    filterHub();
  }

  function gruppeUmschalten(id) {
    zugeklappt = zugeklappt.includes(id) ? zugeklappt.filter(x => x !== id) : zugeklappt.concat([id]);
    hubEinstellungenSichern();
    renderWerkzeuge();
    filterHub();
  }

  /* ---------- Zeichnen ---------- */

  function kachel(w) {
    const fest = angeheftet.includes(w.datei);
    // Gesucht wird in beiden Sprachen: die Kachel steht auf Englisch da,
    // der Eintrag im Quelltext ist deutsch. Beides muss finden lassen.
    return `<div class="wz-kachel" data-suche="${poEsc((w.name + ' ' + w.was + ' ' + poEn(w.name) + ' ' + poEn(w.was)).toLowerCase())}" data-datei="${poEsc(w.datei)}">
        <span class="wz-zeichen">${w.zeichen}</span>
        <span class="wz-text">
          <a class="wz-name" href="${encodeURI(w.datei)}">${poEsc(w.name)}</a>
          <span class="wz-was">${poEsc(w.was)}</span>
        </span>
        <button class="wz-stern ${fest ? 'fest' : ''}" onclick="anheften('${poEsc(w.datei)}', event)"
                title="${fest ? 'Nicht mehr anheften' : 'Oben anheften'}" aria-label="Anheften">${fest ? '★' : '☆'}</button>
      </div>`;
  }

  function gruppe(id, name, was, werkzeuge) {
    if (!werkzeuge.length) return '';
    const zu = zugeklappt.includes(id);
    return `<section class="wz-gruppe ${zu ? 'zu' : ''}" data-gruppe="${id}">
        <button class="wz-kopf" onclick="gruppeUmschalten('${id}')" aria-expanded="${!zu}">
          <span class="wz-pfeil">▼</span>
          <span class="wz-kopf-name">${poEsc(name)}</span>
          <span class="wz-kopf-was">${poEsc(was)}</span>
          <span class="wz-kopf-zahl">${werkzeuge.length}</span>
        </button>
        <div class="wz-raster">${werkzeuge.map(kachel).join('')}</div>
      </section>`;
  }

  function renderWerkzeuge() {
    const feste = angeheftet.map(d => ALLE_WERKZEUGE.find(w => w.datei === d)).filter(Boolean);
    let html = feste.length ? gruppe('angeheftet', 'Angeheftet', 'von dir nach oben geholt', feste) : '';
    GRUPPEN.forEach(g => {
      html += gruppe(g.id, g.name, g.was, g.werkzeuge.filter(w => !angeheftet.includes(w.datei)));
    });
    document.getElementById('werkzeuge').innerHTML = html;
  }

  const defaultData = [

    render();

  function resetData() {
    /* Hier wird nur der eigene Schlüssel geleert. Was in den Werkzeugen steckt,
       liegt unter deren eigenen Schlüsseln und wird nicht angerührt — der Text
       sagt das ausdrücklich, weil „Zurücksetzen“ sonst nach allem klingt. */

            + 'Was in den Werkzeugen steckt — Kanban, Notizbuch, Roadmap und die übrigen — bleibt unberührt.',
              { titel: 'Eigene Verweise zurücksetzen', ja: 'Ja, Verweise löschen', gefahr: true }).then(ja => {

  }

  function render() {
    const grid = document.getElementById('categoryGrid');

      card.dataset.id = cat.id;

      card.addEventListener('dragstart', handleDragStart);
      card.addEventListener('dragend', handleDragEnd);
      card.addEventListener('dragover', handleDragOverCard);
      card.addEventListener('dragleave', handleDragLeaveCard);
      card.addEventListener('drop', handleDropOnCard);

      let linksHtml = '';
      if(cat.links) {
        cat.links.forEach(link => {
          let sublinksHtml = '';
          if(link.sublinks && link.sublinks.length > 0) {
            sublinksHtml = `<ul class="sublink-list" data-cat-id="${cat.id}" data-link-id="${link.id}">` + link.sublinks.map(sub => `

                    <button class="icon-btn" onclick="deleteSublink('${cat.id}', '${link.id}', '${sub.id}')" title="Unterlink löschen">✕</button>
                  </div>
                </div>
              </li>
            `).join('') + `</ul>`;
          }

          linksHtml += `
            <li class="link-item">
              <div class="link-row"
                   draggable="true"
                   data-drag-type="link"
                   data-cat-id="${cat.id}"
                   data-link-id="${link.id}">
                <span class="drag-handle">⋮⋮</span>
                <a href="${link.url}" target="_blank" class="link-main">${link.title}</a>
                <div class="link-meta">
                  <button class="icon-btn" onclick="openSublinkModal('${cat.id}', '${link.id}')" title="Unterlink hinzufügen">+ Unterlink</button>
                  <button class="icon-btn" onclick="openEditLinkModal('${cat.id}', '${link.id}')" title="Link bearbeiten">✏️</button>
                  <button class="icon-btn" onclick="deleteLink('${cat.id}', '${link.id}')" title="Link löschen">✕</button>

      card.innerHTML = `

            <button class="icon-btn" onclick="deleteCategory('${cat.id}')" title="Kategorie löschen">🗑️</button>
          </div>

        <ul class="link-list">
          ${linksHtml}

      `;

      grid.appendChild(card);

  // --- DRAG AND DROP LOGIK ---

  function attachDragEvents() {
    // Event-Listener für Links & Unterlinks registrieren
    document.querySelectorAll('.link-row, .sublink-row').forEach(elem => {
      elem.addEventListener('dragstart', handleDragStart);
      elem.addEventListener('dragend', handleDragEnd);
    });

    // Dropzone für Unterlinks auf Link-Zeilen
    document.querySelectorAll('.link-row').forEach(row => {
      row.addEventListener('dragover', handleDragOverLink);
      row.addEventListener('dragleave', handleDragLeaveLink);
      row.addEventListener('drop', handleDropOnLink);
    });
  }

  function handleDragStart(e) {
    e.stopPropagation();
    draggedElement = {
      type: this.dataset.dragType,
      catId: this.dataset.catId || this.dataset.id,
      linkId: this.dataset.linkId,
      sublinkId: this.dataset.sublinkId
    };
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragEnd(e) {
    this.classList.remove('dragging');
    document.querySelectorAll('.drag-over, .drag-over-link, .drag-over-card').forEach(el => {
      el.classList.remove('drag-over', 'drag-over-link', 'drag-over-card');
    });
  }

  // Karten-Dropzone (Für Haupt-Links & Kategorien)
  function handleDragOverCard(e) {
    e.preventDefault();
    if (!draggedElement) return;

    if (draggedElement.type === 'link') {
      this.classList.add('drag-over');
      e.dataTransfer.dropEffect = 'move';
    } else if (draggedElement.type === 'category' && draggedElement.catId !== this.dataset.id) {
      this.classList.add('drag-over-card');
      e.dataTransfer.dropEffect = 'move';
    }
  }

  function handleDragLeaveCard(e) {
    this.classList.remove('drag-over', 'drag-over-card');
  }

  function handleDropOnCard(e) {
    e.preventDefault();
    e.stopPropagation();
    this.classList.remove('drag-over', 'drag-over-card');

    if (!draggedElement) return;

    const targetCatId = this.dataset.id;
    const sourceCatId = draggedElement.catId;

    // Kategorie verschieben
    if (draggedElement.type === 'category') {
      if (sourceCatId === targetCatId) return;

      const sourceIndex = hubData.findIndex(c => c.id === sourceCatId);
      const targetIndex = hubData.findIndex(c => c.id === targetCatId);

      if (sourceIndex > -1 && targetIndex > -1) {
        const [movedCat] = hubData.splice(sourceIndex, 1);
        hubData.splice(targetIndex, 0, movedCat);
        saveData();
      }
      return;
    }

    // Link verschieben
    if (draggedElement.type === 'link') {
      const linkId = draggedElement.linkId;
      if (sourceCatId === targetCatId) return;

      const sourceCat = hubData.find(c => c.id === sourceCatId);
      const targetCat = hubData.find(c => c.id === targetCatId);

      if (sourceCat && targetCat) {
        const linkIndex = sourceCat.links.findIndex(l => l.id === linkId);
        if (linkIndex > -1) {
          const [movedLink] = sourceCat.links.splice(linkIndex, 1);
          targetCat.links.push(movedLink);
          saveData();
        }
      }
    }
  }

  // Link-Row Dropzone (Für Unterlinks)
  function handleDragOverLink(e) {
    if (draggedElement && draggedElement.type === 'sublink') {
      e.preventDefault();
      e.stopPropagation();
      this.classList.add('drag-over-link');
      e.dataTransfer.dropEffect = 'move';
    }
  }

  function handleDragLeaveLink(e) {
    this.classList.remove('drag-over-link');
  }

  function handleDropOnLink(e) {
    if (!draggedElement || draggedElement.type !== 'sublink') return;
    e.preventDefault();
    e.stopPropagation();
    this.classList.remove('drag-over-link');

    const targetCatId = this.dataset.catId;
    const targetLinkId = this.dataset.linkId;

    const sourceCatId = draggedElement.catId;
    const sourceLinkId = draggedElement.linkId;
    const sublinkId = draggedElement.sublinkId;

    const sourceCat = hubData.find(c => c.id === sourceCatId);
    const sourceLink = sourceCat ? sourceCat.links.find(l => l.id === sourceLinkId) : null;

    const targetCat = hubData.find(c => c.id === targetCatId);
    const targetLink = targetCat ? targetCat.links.find(l => l.id === targetLinkId) : null;

    if (sourceLink && targetLink) {
      const subIndex = sourceLink.sublinks.findIndex(s => s.id === sublinkId);
      if (subIndex > -1) {
        const [movedSublink] = sourceLink.sublinks.splice(subIndex, 1);
        if (!targetLink.sublinks) targetLink.sublinks = [];
        targetLink.sublinks.push(movedSublink);
        saveData();
      }
    }
  }

  function openEditSublinkModal(catId, linkId, sublinkId) {
    const cat = hubData.find(c => c.id === catId);

  modalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const action = document.getElementById('modalAction').value;
    const type = document.getElementById('modalType').value;
    const title = document.getElementById('inputTitle').value;
    const url = document.getElementById('inputUrl').value;
    const catId = document.getElementById('targetCatId').value;
    const linkId = document.getElementById('targetLinkId').value;
    const sublinkId = document.getElementById('targetSublinkId').value;

    if (type === 'category') {
      if (action === 'add') {
        hubData.push({ id: 'cat_' + Date.now(), title: title, links: [] });
      } else {
        const cat = hubData.find(c => c.id === catId);
        if (cat) cat.title = title;
      }
    } else if (type === 'link') {
      const cat = hubData.find(c => c.id === catId);
      if (cat) {
        if (action === 'add') {
          cat.links.push({ id: 'link_' + Date.now(), title: title, url: url, sublinks: [] });
        } else {
          const link = cat.links.find(l => l.id === linkId);
          if (link) {
            link.title = title;
            link.url = url;
          }
        }
      }
    } else if (type === 'sublink') {
      const cat = hubData.find(c => c.id === catId);
      const link = cat ? cat.links.find(l => l.id === linkId) : null;
      if (link) {
        if (!link.sublinks) link.sublinks = [];
        if (action === 'add') {
          link.sublinks.push({ id: 'sub_' + Date.now(), title: title, url: url });
        } else {
          const sub = link.sublinks.find(s => s.id === sublinkId);
          if (sub) {
            sub.title = title;
            sub.url = url;
          }
        }
      }
    }

    saveData();
    closeModal();
  });

  // Löschen Logik
  function deleteCategory(catId) {
    const cat = hubData.find(c => c.id === catId);
    if (!cat) return;
    const n = (cat.links || []).length;
    poConfirm(n ? `Die Gruppe „${cat.title}" und ihre ${n} Verweis${n === 1 ? '' : 'e'} werden gelöscht.`
                : `Die Gruppe „${cat.title}" wird gelöscht. Sie ist leer.`,
              { titel: 'Gruppe löschen', ja: 'Ja, löschen', gefahr: true }).then(ja => {
      if (!ja) return;
      hubData = hubData.filter(c => c.id !== catId);
      saveData();
    });
  }

  function deleteLink(catId, linkId) {
    const cat = hubData.find(c => c.id === catId);
    if(cat) {
      cat.links = cat.links.filter(l => l.id !== linkId);
      saveData();
    }
  }

  function deleteSublink(catId, linkId, sublinkId) {
    const cat = hubData.find(c => c.id === catId);
    const link = cat ? cat.links.find(l => l.id === linkId) : null;
    if(link && link.sublinks) {
      link.sublinks = link.sublinks.filter(s => s.id !== sublinkId);
      saveData();
    }
  }

  // Suche
  function filterHub() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();

    // Werkzeuge
    let sichtbar = 0;
    document.querySelectorAll('.wz-kachel').forEach(k => {
      const passt = !q || k.dataset.suche.includes(q);
      k.style.display = passt ? '' : 'none';
      if (passt) sichtbar++;
    });
    // Beim Suchen klappen die Gruppen von selbst auf, sonst bliebe ein Treffer verborgen
    document.querySelectorAll('.wz-gruppe').forEach(g => {
      const treffer = Array.from(g.querySelectorAll('.wz-kachel')).filter(k => k.style.display !== 'none').length;
      g.style.display = treffer ? '' : 'none';
      g.classList.toggle('zu', !q && zugeklappt.includes(g.dataset.gruppe));
      const zahl = g.querySelector('.wz-kopf-zahl');
      if (zahl) zahl.textContent = treffer;
    });
    document.getElementById('wz-nichts').style.display = (q && !sichtbar) ? '' : 'none';

    // Eigene Verweise
    let karten = 0;
    document.querySelectorAll('.card').forEach(card => {
      const passt = !q || card.innerText.toLowerCase().includes(q);
      card.style.display = passt ? 'flex' : 'none';
      if (passt) karten++;
    });
    document.getElementById('eigene-kopf').style.display = (q && !karten) ? 'none' : '';
  }

  // Enter öffnet den ersten sichtbaren Treffer, Esc leert die Suche
  function sucheTaste(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      document.getElementById('searchInput').value = '';
      filterHub();
      return;
    }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const erste = Array.from(document.querySelectorAll('.wz-kachel'))
      .find(k => k.style.display !== 'none');
    if (erste) location.href = encodeURI(erste.dataset.datei);
  }

  // Backup & Import
  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(hubData, null, 2));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = "workstation_hub_backup.json";
    a.click();
  }

  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = event => {
        hubData = JSON.parse(event.target.result);
        saveData();
      };
      reader.readAsText(file);
    };
    input.click();
  }

  hubEinstellungenLaden();
  renderWerkzeuge();
  render();
</script>
</body>
</html>
